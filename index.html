/* ---------- Orçamentos ---------- */
function renderBudgets(v) {
  const spent = spentByCategory(UI.month);
  const expCats = catsSorted('despesa');
  const withBudget = [];
  const without = [];
  for (const c of expCats) {
    const b = DB.budgets.find(x => x.categoryId === c.id);
    const e = b && budgetAt(b, UI.month); // o orçamento como estava nesse mês (limite e alerta em vigor)
    if (e) withBudget.push({ cat: c, limit: e.limit, spent: spent.get(c.id) || 0, alertPct: budgetAlertPctOf(e), alertOn: budgetAlertOn(e) });
    else without.push(c);
  }
  const totLimit = withBudget.reduce((s, b) => s + b.limit, 0);
  const totSpent = withBudget.reduce((s, b) => s + b.spent, 0);

  const meterFor = meterColors;
  const alertPct = budgetAlertPct(); // o total usa a % por defeito

  v.innerHTML = `
    ${withBudget.length ? `
    <div class="card" style="margin-bottom:18px">
      <div class="card-head">
        <span class="card-title">Total orçamentado — <span style="text-transform:capitalize">${esc(monthLabel(UI.month))}</span></span>
        <span class="card-note"><strong style="color:var(--ink)">${fmt(totSpent)}</strong> de ${fmt(totLimit)}</span>
      </div>
      ${(() => { const p = totLimit ? totSpent / totLimit : 0; const mcol = meterFor(p); return `
        <div class="b-meter-row">
          <div class="meter" style="background:${mcol.track}"><div class="fill" style="width:${Math.min(p * 100, 100).toFixed(1)}%;background:${mcol.fill}"></div></div>
          <span class="b-pct ${p > 1 ? 'over' : p >= alertPct ? 'near' : ''}">${(p * 100).toFixed(0)} %</span>
        </div>
        <div class="b-status ${p > 1 ? 'over' : p >= alertPct ? 'near' : ''}" style="margin-top:8px">${p > 1 ? `Excedeste o total em ${fmt(totSpent - totLimit)}` : `Restam ${fmt(totLimit - totSpent)} no total`}</div>`; })()}
    </div>
    <div class="budget-grid">
      ${withBudget.map(b => {
        const pct = b.spent / b.limit;
        const mcol = meterFor(pct, b.alertPct);
        const alertTxt = `${Math.round(b.alertPct * 100)} %`;
        return `
        <div class="budget-card" data-cat="${b.cat.id}">
          <div class="b-head">
            <span class="b-name"><span class="c-dot" style="background:${catColor(b.cat)}"></span>${esc(b.cat.name)}
              <span class="b-alert${b.alertOn ? ' on' : ''}" title="${b.alertOn ? `Alerta na Visão geral a partir de ${alertTxt} do limite` : `Sem alerta na Visão geral (quase no limite a partir de ${alertTxt})`}">${b.alertOn ? I.bell : I.bellOff}${alertTxt}</span>
            </span>
            <span style="white-space:nowrap">
              <button class="btn-icon" data-edit-budget="${b.cat.id}" title="Editar limite e alerta">${I.edit}</button>
              <button class="btn-icon danger" data-del-budget="${b.cat.id}" title="Remover orçamento">${I.trash}</button>
            </span>
          </div>
          <div class="b-meter-row">
            <div class="meter" style="background:${mcol.track}"><div class="fill" style="width:${Math.min(pct * 100, 100).toFixed(1)}%;background:${mcol.fill}"></div></div>
            <span class="b-pct ${pct > 1 ? 'over' : pct >= b.alertPct ? 'near' : ''}">${(pct * 100).toFixed(0)} %</span>
          </div>
          <div class="b-nums"><span><strong>${fmt(b.spent)}</strong> gastos</span><span>limite ${fmt(b.limit)}</span></div>
          <div class="b-status ${pct > 1 ? 'over' : pct >= b.alertPct ? 'near' : ''}">
            ${pct > 1 ? `⚠ Excedido em ${fmt(b.spent - b.limit)}` : pct >= b.alertPct ? `Quase no limite — restam ${fmt(b.limit - b.spent)}` : `Restam ${fmt(b.limit - b.spent)}`}
          </div>
        </div>`;
      }).join('')}
    </div>` : `
    <div class="card"><div class="empty">
      <div class="e-icon">${I.budget}</div>
      <h3>Ainda sem orçamentos</h3>
      <p>Define limites mensais por categoria para controlares os gastos.</p>
    </div></div>`}

    ${without.length ? `
    <div class="card" style="margin-top:18px">
      <div class="card-head"><span class="card-title">Categorias sem orçamento</span></div>
      ${without.map(c => `
        <div class="no-budget-row">
          <span class="n"><span class="c-dot" style="background:${catColor(c)};width:8px;height:8px;border-radius:3px;display:inline-block"></span>${esc(c.name)}<span style="color:var(--ink-3);font-size:12px">· ${fmt(spent.get(c.id) || 0)} este mês</span></span>
          <button class="btn" data-set-budget="${c.id}" style="padding:5px 11px;font-size:12px">Definir limite</button>
        </div>`).join('')}
    </div>` : ''}
  `;

  $$('[data-set-budget]', v).forEach(b => b.addEventListener('click', () => openBudgetModal(b.dataset.setBudget)));
  $$('[data-edit-budget]', v).forEach(b => b.addEventListener('click', () => openBudgetModal(b.dataset.editBudget)));
  $$('[data-del-budget]', v).forEach(b => b.addEventListener('click', () => removeBudgetFrom(b.dataset.delBudget, UI.month)));
}

// remover um orçamento a partir de um mês: os meses anteriores mantêm o orçamento que tinham
function removeBudgetFrom(categoryId, ym) {
  const b = DB.budgets.find(x => x.categoryId === categoryId);
  if (!b) return;
  const name = catById(categoryId)?.name || 'esta categoria';
  const before = budgetEntries(b).filter(e => !e.from || e.from < ym).map(e => ({ ...e }));
  const keepsPast = before.some(e => e.limit > 0);
  confirmModal({
    title: 'Remover orçamento?',
    message: keepsPast
      ? `O orçamento de «${esc(name)}» deixa de existir a partir de ${esc(monthLabel(ym))}. Os meses anteriores mantêm o orçamento que tinham.`
      : `O orçamento de «${esc(name)}» é apagado (antes de ${esc(monthLabel(ym))} não havia orçamento).`,
    confirmLabel: 'Remover',
    danger: true,
    onConfirm() {
      if (keepsPast) { b.history = [...before, { from: ym, limit: 0 }]; syncBudgetTop(b); }
      else DB.budgets = DB.budgets.filter(x => x !== b);
      save(); render();
      toast(keepsPast ? `Orçamento removido a partir de ${monthLabel(ym)}` : 'Orçamento removido');
    },
  });
}

// ym: o mês que estás a ver — a janela mostra o orçamento como estava nesse mês e, por defeito, a mudança vale a partir dele
function openBudgetModal(categoryId, ym = UI.month) {
  const cat = catById(categoryId);
  const existing = DB.budgets.find(b => b.categoryId === categoryId);
  const entries = existing ? budgetEntries(existing).map(e => ({ ...e })) : []; // cópia: só muda ao guardar
  const dels = new Set();                                                        // entradas do histórico a apagar
  const remaining = () => entries.filter((_, i) => !dels.has(i));
  const activeAt = (list, m) => { const e = budgetEntryAt(list, m); return e && e.limit > 0 ? e : null; };
  const cur = activeAt(entries, ym);
  const on = cur ? budgetAlertOn(cur) : true;                                    // orçamento novo: alerta ligado
  const pctNow = Math.round((cur ? budgetAlertPctOf(cur) : budgetAlertPct()) * 100);
  const toInput = c => (c / 100).toFixed(2).replace('.', ',');
  const monthTxt = m => `${monthShort(m)} ${m.slice(0, 4)}`;                      // «nov 2026»
  openModal({
    title: `Orçamento — ${cat.name}`,
    body: `
      <div class="form-row">
        <div class="field" id="fLimit"><label>Limite mensal (€)</label>
          <input id="inLimit" inputmode="decimal" placeholder="0,00" value="${cur ? toInput(cur.limit) : ''}" autocomplete="off">
          <div class="err">Indica um valor válido maior que zero.</div></div>
        <div class="field"><label>A partir de</label>${datePickHTML({ id: 'inBudFrom', type: 'month', value: ym, short: true, title: 'A partir de' })}</div>
      </div>
      <p class="field-hint" style="margin:-6px 0 12px">O limite e o alerta valem a partir desse mês (até à mudança seguinte, se houver). Os meses anteriores mantêm o orçamento que tinham.</p>
      <div class="opt-sec">
        <div class="pref-row">
          <div class="pref-txt">
            <div class="p-t">Alertar na Visão geral</div>
            <div class="p-d">Quando os gastos desta categoria chegarem à percentagem abaixo, o orçamento aparece em «Orçamentos em alerta».</div>
          </div>
          <label class="switch" title="Alertar na Visão geral">
            <input type="checkbox" id="inBudAlertOn" role="switch"${on ? ' checked' : ''}>
            <span class="slider"></span>
          </label>
        </div>
        <div class="field" id="fBudPct"><label>Alertar a partir de</label>
          <div class="inline-unit"><input id="inBudPct" inputmode="numeric" value="${pctNow}" autocomplete="off"><span>% do limite</span></div>
          <div class="err">Indica uma percentagem (1 a 100).</div>
        </div>
        <p class="field-hint" style="margin:-4px 0 12px">É também a partir daqui que o orçamento fica «quase no limite» (amarelo), mesmo com o alerta desligado.</p>
      </div>
      ${entries.length ? `
      <div class="opt-hist bud-hist">
        <div class="h-t">Histórico</div>
        <div id="budHist"></div>
        <input type="hidden" id="inBudHistDel" value="">
      </div>` : ''}`,
    footHtml: `<button class="btn" data-cancel>Cancelar</button><button class="btn btn-primary" data-save>Guardar</button>`,
    onMount(bd) {
      $('[data-cancel]', bd).addEventListener('click', closeModal);
      const inFrom = $('#inBudFrom', bd);
      const fromMonth = () => /^\d{4}-\d{2}$/.test(inFrom.value) ? inFrom.value : ym;

      // histórico: cada linha com 🗑 (só se apaga ao guardar); marca o que está em vigor no mês que estás a ver
      const paintHist = () => {
        const box = $('#budHist', bd);
        if (!box) return;
        const inForce = budgetEntryAt(remaining(), ym);
        const rows = entries.map((e, i) => dels.has(i) ? '' : `
          <div class="h-r bh-row${e === inForce ? ' now' : ''}">
            <span>${e.from ? `desde ${esc(monthTxt(e.from))}` : 'desde sempre'} — ${e.limit > 0
              ? `${fmt(e.limit)} · ${budgetAlertOn(e) ? 'alerta' : 'sem alerta'} ${Math.round(budgetAlertPctOf(e) * 100)} %`
              : 'sem orçamento'}${e === inForce ? ` <span class="bh-now">em vigor em ${esc(monthTxt(ym))}</span>` : ''}</span>
            <button type="button" class="btn-icon danger" data-hdel="${i}" title="Apagar esta entrada" aria-label="Apagar esta entrada">${I.trash}</button>
          </div>`).join('');
        box.innerHTML = rows || '<div class="h-r">Sem entradas — ao guardar sem limite, o orçamento é apagado.</div>';
        $$('[data-hdel]', box).forEach(btn => btn.addEventListener('click', () => {
          dels.add(Number(btn.dataset.hdel));
          $('#inBudHistDel', bd).value = [...dels].sort((a, b) => a - b).join(','); // para o aviso «sair sem guardar»
          // os campos passam a mostrar o que fica em vigor nesse mês sem a entrada apagada
          const act = activeAt(remaining(), fromMonth());
          $('#inLimit', bd).value = act ? toInput(act.limit) : '';
          $('#inBudAlertOn', bd).checked = act ? budgetAlertOn(act) : true;
          $('#inBudPct', bd).value = Math.round((act ? budgetAlertPctOf(act) : budgetAlertPct()) * 100);
          paintHist();
        }));
      };
      paintHist();

      const saveFn = () => {
        const rawLimit = $('#inLimit', bd).value.trim();
        const onlyDeletes = !rawLimit && dels.size > 0;   // apagou entradas e deixou o limite vazio
        const limit = onlyDeletes ? 0 : parseAmount(rawLimit);
        $('#fLimit', bd).classList.toggle('invalid', !onlyDeletes && !limit);
        const rawPct = $('#inBudPct', bd).value.trim();
        const pct = Math.round(Number(rawPct.replace(',', '.')));
        const badPct = !onlyDeletes && (!rawPct || !Number.isFinite(pct) || pct < 1 || pct > 100);
        $('#fBudPct', bd).classList.toggle('invalid', badPct);
        if ((!onlyDeletes && !limit) || badPct) return;
        const alertOn = $('#inBudAlertOn', bd).checked;
        const from = fromMonth();
        let hist = remaining();
        let added = false;
        if (!onlyDeletes) {
          const was = budgetEntryAt(hist, from);
          const same = was && was.limit === limit && Math.round(budgetAlertPctOf(was) * 100) === pct && budgetAlertOn(was) === alertOn;
          if (same && !dels.size) { closeModal(); return; }  // nada mudou: os dados ficam como estavam
          if (!same) { hist = [...hist.filter(e => (e.from || null) !== from), { from, limit, alertPct: pct, alertOn }]; added = true; }
        }
        hist.sort((x, y) => (x.from || '').localeCompare(y.from || ''));
        const gone = !hist.some(e => e.limit > 0);  // sem nenhum mês com orçamento: apaga-o
        if (gone) DB.budgets = DB.budgets.filter(b => b.categoryId !== categoryId);
        else if (existing) { existing.history = hist; syncBudgetTop(existing); }
        else { const nb = { categoryId, history: hist }; syncBudgetTop(nb); DB.budgets.push(nb); }
        save(); closeModal(); render();
        if (gone) toast('Orçamento apagado');
        else if (!added) toast('Histórico do orçamento atualizado');
        else toast(`Orçamento guardado a partir de ${monthTxt(from)} · ${alertOn ? `alerta aos ${pct} %` : 'sem alerta na Visão geral'}`);
      };
      $('[data-save]', bd).addEventListener('click', saveFn);
      bd.addEventListener('keydown', e => { if (e.key === 'Enter' && e.target.tagName !== 'BUTTON') { e.preventDefault(); saveFn(); } });
    },
  });
}

/* ---------- Objetivos ---------- */
// cor de cada objetivo: a da ordem antiga (concluídos no fim, por data de criação) — não muda com a ordenação por prazo
function goalColor(g) {
  const order = [...(DB.goals || [])].sort((a, b) => (a.done - b.done) || (a.createdAt || '').localeCompare(b.createdAt || ''));
  return PALETTE[order.indexOf(g) % PALETTE.length];
}

function renderGoals(v) {
  // só os ativos: prazo mais perto primeiro (mesmo que criado depois) e sem prazo no fim.
  // Os concluídos ficam na sua própria janela («Objetivos concluídos», no fim da página)
  const goals = (DB.goals || []).filter(g => !g.done).sort((a, b) =>
    ((a.deadline ? 0 : 1) - (b.deadline ? 0 : 1))
    || (a.deadline || '').localeCompare(b.deadline || '')
    || (a.createdAt || '').localeCompare(b.createdAt || ''));
  const active = goals;
  const doneCount = (DB.goals || []).filter(g => g.done).length;
  const reserved = goalsReserved();

  const deadlineHint = g => {
    if (!g.deadline) return '';
    const saved = goalSaved(g);
    const missing = g.target - saved;
    const [y, m] = g.deadline.split('-').map(Number);
    const monthsLeft = goalMonthsLeft(g.deadline); // conta o mês atual (ver goalMonthsLeft)
    const label = new Date(y, m - 1, 1).toLocaleDateString('pt-PT', { month: 'long', year: 'numeric' });
    if (missing <= 0) return ` · prazo ${label}`;
    if (monthsLeft < 0) return ` · <span style="color:var(--crit)">prazo (${label}) já passou</span>`;
    if (monthsLeft === 0) return ` · <span style="color:var(--crit)">o prazo é este mês (${label})</span>`;
    return ` · até ${label} → ${fmt(Math.ceil(missing / monthsLeft))}/mês`;
  };

  v.innerHTML = `
    ${active.length ? `
    <div class="card" style="margin-bottom:18px">
      <div class="card-head">
        <span class="card-title">Total reservado</span>
        <span class="card-note">${active.length} objetivo${active.length !== 1 ? 's' : ''} ativo${active.length !== 1 ? 's' : ''}</span>
      </div>
      <div style="font-size:26px;font-weight:650;letter-spacing:-0.02em">${fmt(reserved)}</div>
      <div class="card-note" style="margin-top:2px">Este dinheiro continua nas tuas contas e no património — está apenas prometido. A despesa só se regista quando comprares.</div>
    </div>` : ''}

    ${goals.length ? `<div class="budget-grid">
      ${goals.map(g => {
        const saved = goalSaved(g);
        const pct = g.target > 0 ? saved / g.target : 0;
        const full = pct >= 1;
        const color = goalColor(g);
        const note = !g.done && !full && g.deadline ? goalMonthsNote(g.deadline) : '';
        const fill = g.done || full ? '#0ca30c' : '#2a78d6';
        const track = g.done || full ? '#d3ecd3' : '#dbe9fb';
        return `
        <div class="budget-card" style="${g.done ? 'opacity:.72' : ''}">
          <div class="b-head">
            <span class="b-name"><span class="c-dot" style="background:${color}"></span>${esc(g.name)}${g.done ? ' <span class="badge" style="margin-left:6px">Concluído 🎉</span>' : ''}</span>
            <span style="white-space:nowrap">
              ${!g.done ? `<button class="btn-icon" data-g-add="${g.id}" title="Reforçar">${I.plus}</button>
              <button class="btn-icon" data-g-take="${g.id}" title="Retirar">${I.minus}</button>` : ''}
              <button class="btn-icon" data-g-edit="${g.id}" title="Editar">${I.edit}</button>
              <button class="btn-icon danger" data-g-del="${g.id}" title="Apagar">${I.trash}</button>
            </span>
          </div>
          <div class="meter" style="background:${track}"><div class="fill" style="width:${Math.min(pct * 100, 100).toFixed(1)}%;background:${fill}"></div></div>
          <div class="b-nums"><span><strong>${fmt(saved)}</strong> de ${fmt(g.target)}</span><span>${(pct * 100).toFixed(0)} %</span></div>
          <div class="b-status ${full && !g.done ? '' : ''}">
            ${g.done ? 'Objetivo concluído — não conta como reservado' :
              full ? `✔ Alcançado!${deadlineHint(g)}` :
              `Faltam ${fmt(g.target - saved)}${deadlineHint(g)}`}
          </div>
          ${note ? `<div class="goal-note">${esc(note)}</div>` : ''}
          ${full && !g.done ? `<button class="btn" data-g-done="${g.id}" style="margin-top:10px;padding:5px 11px;font-size:12px">Marcar como concluído</button>` : ''}
        </div>`;
      }).join('')}
    </div>` : `
    <div class="card"><div class="empty">
      <div class="e-icon">${I.budget}</div>
      <h3>${doneCount ? 'Sem objetivos ativos' : 'Ainda sem objetivos'}</h3>
      <p>Cria um objetivo — férias, um portátil novo, o que for — e vai reforçando ao teu ritmo.</p>
      <button class="btn btn-primary" id="btnEmptyGoal">${I.plus}<span>Novo objetivo</span></button>
    </div></div>`}

    ${doneCount ? `
    <div class="card" style="margin-top:18px">
      <button class="pref-entry" id="btnDoneGoals"><span class="grow">Objetivos concluídos<span class="meta">${doneCount} objetivo${doneCount !== 1 ? 's' : ''} · já não contam como reservados</span></span>${I.chevron}</button>
    </div>` : ''}
  `;

  const bE = $('#btnEmptyGoal');
  if (bE) bE.addEventListener('click', () => openGoalModal());
  const bD = $('#btnDoneGoals');
  if (bD) bD.addEventListener('click', openDoneGoalsModal);
  const byId = id => DB.goals.find(g => g.id === id);
  $$('[data-g-add]', v).forEach(b => b.addEventListener('click', () => openGoalMoneyModal(byId(b.dataset.gAdd), 'add')));
  $$('[data-g-take]', v).forEach(b => b.addEventListener('click', () => openGoalMoneyModal(byId(b.dataset.gTake), 'take')));
  $$('[data-g-edit]', v).forEach(b => b.addEventListener('click', () => openGoalModal(byId(b.dataset.gEdit))));
  $$('[data-g-done]', v).forEach(b => b.addEventListener('click', () => {
    byId(b.dataset.gDone).done = true;
    save(); render(); toast('Objetivo concluído 🎉 Não te esqueças de registar a compra como despesa');
  }));
  $$('[data-g-del]', v).forEach(b => b.addEventListener('click', () => deleteGoal(byId(b.dataset.gDel))));
}

// onClose: depois de confirmar ou cancelar, volta à janela de onde veio (ex.: «Objetivos concluídos»)
function deleteGoal(g, { onClose = null } = {}) {
  confirmModal({
    title: 'Apagar objetivo?',
    message: g.done
      ? `«${esc(g.name)}» está concluído. Apagar só o tira da lista — o dinheiro continua nas tuas contas.`
      : `«${esc(g.name)}» tem ${fmt(goalSaved(g))} reservados. Apagar o objetivo apenas remove a etiqueta — o dinheiro continua nas tuas contas.`,
    confirmLabel: 'Apagar', danger: true,
    onClose,
    onConfirm() { DB.goals = DB.goals.filter(x => x.id !== g.id); save(); render(); toast('Objetivo apagado'); },
  });
}

// janela com os objetivos concluídos (fora da lista principal); editar e apagar voltam aqui
function openDoneGoalsModal() {
  const done = (DB.goals || []).filter(g => g.done).sort((a, b) =>
    ((a.deadline ? 0 : 1) - (b.deadline ? 0 : 1))
    || (b.deadline || '').localeCompare(a.deadline || '')       // prazo mais recente primeiro
    || (b.createdAt || '').localeCompare(a.createdAt || ''));
  if (!done.length) return;
  const back = () => { if ((DB.goals || []).some(g => g.done)) openDoneGoalsModal(); };
  openModal({
    title: 'Objetivos concluídos',
    guard: false, // só consulta: editar e apagar têm as suas janelas
    body: `
      <p class="field-hint" style="margin:0 0 6px">Já não contam como dinheiro reservado.</p>
      <div class="dg-list">
        ${done.map(g => `
          <div class="dg-row">
            <span class="c-dot" style="background:${goalColor(g)}"></span>
            <div class="dg-txt">
              <div class="dg-name">${esc(g.name)}</div>
              <div class="dg-meta">${fmt(goalSaved(g))} de ${fmt(g.target)}${g.deadline ? ` · prazo ${esc(monthLabel(g.deadline))}` : ''}</div>
            </div>
            <button class="btn-icon" data-dg-edit="${g.id}" title="Editar" aria-label="Editar">${I.edit}</button>
            <button class="btn-icon danger" data-dg-del="${g.id}" title="Apagar" aria-label="Apagar">${I.trash}</button>
          </div>`).join('')}
      </div>`,
    footHtml: `<button class="btn btn-primary" data-close-ok>Fechar</button>`,
    onMount(bd) {
      $('[data-close-ok]', bd).addEventListener('click', closeModal);
      const byId = id => DB.goals.find(g => g.id === id);
      $$('[data-dg-edit]', bd).forEach(b => b.addEventListener('click', () => openGoalModal(byId(b.dataset.dgEdit), { onClose: back })));
      $$('[data-dg-del]', bd).forEach(b => b.addEventListener('click', () => deleteGoal(byId(b.dataset.dgDel), { onClose: back })));
    },
  });
}

// onClose: ao fechar (Guardar, Cancelar, ✕…), volta à janela de onde veio (ex.: «Objetivos concluídos»)
function openGoalModal(g = null, { onClose = null } = {}) {
  const isEdit = !!g;
  openModal({
    title: isEdit ? 'Editar objetivo' : 'Novo objetivo',
    onClose,
    body: `
      <div class="field" id="fGName"><label>Nome</label><input id="inGName" placeholder="Ex.: Férias no Japão, Portátil novo…" value="${esc(g?.name || '')}" autocomplete="off"><div class="err">Indica um nome.</div></div>
      <div class="form-row">
        <div class="field" id="fGTarget"><label>Valor alvo (€)</label><input id="inGTarget" inputmode="decimal" placeholder="0,00" value="${g ? (g.target / 100).toFixed(2).replace('.', ',') : ''}" autocomplete="off"><div class="err">Indica um valor maior que zero.</div></div>
        <div class="field"><label>Prazo <span style="font-weight:400;color:var(--ink-3)">(opcional)</span></label>${datePickHTML({ id: 'inGDeadline', type: 'month', value: g?.deadline || '', empty: 'Sem prazo', short: true, clearable: true, title: 'Prazo' })}</div>
      </div>
      ${!isEdit ? `<div class="field"><label>Já tens algum valor de lado? <span style="font-weight:400;color:var(--ink-3)">(opcional)</span></label><input id="inGInitial" inputmode="decimal" placeholder="0,00" autocomplete="off"></div>` : ''}
    `,
    footHtml: `<button class="btn" data-cancel>Cancelar</button><button class="btn btn-primary" data-save>${isEdit ? 'Guardar' : 'Criar objetivo'}</button>`,
    onMount(bd) {
      $('[data-cancel]', bd).addEventListener('click', closeModal);
      const saveFn = () => {
        const name = $('#inGName', bd).value.trim();
        const target = parseAmount($('#inGTarget', bd).value);
        $('#fGName', bd).classList.toggle('invalid', !name);
        $('#fGTarget', bd).classList.toggle('invalid', !target);
        if (!name || !target) return;
        const deadline = $('#inGDeadline', bd).value || null;
        if (g) {
          g.name = name; g.target = target; g.deadline = deadline;
        } else {
          const initial = parseAmount($('#inGInitial', bd)?.value || '') || 0;
          DB.goals.push({
            id: uid(), name, target, deadline, done: false,
            contributions: initial > 0 ? [{ id: uid(), date: todayISO(), amount: initial }] : [],
            createdAt: new Date().toISOString(),
          });
        }
        save(); closeModal(); render();
        toast(isEdit ? 'Objetivo atualizado' : 'Objetivo criado');
      };
      $('[data-save]', bd).addEventListener('click', saveFn);
      bd.addEventListener('keydown', e => { if (e.key === 'Enter') { e.preventDefault(); saveFn(); } });
    },
  });
}

function openGoalMoneyModal(g, mode) {
  const isAdd = mode === 'add';
  const saved = goalSaved(g);
  openModal({
    title: `${isAdd ? 'Reforçar' : 'Retirar de'} — ${g.name}`,
    body: `
      <p style="margin:0 0 12px;color:var(--ink-2);font-size:12.5px">Reservado atualmente: <strong>${fmt(saved)}</strong>${isAdd && g.target > saved ? ` · faltam ${fmt(g.target - saved)}` : ''}</p>
      <div class="field" id="fGAmt"><label>Valor (€)</label><input id="inGAmt" inputmode="decimal" placeholder="0,00" autocomplete="off"><div class="err" id="gAmtErr">Indica um valor válido.</div></div>
    `,
    footHtml: `<button class="btn" data-cancel>Cancelar</button><button class="btn btn-primary" data-save>${isAdd ? 'Reforçar' : 'Retirar'}</button>`,
    onMount(bd) {
      $('[data-cancel]', bd).addEventListener('click', closeModal);
      const saveFn = () => {
        const amt = parseAmount($('#inGAmt', bd).value);
        const f = $('#fGAmt', bd);
        let err = null;
        if (!amt) err = 'Indica um valor válido maior que zero.';
        else if (!isAdd && amt > saved) err = `Só tens ${fmt(saved)} reservados neste objetivo.`;
        $('#gAmtErr', bd).textContent = err || '';
        f.classList.toggle('invalid', !!err);
        if (err) return;
        g.contributions.push({ id: uid(), date: todayISO(), amount: isAdd ? amt : -amt });
        save(); closeModal(); render();
        toast(isAdd ? `+${fmt(amt)} no objetivo` : `${fmt(amt)} retirados do objetivo`);
      };
      $('[data-save]', bd).addEventListener('click', saveFn);
      bd.addEventListener('keydown', e => { if (e.key === 'Enter') { e.preventDefault(); saveFn(); } });
    },
  });
}

/* ---------- Investimentos ---------- */
function renderInvestments(v) {
  const t = invTotals();
  const plPct = t.invested > 0 ? t.pl / t.invested : NaN;
  const hasAnySale = DB.investments.some(p => positionCalc(p).hasSells);

  let slices = DB.investments
    .map((p, i) => ({ name: p.name, value: Math.round(p.quantity * p.currentPriceEur * 100), i }))
    .filter(s => s.value > 0)
    .sort((a, b) => b.value - a.value);
  if (slices.length > 8) {
    const top = slices.slice(0, 7);
    const rest = slices.slice(7).reduce((s, x) => s + x.value, 0);
    slices = [...top, { name: 'Outros', value: rest, i: -1 }];
  }
  slices = slices.map((s, idx) => ({ ...s, color: s.i === -1 ? OTHER_GRAY : PALETTE[idx % PALETTE.length] }));
  const sliceTotal = slices.reduce((s, x) => s + x.value, 0);

  v.innerHTML = `
    <div class="tiles" style="grid-template-columns:repeat(${hasAnySale ? 4 : 3},1fr)">
      <div class="tile">
        <div class="t-label">Total investido</div>
        <div class="t-value">${fmt(t.invested)}</div>
        <div class="t-delta">${DB.investments.length} posiç${DB.investments.length === 1 ? 'ão' : 'ões'}</div>
      </div>
      <div class="tile">
        <div class="t-label">Valor atual</div>
        <div class="t-value">${fmt(t.current)}</div>
        <div class="t-delta">preços atualizados manualmente</div>
      </div>
      <div class="tile">
        <div class="t-label">${hasAnySale ? 'Resultado não realizado' : 'Resultado'}</div>
        <div class="t-value ${t.pl > 0 ? 'pl-pos' : t.pl < 0 ? 'pl-neg' : ''}">${fmtSign(t.pl)}</div>
        <div class="t-delta ${t.pl > 0 ? 'up' : t.pl < 0 ? 'down' : ''}">${isFinite(plPct) ? fmtPct(plPct) + ' sobre o investido' : '—'}</div>
      </div>
      ${hasAnySale ? `<div class="tile">
        <div class="t-label">Resultado realizado</div>
        <div class="t-value ${t.realized > 0 ? 'pl-pos' : t.realized < 0 ? 'pl-neg' : ''}">${fmtSign(t.realized)}</div>
        <div class="t-delta">de vendas já concretizadas</div>
      </div>` : ''}
    </div>

    ${DB.investments.length ? `
    <div class="charts-row" style="grid-template-columns:0.9fr 1.4fr">
      <div class="card">
        <div class="card-head"><span class="card-title">Alocação da carteira</span></div>
        <div class="donut-wrap">
          ${donutHTML(slices, 'Total', fmt(sliceTotal))}
          <div class="donut-legend">
            ${slices.map(s => `<div class="row"><span class="dot" style="background:${s.color}"></span><span class="name">${esc(s.name)}</span><span class="val">${fmt(s.value)}</span><span class="pct">${(s.value / sliceTotal * 100).toFixed(1).replace('.', ',')}%</span></div>`).join('')}
          </div>
        </div>
      </div>
      <div class="card">
        <div class="card-head"><span class="card-title">Posições</span></div>
        <div style="overflow-x:auto">
        <table class="inv-table">
          <thead><tr>
            <th>Ativo</th><th>Tipo</th><th class="num">Qtd.</th><th class="num">Preço médio</th><th class="num">Preço atual</th><th class="num">Valor</th><th class="num">Resultado</th><th></th>
          </tr></thead>
          <tbody>
            ${DB.investments.map(p => {
              const c = positionCalc(p);
              const cur = Math.round(c.quantity * p.currentPriceEur * 100);
              const invested = c.costRemaining;
              const pl = cur - invested;
              const pct = invested > 0 ? pl / invested : NaN;
              const closed = c.quantity === 0 && c.hasSells;
              return { p, c, cur, invested, pl, pct, closed };
            }).sort((a, b) => (a.closed - b.closed) || (b.cur - a.cur)).map(({ p, c, cur, invested, pl, pct, closed }) => {
              const resultVal = closed ? c.realized : pl;
              return `<tr data-id="${p.id}" data-hist-inv="${p.id}" title="Clicar para ver o histórico de compras e vendas" style="cursor:pointer" class="${closed ? 'inv-closed' : ''}">
                <td class="inv-name">${esc(p.name)}${c.inconsistent ? ` <span class="inv-warn" title="Uma venda excedeu as unidades disponíveis nessa data — revê o histórico">⚠</span>` : ''}${closed ? ` <span class="badge">Fechada</span>` : ''}${p.ticker ? `<small>${esc(p.ticker)}</small>` : ''}</td>
                <td><span class="badge">${esc(p.type)}</span></td>
                <td class="num">${fmtQty(c.quantity)}</td>
                <td class="num">${closed ? '<span style="color:var(--ink-3)">—</span>' : fmtPrice(p.avgPriceEur)}</td>
                <td class="num">${fmtPrice(p.currentPriceEur)}</td>
                <td class="num">${closed ? '<span style="color:var(--ink-3)">—</span>' : `<strong>${fmt(cur)}</strong><br><small style="color:var(--ink-3)">inv. ${fmt(invested)}</small>`}</td>
                <td class="num ${resultVal > 0 ? 'pl-pos' : resultVal < 0 ? 'pl-neg' : ''}">${fmtSign(resultVal)}<br><small${closed ? ' style="color:var(--ink-3)"' : ''}>${closed ? 'realizado' : (isFinite(pct) ? fmtPct(pct) : '')}</small></td>
                <td class="num" style="white-space:nowrap">
                  <button class="btn-icon" data-buy-inv="${p.id}" title="Registar compra">${I.plus}</button>
                  ${c.quantity > 0 ? `<button class="btn-icon" data-sell-inv="${p.id}" title="Registar venda">${I.sell}</button>` : ''}
                  <button class="btn-icon" data-edit-inv="${p.id}" title="Editar posição">${I.edit}</button>
                  <button class="btn-icon danger" data-del-inv="${p.id}" title="Apagar">${I.trash}</button>
                </td>
              </tr>`;
            }).join('')}
          </tbody>
        </table>
        </div>
      </div>
    </div>` : `
    <div class="card"><div class="empty">
      <div class="e-icon">${I.inv}</div>
      <h3>Ainda sem investimentos</h3>
      <p>Adiciona a primeira posição — ações, ETFs, cripto, fundos, o que tiveres.</p>
      <button class="btn btn-primary" id="btnEmptyInv">${I.plus}<span>Nova posição</span></button>
    </div></div>`}
  `;

  bindDonutTooltip(slices);
  $$('[data-hist-inv]', v).forEach(tr => tr.addEventListener('click', e => {
    if (e.target.closest('button')) return;
    openInvHistoryModal(DB.investments.find(p => p.id === tr.dataset.histInv));
  }));
  $$('[data-buy-inv]', v).forEach(b => b.addEventListener('click', () => openBuyModal(DB.investments.find(p => p.id === b.dataset.buyInv))));
  $$('[data-sell-inv]', v).forEach(b => b.addEventListener('click', () => openSellModal(DB.investments.find(p => p.id === b.dataset.sellInv))));
  $$('[data-edit-inv]', v).forEach(b => b.addEventListener('click', () => openInvModal(DB.investments.find(p => p.id === b.dataset.editInv))));
  $$('[data-del-inv]', v).forEach(b => b.addEventListener('click', () => {
    const p = DB.investments.find(x => x.id === b.dataset.delInv);
    confirmModal({
      title: 'Apagar posição?',
      message: `«${esc(p.name)}» será removida da carteira${(p.purchases || []).some(l => l.depositTxId) ? ', incluindo os depósitos de vendas associados nas contas' : ''}. Esta ação não pode ser anulada.`,
      confirmLabel: 'Apagar', danger: true,
      onConfirm() {
        DB.investments = DB.investments.filter(x => x.id !== p.id);
        DB.transactions = DB.transactions.filter(t => t.investmentId !== p.id);
        save(); render(); toast('Posição apagada');
      },
    });
  }));
  const bE = $('#btnEmptyInv');
  if (bE) bE.addEventListener('click', () => openInvModal());
}

      </div>

      $('[data-cancel]', bd).addEventListener('click', closeModal);

        const name = $('#inName', bd).value.trim();
        const cur = parsePrice($('#inCur', bd).value);
        $('#fName', bd).classList.toggle('invalid', !name);
        $('#fCur', bd).classList.toggle('invalid', cur === null);
        let qty = null, avg = null;
        if (!isEdit) {
          qty = parseQty($('#inQty', bd).value);
          avg = parsePrice($('#inAvg', bd).value);
          $('#fQty', bd).classList.toggle('invalid', qty === null || qty <= 0);

          if (qty === null || qty <= 0 || avg === null) return;

        if (!name || cur === null) return;

          p.name = name;
          p.ticker = $('#inTicker', bd).value.trim();
          p.type = $('#inType', bd).value;
          p.currentPriceEur = cur;
          p.notes = $('#inInvNotes', bd).value.trim();
          p.updatedAt = new Date().toISOString();
        } else {
          const initialLot = { id: uid(), date: todayISO(), amountPaid: Math.round(qty * avg * 100), quantity: qty, kind: 'buy', initial: true };
          const rec = {
            id: uid(),
            name,
            ticker: $('#inTicker', bd).value.trim(),
            type: $('#inType', bd).value,
            quantity: qty,
            avgPriceEur: avg,
            currentPriceEur: cur,
            notes: $('#inInvNotes', bd).value.trim(),
            updatedAt: new Date().toISOString(),
            purchases: [initialLot],
          };
          syncBuyDebit(rec, initialLot, $('#inAcc', bd).value, initialLot.amountPaid, initialLot.date);

      bd.addEventListener('keydown', e => { if (e.key === 'Enter' && e.target.tagName !== 'TEXTAREA') { e.preventDefault(); saveFn(); } });

}

// cria/atualiza/remove o lançamento de crédito ligado a uma venda (reutiliza o tipo "ajuste",
// que já credita a conta e é ignorado nas receitas/despesas)
function syncSaleDeposit(p, lot, accId, proceeds, date) {
  const idx = lot.depositTxId ? DB.transactions.findIndex(t => t.id === lot.depositTxId) : -1;
  if (accId) {
    if (idx >= 0) {
      const tx = DB.transactions[idx];
      tx.accountId = accId; tx.amount = proceeds; tx.date = date; tx.description = `Venda — ${p.name}`;
    } else {
      const tx = {
        id: uid(), type: 'ajuste', accountId: accId, amount: proceeds, date,
        description: `Venda — ${p.name}`, investmentId: p.id, saleLotId: lot.id,
        createdAt: new Date().toISOString(),
      };
      DB.transactions.push(tx);
      lot.depositTxId = tx.id;
    }
  } else if (idx >= 0) {
    DB.transactions.splice(idx, 1);
    lot.depositTxId = null;
  }
}

// cria/atualiza/remove o lançamento de débito ligado a uma compra (reutiliza "ajuste" com sinal
// negativo — debita a conta e é ignorado nas despesas/receitas, logo não afeta o fundo nem os orçamentos)
function syncBuyDebit(p, lot, accId, cost, date) {
  const idx = lot.debitTxId ? DB.transactions.findIndex(t => t.id === lot.debitTxId) : -1;
  if (accId) {
    if (idx >= 0) {
      const tx = DB.transactions[idx];
      tx.accountId = accId; tx.amount = -cost; tx.date = date; tx.description = `Compra — ${p.name}`;
    } else {
      const tx = {
        id: uid(), type: 'ajuste', accountId: accId, amount: -cost, date,
        description: `Compra — ${p.name}`, investmentId: p.id, buyLotId: lot.id,
        createdAt: new Date().toISOString(),
      };
      DB.transactions.push(tx);
      lot.debitTxId = tx.id;
    }
  } else if (idx >= 0) {
    DB.transactions.splice(idx, 1);
    lot.debitTxId = null;
  }
}

function openSellModal(p, sale = null, opts = {}) {
  const isEdit = !!sale;
  const maxSell = q8(p.quantity + (isEdit ? sale.quantity : 0)); // unidades disponíveis para esta venda
  // custo médio por unidade (cêntimos) para a pré-visualização do resultado
  let previewAvgCents = (p.avgPriceEur || 0) * 100;
  if (!previewAvgCents) {
    const buys = (p.purchases || []).filter(l => l.kind !== 'sell');
    const bq = buys.reduce((s, l) => s + l.quantity, 0), bc = buys.reduce((s, l) => s + (l.amountPaid || 0), 0);
    previewAvgCents = bq > 0 ? bc / bq : 0;
  }
  const initialAcc = isEdit
    ? (sale.depositTxId && DB.transactions.some(t => t.id === sale.depositTxId) ? DB.transactions.find(t => t.id === sale.depositTxId).accountId : '')
    : (DB.accounts[0]?.id || '');

  openModal({
    title: `${isEdit ? 'Editar venda' : 'Vender'} — ${p.name}`,
    body: `
      <div class="form-row">
        <div class="field" id="fSQty"><label>Quantidade a vender</label><input id="inSQty" inputmode="decimal" placeholder="0" value="${sale ? fmtQty(sale.quantity) : ''}" autocomplete="off"><div class="err">Quantidade inválida ou superior ao que tens.</div></div>
        <div class="field"><label>Data</label>${datePickHTML({ id: 'inSDate', value: sale ? sale.date : todayISO(), title: 'Data' })}</div>
      </div>
      <div style="margin:-6px 0 12px;font-size:11.5px;color:var(--ink-3)">Disponível: <strong>${fmtQty(maxSell)}</strong> un. · <button type="button" class="linklike" id="sellAll">vender tudo</button></div>
      <div class="field" id="fSAmt"><label>Total recebido (€) <span style="font-weight:400;color:var(--ink-3)">(líquido de comissões)</span></label><input id="inSAmt" inputmode="decimal" placeholder="0,00" value="${sale ? (sale.amountReceived / 100).toFixed(2).replace('.', ',') : ''}" autocomplete="off"><div class="err">Indica um valor maior que zero.</div></div>
      <div class="field"><label>Depositar em</label><select id="inSAcc">
        ${DB.accounts.map(a => `<option value="${a.id}"${initialAcc === a.id ? ' selected' : ''}>${esc(a.name)}</option>`).join('')}
        <option value=""${initialAcc === '' ? ' selected' : ''}>Não depositar (fica só na carteira)</option>
      </select></div>
      ${!isEdit ? `<div class="field" id="fSCur"><label>Preço atual agora <span style="font-weight:400;color:var(--ink-3)">(opcional — atualiza o preço de mercado)</span></label><input id="inSCur" inputmode="decimal" placeholder="${numToInput(p.currentPriceEur)}" autocomplete="off"><div class="err">Preço inválido.</div></div>` : ''}
      <div class="sell-preview" id="sellPreview"></div>
    `,
    footHtml: `<button class="btn" data-cancel>Cancelar</button><button class="btn btn-primary" data-save>${isEdit ? 'Guardar' : 'Registar venda'}</button>`,
    onMount(bd) {
      const back = () => { if (opts.fromHistory) openInvHistoryModal(p, opts.page || 1); };
      $('[data-cancel]', bd).addEventListener('click', () => { closeModal(); back(); });
      const qtyIn = $('#inSQty', bd), amtIn = $('#inSAmt', bd), prev = $('#sellPreview', bd);
      const updatePreview = () => {
        const qty = parseQty(qtyIn.value);
        const amt = parseAmount(amtIn.value);
        if (qty === null || qty <= 0) { prev.innerHTML = ''; return; }
        const implied = amt ? `preço de venda ${fmtPrice(Math.round(amt / qty) / 100)}` : '';
        let realizedTxt = '';
        if (amt && previewAvgCents) {
          const r = amt - Math.round(previewAvgCents * qty);
          realizedTxt = `<span class="${r > 0 ? 'pl-pos' : r < 0 ? 'pl-neg' : ''}">${r >= 0 ? 'mais' : 'menos'}-valia estimada ${fmtSign(r)}</span>`;
        }
        prev.innerHTML = [implied, realizedTxt].filter(Boolean).join(' · ');
      };
      qtyIn.addEventListener('input', updatePreview);
      amtIn.addEventListener('input', updatePreview);
      $('#sellAll', bd).addEventListener('click', () => { qtyIn.value = fmtQty(maxSell); updatePreview(); amtIn.focus(); });
      updatePreview();

      const saveFn = () => {
        const qty = parseQty(qtyIn.value);
        const amt = parseAmount(amtIn.value);
        const badQty = qty === null || qty <= 0 || qty > maxSell + 1e-9;
        $('#fSQty', bd).classList.toggle('invalid', badQty);
        $('#fSAmt', bd).classList.toggle('invalid', !amt);
        let curPrice = null;
        if (!isEdit) {
          const raw = $('#inSCur', bd).value.trim();
          if (raw) { curPrice = parsePrice(raw); $('#fSCur', bd).classList.toggle('invalid', curPrice === null); if (curPrice === null) return; }
        }
        if (badQty || !amt) return;
        const date = $('#inSDate', bd).value || todayISO();
        const accId = $('#inSAcc', bd).value;
        let lot;
        if (isEdit) {
          lot = sale;
          lot.date = date; lot.quantity = qty; lot.amountReceived = amt;
        } else {
          lot = { id: uid(), date, kind: 'sell', quantity: qty, amountReceived: amt, createdAt: new Date().toISOString() };
          p.purchases.push(lot);
        }
        syncSaleDeposit(p, lot, accId, amt, date);
        recalcPosition(p);
        if (curPrice !== null) p.currentPriceEur = curPrice;
        p.updatedAt = new Date().toISOString();
        const realized = positionCalc(p).perSell[lot.id]?.realized ?? 0;
        save(); closeModal(); render();
        toast(`${isEdit ? 'Venda atualizada' : 'Venda registada'} — ${realized >= 0 ? 'mais' : 'menos'}-valia ${fmtSign(realized)}`);
        back();
      };
      $('[data-save]', bd).addEventListener('click', saveFn);
      bd.addEventListener('keydown', e => { if (e.key === 'Enter' && e.target.tagName !== 'SELECT') { e.preventDefault(); saveFn(); } });
    },
  });
}

function openInvHistoryModal(p, page = 1) {
  const PER_PAGE = 15;
  const calc = positionCalc(p);
  const list = [...p.purchases].sort((a, b) => b.date.localeCompare(a.date)); // mais recentes primeiro
  const pageCount = Math.max(1, Math.ceil(list.length / PER_PAGE));
  page = Math.min(Math.max(1, page), pageCount);
  const pageList = list.slice((page - 1) * PER_PAGE, page * PER_PAGE);
  openModal({
    title: `Histórico — ${p.name}`,
    wide: true,
    body: list.length ? `
      ${pageList.map(c => {
        const isSell = c.kind === 'sell';
        const amount = isSell ? (c.amountReceived || 0) : (c.amountPaid || 0);
        const implied = fmtPrice(c.quantity > 0 ? Math.round(amount / c.quantity) / 100 : 0);
        const rz = isSell ? (calc.perSell[c.id]?.realized ?? 0) : null;
        return `
        <div class="rec-row" style="cursor:default">
          <div class="rec-main">
            <div class="r1"><span class="badge ${isSell ? 'badge-sell' : 'badge-buy'}" style="margin-right:10px">${isSell ? 'Venda' : 'Compra'}</span>${esc(dayLabel(c.date).replace(/^./, ch => ch.toUpperCase()))}${c.initial ? ' <span class="badge" style="margin-left:5px">posição inicial</span>' : ''}</div>

/* ---------- Análise ---------- */
const AN_TYPES = [['month', 'Mês'], ['quarter', 'Trimestre'], ['semester', 'Semestre'], ['year', 'Ano']];

function periodMonths(type, key) {
  if (type === 'month') return [key];
  if (type === 'year') return Array.from({ length: 12 }, (_, i) => `${key}-${String(i + 1).padStart(2, '0')}`);
  const [y, pk] = key.split('-');
  const n = +pk.slice(1);
  if (pk[0] === 'Q') {
    const start = (n - 1) * 3 + 1;
    return [0, 1, 2].map(i => `${y}-${String(start + i).padStart(2, '0')}`);
  }
  const start = n === 1 ? 1 : 7;
  return [0, 1, 2, 3, 4, 5].map(i => `${y}-${String(start + i).padStart(2, '0')}`);
}
function periodLabel(type, key) {
  if (type === 'month') return monthLabel(key);
  if (type === 'year') return key;
  const [y, pk] = key.split('-');
  return `${pk[0] === 'Q' ? 'T' + pk.slice(1) : pk} ${y}`;
}
// primeiro mês com qualquer registo (movimento ou compra de investimento); sem registos → mês atual
function dataStartYM() {
  let min = null;
  const touch = d => {
    const ym = String(d).slice(0, 7);
    if (/^\d{4}-\d{2}$/.test(ym) && (!min || ym < min)) min = ym;
  };
  for (const t of DB.transactions) touch(t.date);
  for (const p of DB.investments) for (const c of (p.purchases || [])) touch(c.date);
  return min || currentYM();
}
// janela de análise: do primeiro registo até hoje — nada antes, nada no futuro
function yearOptions() {
  const start = +dataStartYM().slice(0, 4);
  const cur = new Date().getFullYear();
  const list = [];
  for (let y = Math.max(cur, start); y >= Math.min(cur, start); y--) list.push(String(y));
  return list;
}
function subPeriodOptions(type, year) {
  const startYM = dataStartYM();
  const now = new Date();
  const lo = +year === +startYM.slice(0, 4) ? +startYM.slice(5, 7) : 1;  // 1º ano de dados começa no 1º registo
  const hi = +year === now.getFullYear() ? now.getMonth() + 1 : 12;      // ano corrente acaba no mês atual
  if (type === 'month') {
    const list = [];
    for (let m = lo; m <= hi; m++) {
      list.push({ val: String(m).padStart(2, '0'), label: new Date(2000, m - 1, 1).toLocaleDateString('pt-PT', { month: 'long' }) });
    }
    return list;
  }
  if (type === 'quarter') {
    const loQ = Math.ceil(lo / 3), hiQ = Math.ceil(hi / 3);
    const spans = ['jan–mar', 'abr–jun', 'jul–set', 'out–dez'];
    return [1, 2, 3, 4].filter(q => q >= loQ && q <= hiQ).map(q => ({ val: 'Q' + q, label: `T${q} · ${spans[q - 1]}` }));
  }
  const loS = lo <= 6 ? 1 : 2, hiS = hi <= 6 ? 1 : 2;
  return [1, 2].filter(s => s >= loS && s <= hiS).map(s => ({ val: 'S' + s, label: `S${s} · ${s === 1 ? 'jan–jun' : 'jul–dez'}` }));
}
function defaultPeriodsFor(type) {
  const now = new Date();
  const y = now.getFullYear(), m = now.getMonth() + 1;
  if (type === 'month') return { a: currentYM(), b: ymAdd(currentYM(), -1) };
  if (type === 'year') return { a: String(y), b: String(y - 1) };
  if (type === 'quarter') {
    const q = Math.ceil(m / 3);
    return { a: `${y}-Q${q}`, b: q === 1 ? `${y - 1}-Q4` : `${y}-Q${q - 1}` };
  }
  const s = m <= 6 ? 1 : 2;
  return { a: `${y}-S${s}`, b: s === 1 ? `${y - 1}-S2` : `${y}-S1` };
}
function periodTotals(months) {
  const set = new Set(months);
  const r = {
    inc: 0, exp: 0, invested: 0,
    byCatExp: new Map(), byCatInc: new Map(),
    incByM: months.map(() => 0), expByM: months.map(() => 0),
  };
  for (const t of DB.transactions) {
    const ym = t.date.slice(0, 7);
    if (!set.has(ym)) continue;
    const i = months.indexOf(ym);
    if (t.type === 'receita') {
      r.inc += t.amount; r.incByM[i] += t.amount;
      r.byCatInc.set(t.categoryId, (r.byCatInc.get(t.categoryId) || 0) + t.amount);
    } else if (t.type === 'despesa') {
      r.exp += t.amount; r.expByM[i] += t.amount;
      r.byCatExp.set(t.categoryId, (r.byCatExp.get(t.categoryId) || 0) + t.amount);
    }
  }
  for (const p of DB.investments) {
    for (const c of (p.purchases || [])) {
      if (set.has(c.date.slice(0, 7))) r.invested += c.amountPaid;
    }
  }
  r.net = r.inc - r.exp;
  r.activeMonths = months.reduce((s, _, i) => s + ((r.incByM[i] || r.expByM[i]) ? 1 : 0), 0);
  return r;
}
function deltaPill(a, b, dir) { // dir: 'up' = subir é bom · 'down' = descer é bom · 'neu' = neutro
  const d = a - b;
  if (d === 0) return `<span class="delta-pill neu">= igual</span>`;
  const cls = dir === 'neu' ? 'neu' : ((d > 0) === (dir === 'up') ? 'good' : 'bad');
  const pct = b > 0 ? ` · ${fmtPct(d / b)}` : '';
  return `<span class="delta-pill ${cls}">${d > 0 ? '▲' : '▼'} ${fmtSign(d)}${pct}</span>`;
}

function keyFromFirstMonth(type, ym) {
  const [y, m] = ym.split('-');
  if (type === 'year') return y;
  if (type === 'month') return ym;
  const mm = +m;
  return type === 'quarter' ? `${y}-Q${Math.ceil(mm / 3)}` : `${y}-S${mm <= 6 ? 1 : 2}`;
}
function shortPeriodLabel(type, k) {
  if (type === 'year') return k;
  const [y, s] = k.split('-');
  if (type === 'month') return monthShort(k) + ' ' + y.slice(2);
  return (s[0] === 'Q' ? 'T' + s.slice(1) : s) + ' ' + y.slice(2);
}

function renderAnalysisRange(v, sideSelects) {
  const an = UI.an;
  const span = { month: 1, quarter: 3, semester: 6, year: 12 }[an.type];
  const keys = [];
  let cur = periodMonths(an.type, an.from)[0];
  const end = periodMonths(an.type, an.to)[0];
  while (cur <= end && keys.length < 60) {
    keys.push(keyFromFirstMonth(an.type, cur));
    cur = ymAdd(cur, span);
  }
  const perMonths = keys.map(k => periodMonths(an.type, k));
  const allMonths = perMonths.flat();
  const T = periodTotals(allMonths);
  const nowYM = currentYM();
  const elapsed = Math.max(1, allMonths.filter(m => m <= nowYM).length);
  const single = keys.length === 1;
  const rangeLab = single ? periodLabel(an.type, keys[0]) : `${periodLabel(an.type, an.from)} — ${periodLabel(an.type, an.to)}`;
  const typeName = { month: 'meses', quarter: 'trimestres', semester: 'semestres', year: 'anos' }[an.type];
  const savingsRate = T.inc > 0 ? T.net / T.inc : NaN;
  const avg = val => fmt(Math.round(val / elapsed)) + '/mês';

  let cols = [];
  if (!single) {
    cols = keys.map((k, i) => {
      const t = periodTotals(perMonths[i]);
      return { label: shortPeriodLabel(an.type, k), inc: t.inc, exp: t.exp, tip: periodLabel(an.type, k) };
    });
  } else if (allMonths.length > 1) {
    cols = allMonths.map(ym => {
      const t = periodTotals([ym]);
      return { label: monthShort(ym), inc: t.inc, exp: t.exp, tip: monthLabel(ym) };
    });
  }

  const gridCols = 'grid-template-columns:1fr 120px 120px 90px';
  const cqRows = {}; // linhas de cada tabela ('e' despesas, 'i' receitas) — tocar abre os movimentos da categoria
  const catTable = (map, catType, totalAll, key) => {
    const rows = [];
    for (const [id, val] of map) {
      const cat = catById(id);
      if (cat && cat.type !== catType) continue;
      if (val > 0) rows.push({ id, cat, val });
    }
    if (!rows.length) return null;
    rows.sort((x, y) => y.val - x.val);
    cqRows[key] = rows;
    return `
      <div class="cmp-head" style="${gridCols}"><span></span><span class="num">Total</span><span class="num">Média</span><span class="num">Peso</span></div>
      ${rows.map((r, i) => `
        <div class="cmp-row cq-link" data-cq="${key}${i}" role="button" tabindex="0" title="Ver os movimentos" style="${gridCols}">
          <span class="c-name"><span class="c-dot" style="background:${catColor(r.cat)}"></span>${esc(r.cat ? r.cat.name : 'Sem categoria')}</span>
          <span class="num">${fmt(r.val)}</span>
          <span class="num" style="color:var(--ink-3)">${elapsed > 1 ? avg(r.val) : '—'}</span>
          <span class="num" style="color:var(--ink-3)">${totalAll > 0 ? (r.val / totalAll * 100).toFixed(1).replace('.', ',') + ' %' : ''}</span>
        </div>`).join('')}
      <div class="cmp-row total" style="${gridCols}">
        <span>Total</span>
        <span class="num">${fmt(totalAll)}</span>
        <span class="num">${elapsed > 1 ? avg(totalAll) : '—'}</span>
        <span class="num">100 %</span>
      </div>`;
  };
  const expTable = catTable(T.byCatExp, 'despesa', T.exp, 'e');
  const incTable = catTable(T.byCatInc, 'receita', T.inc, 'i');

  v.innerHTML = `
    ${analysisControlsHTML(sideSelects)}
    ${!single ? `<div class="card-note" style="margin:-6px 0 12px;text-transform:capitalize">${esc(rangeLab)} · ${keys.length} ${typeName}${an.type !== 'month' ? ` · ${allMonths.length} meses` : ''}</div>` : ''}

    <div class="tiles" style="grid-template-columns:repeat(4,1fr)">
      <div class="tile">
        <div class="t-label">Receitas</div>
        <div class="t-value" style="color:var(--good-text)">${fmt(T.inc)}</div>
        <div class="t-delta">${elapsed > 1 ? 'média ' + avg(T.inc) : esc(rangeLab)}</div>
      </div>
      <div class="tile">
        <div class="t-label">Despesas</div>
        <div class="t-value">${fmt(T.exp)}</div>
        <div class="t-delta">${elapsed > 1 ? 'média ' + avg(T.exp) : esc(rangeLab)}</div>
      </div>
      <div class="tile">
        <div class="t-label">Poupança</div>
        <div class="t-value">${fmt(T.net)}</div>
        <div class="t-delta">${isFinite(savingsRate) ? 'taxa ' + (savingsRate * 100).toFixed(0) + ' %' : '—'}${elapsed > 1 ? ' · média ' + avg(T.net) : ''}</div>
      </div>
      <div class="tile">
        <div class="t-label">Aportes em investimentos</div>
        <div class="t-value">${fmt(T.invested)}</div>
        <div class="t-delta">${elapsed > 1 && T.invested > 0 ? 'média ' + avg(T.invested) : esc(rangeLab)}</div>
      </div>
    </div>

    ${cols.length > 1 ? `
    <div class="card" style="margin-bottom:18px">
      <div class="card-head">
        <span class="card-title">${single ? 'Mês a mês' : 'Período a período'}</span>
        <div class="legend">
          <span class="key"><span class="dot" style="background:#2a78d6"></span>Receitas</span>
          <span class="key"><span class="dot" style="background:#e34948"></span>Despesas</span>
        </div>
      </div>
      ${rangeChartHTML(cols)}
    </div>` : ''}

    <div class="card" style="margin-bottom:18px">
      <div class="card-head"><span class="card-title">Despesas por categoria</span><span class="card-note" style="text-transform:capitalize">${esc(rangeLab)}</span></div>
      ${expTable || `<div class="empty" style="padding:22px 10px"><h3>Sem despesas neste intervalo</h3><p>Ajusta o intervalo em cima.</p></div>`}
    </div>
    <div class="card">
      <div class="card-head"><span class="card-title">Receitas por categoria</span><span class="card-note" style="text-transform:capitalize">${esc(rangeLab)}</span></div>
      ${incTable || `<div class="empty" style="padding:22px 10px"><h3>Sem receitas neste intervalo</h3><p>Ajusta o intervalo em cima.</p></div>`}
    </div>
  `;

  bindAnalysisControls(v);
  bindRangeTooltip(cols);
  bindCatQuick(v, k => {
    const r = (cqRows[k[0]] || [])[+k.slice(1)];
    if (!r) return null;
    const q = catQuickQuery(k[0] === 'e' ? 'despesa' : 'receita', r);
    return { q, ym: catQuickStartMonth(q, [allMonths]) };
  });
}

function catCompareRows(mapA, mapB, catType) {
  const ids = new Set([...mapA.keys(), ...mapB.keys()]);
  const rows = [];
  for (const id of ids) {
    const cat = catById(id);
    if (cat && cat.type !== catType) continue;
    const a = mapA.get(id) || 0, b = mapB.get(id) || 0;
    if (a === 0 && b === 0) continue;
    rows.push({ id, cat, a, b });
  }
  rows.sort((x, y) => y.a - x.a || y.b - x.b);
  return rows;
}

function renderAnalysis(v) {
  const an = UI.an;
  const hasData = DB.transactions.length > 0 || DB.investments.some(p => (p.purchases || []).length);
  if (!hasData) {
    v.innerHTML = `<div class="card"><div class="empty">
      <div class="e-icon">${I.inv}</div>
      <h3>Ainda não há dados para analisar</h3>
      <p>Regista movimentos durante algum tempo e volta aqui para comparar meses, trimestres e anos.</p>
    </div></div>`;
    return;
  }

  const yearOpts = yearOptions();
  const splitKey = key => an.type === 'year' ? { y: key, sub: null } : { y: key.split('-')[0], sub: key.split('-')[1] };
  const fixKey = key => {
    let { y, sub } = splitKey(key);
    if (!yearOpts.includes(y)) {
      // yearOpts está por ordem decrescente: [0] = mais recente, [len-1] = mais antigo
      y = +y < +yearOpts[yearOpts.length - 1] ? yearOpts[yearOpts.length - 1] : yearOpts[0];
    }
    if (an.type !== 'year') {
      const ss = subPeriodOptions(an.type, y);
      if (!ss.some(o => o.val === sub)) {
        sub = (sub && sub < ss[0].val) ? ss[0].val : ss[ss.length - 1].val; // aproxima ao limite mais próximo
      }
      return `${y}-${sub}`;
    }
    return y;
  };
  an.a = fixKey(an.a);
  an.b = fixKey(an.b);
  const mA = periodMonths(an.type, an.a), mB = periodMonths(an.type, an.b);
  const A = periodTotals(mA), B = periodTotals(mB);
  const labA = periodLabel(an.type, an.a), labB = periodLabel(an.type, an.b);

  const sideSelects = side => {
    const { y, sub } = splitKey(an[side]);
    let html = `<select class="input" data-side="${side}" data-part="year" title="Ano">${yearOpts.map(k => `<option value="${k}"${k === y ? ' selected' : ''}>${k}</option>`).join('')}</select>`;
    if (an.type !== 'year') {
      html += `<select class="input" data-side="${side}" data-part="sub" title="Período">${subPeriodOptions(an.type, y).map(o => `<option value="${o.val}"${o.val === sub ? ' selected' : ''}>${esc(o.label)}</option>`).join('')}</select>`;
    }
    return `<div class="an-side">${html}</div>`;
  };

  // modo intervalo: valida De/Até e delega
  if (!an.from || !an.to) { const d = defaultPeriodsFor(an.type); an.from = d.b; an.to = d.a; }
  an.from = fixKey(an.from);
  an.to = fixKey(an.to);
  if (periodMonths(an.type, an.from)[0] > periodMonths(an.type, an.to)[0]) [an.from, an.to] = [an.to, an.from];
  if (an.mode === 'range') { renderAnalysisRange(v, sideSelects); return; }

  // gráfico mês a mês (períodos com mais de um mês)
  const METRICS = [['exp', 'Despesas'], ['inc', 'Receitas'], ['net', 'Poupança']];
  const metricVal = (T, i) => an.metric === 'exp' ? T.expByM[i] : an.metric === 'inc' ? T.incByM[i] : Math.max(T.incByM[i] - T.expByM[i], 0);
  const cols = mA.map((ym, i) => ({
    label: an.type === 'year' ? monthShort(ym) : monthShort(ym) + ' ' + ym.slice(2, 4),
    a: metricVal(A, i),
    b: metricVal(B, i),
    tipA: monthLabel(ym),
    tipB: mB[i] ? monthLabel(mB[i]) : '—',
  }));

  const expRows = catCompareRows(A.byCatExp, B.byCatExp, 'despesa');
  const incRows = catCompareRows(A.byCatInc, B.byCatInc, 'receita');

  const cmpTable = (rows, totalA, totalB, dir, key) => `
    <div class="cmp-head"><span></span><span class="num">${esc(labA)}</span><span class="num">${esc(labB)}</span><span class="num">Diferença</span></div>
    ${rows.map((r, i) => `
      <div class="cmp-row cq-link" data-cq="${key}${i}" role="button" tabindex="0" title="Ver os movimentos">
        <span class="c-name"><span class="c-dot" style="background:${catColor(r.cat)}"></span>${esc(r.cat ? r.cat.name : 'Sem categoria')}</span>
        <span class="num">${fmt(r.a)}</span>
        <span class="num" style="color:var(--ink-3)">${fmt(r.b)}</span>
        <span class="num">${deltaPill(r.a, r.b, dir)}</span>
      </div>`).join('')}
    <div class="cmp-row total">
      <span>Total</span>
      <span class="num">${fmt(totalA)}</span>
      <span class="num" style="color:var(--ink-3)">${fmt(totalB)}</span>
      <span class="num">${deltaPill(totalA, totalB, dir)}</span>
    </div>`;

  // oportunidades de poupança
  const both = expRows.filter(r => r.a > 0 && r.b > 0);
  const up = both.filter(r => r.a > r.b).sort((x, y) => (y.a - y.b) - (x.a - x.b))[0];
  const down = both.filter(r => r.a < r.b).sort((x, y) => (x.a - x.b) - (y.a - y.b))[0];
  const insights = (up || down) ? `
    <div style="margin-top:12px">
      ${up ? `<div class="insight">📈 Maior subida: <strong>${esc(up.cat ? up.cat.name : 'Sem categoria')}</strong> gastou mais ${fmt(up.a - up.b)} do que em ${esc(labB)} — é aqui que mora a oportunidade de poupança.</div>` : ''}
      ${down ? `<div class="insight">📉 Maior descida: <strong>${esc(down.cat ? down.cat.name : 'Sem categoria')}</strong> poupou ${fmt(down.b - down.a)} face a ${esc(labB)}.</div>` : ''}
    </div>` : '';

  const savingsRateA = A.inc > 0 ? A.net / A.inc : NaN;
  const savingsRateB = B.inc > 0 ? B.net / B.inc : NaN;

  v.innerHTML = `
    ${analysisControlsHTML(sideSelects)}

    <div class="tiles" style="grid-template-columns:repeat(4,1fr)">
      <div class="tile">
        <div class="t-label">Receitas</div>
        <div class="t-value" style="color:var(--good-text)">${fmt(A.inc)}</div>
        <div class="t-delta">${esc(labB)}: ${fmt(B.inc)}</div>
        <div style="margin-top:6px">${deltaPill(A.inc, B.inc, 'up')}</div>
      </div>
      <div class="tile">
        <div class="t-label">Despesas</div>
        <div class="t-value">${fmt(A.exp)}</div>
        <div class="t-delta">${esc(labB)}: ${fmt(B.exp)}</div>
        <div style="margin-top:6px">${deltaPill(A.exp, B.exp, 'down')}</div>
      </div>
      <div class="tile">
        <div class="t-label">Poupança</div>
        <div class="t-value">${fmt(A.net)}</div>
        <div class="t-delta">${isFinite(savingsRateA) ? 'taxa ' + (savingsRateA * 100).toFixed(0) + ' %' : '—'}${isFinite(savingsRateB) ? ' · antes ' + (savingsRateB * 100).toFixed(0) + ' %' : ''}</div>
        <div style="margin-top:6px">${deltaPill(A.net, B.net, 'up')}</div>
      </div>
      <div class="tile">
        <div class="t-label">Aportes em investimentos</div>
        <div class="t-value">${fmt(A.invested)}</div>
        <div class="t-delta">${esc(labB)}: ${fmt(B.invested)}</div>
        <div style="margin-top:6px">${deltaPill(A.invested, B.invested, 'neu')}</div>
      </div>
    </div>

    ${mA.length > 1 && A.activeMonths > 0 && B.activeMonths > 0 && A.activeMonths !== B.activeMonths ? `
    <div class="an-note">⚠ Comparação parcial: ${esc(labA)} tem movimentos em ${A.activeMonths} ${A.activeMonths === 1 ? 'mês' : 'meses'} e ${esc(labB)} em ${B.activeMonths} — os totais não são diretamente comparáveis. O gráfico mês a mês conta a história justa.</div>` : ''}

    ${mA.length > 1 ? `
    <div class="card" style="margin-bottom:18px">
      <div class="card-head">
        <span class="card-title">Mês a mês</span>
        <div style="display:flex;align-items:center;gap:14px">
          <div class="seg mini" id="anMetric" style="margin:0">
            ${METRICS.map(([k, lab]) => `<button type="button" data-m="${k}"${k === an.metric ? ' class="active"' : ''}>${lab}</button>`).join('')}
          </div>
          <div class="legend">
            <span class="key"><span class="dot" style="background:#2a78d6"></span>${esc(labA)}</span>
            <span class="key"><span class="dot" style="background:#898781"></span>${esc(labB)}</span>
          </div>
        </div>
      </div>
      ${compareChartHTML(cols, labA, labB)}
    </div>` : ''}

    <div class="card" style="margin-bottom:18px">
      <div class="card-head"><span class="card-title">Despesas por categoria</span><span class="card-note">${esc(labA)} vs ${esc(labB)}</span></div>
      ${expRows.length ? cmpTable(expRows, A.exp, B.exp, 'down', 'e') + insights : `<div class="empty" style="padding:22px 10px"><h3>Sem despesas nestes períodos</h3><p>Escolhe outros períodos em cima.</p></div>`}
    </div>

    <div class="card">
      <div class="card-head"><span class="card-title">Receitas por categoria</span><span class="card-note">${esc(labA)} vs ${esc(labB)}</span></div>
      ${incRows.length ? cmpTable(incRows, A.inc, B.inc, 'up', 'i') : `<div class="empty" style="padding:22px 10px"><h3>Sem receitas nestes períodos</h3><p>Escolhe outros períodos em cima.</p></div>`}
    </div>
  `;

  bindAnalysisControls(v);
  const met = $('#anMetric', v);
  if (met) $$('button', met).forEach(b => b.addEventListener('click', () => { an.metric = b.dataset.m; render(); }));
  bindCmpTooltip(cols, labA, labB);
  bindCatQuick(v, k => {
    const r = (k[0] === 'e' ? expRows : incRows)[+k.slice(1)];
    if (!r) return null;
    const q = catQuickQuery(k[0] === 'e' ? 'despesa' : 'receita', r);
    return { q, ym: catQuickStartMonth(q, [mA, mB]) };
  });
}

/* ---------- Ideias ---------- */
function isoOf(d) {
  return `${d.getFullYear()}-${String(d.getMonth() + 1).padStart(2, '0')}-${String(d.getDate()).padStart(2, '0')}`;
}
function journalDay(e) { return e.date || (e.createdAt || '').slice(0, 10); }

function journalDayLabel(dateStr) {
  const today = todayISO();
  const yest = new Date(); yest.setDate(yest.getDate() - 1);
  if (dateStr === today) return 'Hoje';
  if (dateStr === isoOf(yest)) return 'Ontem';
  const d = new Date(dateStr + 'T00:00:00');
  const opts = { weekday: 'long', day: 'numeric', month: 'long' };
  if (d.getFullYear() !== new Date().getFullYear()) opts.year = 'numeric';
  return d.toLocaleDateString('pt-PT', opts);
}

function autoGrow(el) { el.style.height = 'auto'; el.style.height = Math.min(el.scrollHeight, 260) + 'px'; }

function journalEntryHTML(e) {
  if (UI.journalEdit === e.id) {
    return `
    <div class="journal-entry editing" data-id="${e.id}">
      <textarea class="journal-input journal-edit-input" rows="2">${esc(UI.journalEditText ?? e.text)}</textarea>
      <div class="journal-composer-foot">
        <span class="journal-hint">Enter guarda · Esc cancela</span>
        <span class="journal-edit-btns">
          <button class="btn" data-j-cancel>Cancelar</button>
          <button class="btn btn-primary" data-j-save>Guardar</button>
        </span>
      </div>
    </div>`;
  }
  const time = new Date(e.createdAt).toLocaleTimeString('pt-PT', { hour: '2-digit', minute: '2-digit' });
  const edited = e.updatedAt ? ' · editado' : '';
  return `
  <div class="journal-entry" data-id="${e.id}">
    <div class="journal-entry-body">${esc(e.text).replace(/\n/g, '<br>')}</div>
    <div class="journal-entry-foot">
      <span class="journal-time">${time}${edited}</span>
      <span class="journal-entry-actions">
        <button class="btn-icon" data-j-edit="${e.id}" title="Editar">${I.edit}</button>
        <button class="btn-icon danger" data-j-del="${e.id}" title="Apagar">${I.trash}</button>
      </span>
    </div>
  </div>`;
}

function renderIdeias(v) {
  const entries = [...(DB.journal || [])]
    .sort((a, b) => (b.createdAt || '').localeCompare(a.createdAt || ''));
  const total = entries.length;

  // agrupar por dia (entries já ordenadas do mais recente para o mais antigo)
  const groups = [];
  let cur = null;
  for (const e of entries) {
    const day = journalDay(e);
    if (!cur || cur.day !== day) { cur = { day, label: journalDayLabel(day), items: [] }; groups.push(cur); }
    cur.items.push(e);
  }

  v.innerHTML = `
    <div class="card journal-composer">
      <textarea id="jInput" class="journal-input" rows="2" placeholder="Tiveste uma ideia sobre o teu dinheiro? Regista-a aqui — uma estratégia, algo a melhorar, uma oportunidade…"></textarea>
      <div class="journal-composer-foot">
        <span class="journal-hint">Enter para guardar · Shift+Enter para nova linha</span>
        <button class="btn btn-primary" id="jSave">${I.plus}<span>Registar ideia</span></button>
      </div>
    </div>

    ${total ? `<div class="journal-stats">
      <span><strong>${total}</strong> ${total === 1 ? 'ideia' : 'ideias'}</span>
    </div>` : ''}

    ${total ? groups.map(g => `
      <div class="journal-day">
        <div class="journal-day-label">${esc(g.label)}</div>
        ${g.items.map(journalEntryHTML).join('')}
      </div>`).join('') : `
      <div class="card"><div class="empty" style="padding:40px 12px">
        <div class="e-icon">${I.idea}</div>
        <h3>Ainda sem ideias</h3>
        <p>Regista aí em cima a primeira ideia que te surgir sobre o teu dinheiro. Sem regras nem formato — fica aqui guardada para quando precisares.</p>
      </div></div>`}
  `;

  const input = $('#jInput', v);
  input.value = UI.journalDraft || '';
  autoGrow(input);
  input.addEventListener('input', () => { UI.journalDraft = input.value; autoGrow(input); });
  const saveEntry = () => {
    const text = input.value.trim();
    if (!text) { input.focus(); return; }
    DB.journal.push({ id: uid(), text, date: todayISO(), createdAt: new Date().toISOString() });
    UI.journalDraft = '';
    save(); render(); toast('Ideia guardada');
  };
  $('#jSave', v).addEventListener('click', saveEntry);
  input.addEventListener('keydown', e => {
    if (e.key === 'Enter' && !e.shiftKey) { e.preventDefault(); saveEntry(); }
  });

  bindJournalEntries(v);

  // foco: no editor se estiver a editar, senão no compositor (retoma o fluxo sem fricção)
  if (!UI.journalEdit) input.focus();
}

// Ideias: há texto por guardar? (na caixa nova ou numa ideia a ser editada)
function journalEditChanged() {
  if (!UI.journalEdit || UI.journalEditText == null) return false;
  const e = (DB.journal || []).find(x => x.id === UI.journalEdit);
  return !!e && UI.journalEditText.trim() !== e.text.trim();
}
function journalUnsaved() { return !!(UI.journalDraft || '').trim() || journalEditChanged(); }
function stopJournalEdit() { UI.journalEdit = null; UI.journalEditText = null; }

function bindJournalEntries(v) {
  $$('[data-j-edit]', v).forEach(b => b.addEventListener('click', () => {
    const start = () => { UI.journalEdit = b.dataset.jEdit; UI.journalEditText = null; render(); };
    if (journalEditChanged()) confirmDiscard(start); else start();
  }));
  $$('[data-j-del]', v).forEach(b => b.addEventListener('click', () => {
    const id = b.dataset.jDel;
    confirmModal({
      title: 'Apagar ideia?',
      message: 'Esta ideia será removida. Esta ação não pode ser anulada.',
      confirmLabel: 'Apagar', danger: true,
      onConfirm() {
        DB.journal = DB.journal.filter(x => x.id !== id);
        if (UI.journalEdit === id) stopJournalEdit();
        save(); render(); toast('Ideia apagada');
      },
    });
  }));

  const ed = $('.journal-entry.editing', v);
  if (!ed) return;
  const ta = $('.journal-edit-input', ed);
  ta.focus(); ta.setSelectionRange(ta.value.length, ta.value.length); autoGrow(ta);
  ta.addEventListener('input', () => { UI.journalEditText = ta.value; autoGrow(ta); });
  const saveEdit = () => {
    const id = UI.journalEdit;
    const e = DB.journal.find(x => x.id === id);
    const text = ta.value.trim();
    if (e && text) { e.text = text; e.updatedAt = new Date().toISOString(); }
    stopJournalEdit(); save(); render();
    if (e && text) toast('Ideia atualizada');
  };
  // cancelar com alterações pergunta primeiro
  const cancelEdit = () => {
    const leave = () => { stopJournalEdit(); render(); };
    if (journalEditChanged()) confirmDiscard(leave); else leave();
  };
  $('[data-j-save]', ed).addEventListener('click', saveEdit);
  $('[data-j-cancel]', ed).addEventListener('click', cancelEdit);
  ta.addEventListener('keydown', e => {
    if (e.key === 'Enter' && !e.shiftKey) { e.preventDefault(); saveEdit(); }
    else if (e.key === 'Escape') { e.preventDefault(); cancelEdit(); }
  });
}

/* ---------- Definições ---------- */
function renderSettings(v) {
  const lastExp = DB.settings.lastExportAt;
  const lastExpTxt = lastExp
    ? `Último backup: ${new Date(lastExp).toLocaleDateString('pt-PT', { day: 'numeric', month: 'long', year: 'numeric' })}`
    : 'Ainda não fizeste nenhum backup.';

  // resumo de cada lista (que abre numa janela própria)
  const nAcc = DB.accounts.length, nRec = DB.recurrents.length, nInv = invTypes().length;
  const nExp = DB.categories.filter(c => c.type === 'despesa').length, nInc = DB.categories.filter(c => c.type === 'receita').length;

// janela simples para mudar um nome; onSave devolve false para a manter aberta (ex.: nome repetido)
function openRenameModal({ title, value, onSave, onClose }) {
  openModal({
    title,
    onClose,
    body: `<div class="field"><label>Nome</label><input id="inRen" value="${esc(value)}" autocomplete="off"></div>`,
    footHtml: `<button class="btn" data-cancel>Cancelar</button><button class="btn btn-primary" data-save>Guardar</button>`,
    onMount(bd) {
      $('[data-cancel]', bd).addEventListener('click', closeModal);
      const saveFn = () => {
        const n = $('#inRen', bd).value.trim();
        if (!n) return;
        if (onSave(n) === false) return;
        closeModal();
      };
      $('[data-save]', bd).addEventListener('click', saveFn);
      bd.addEventListener('keydown', e => { if (e.key === 'Enter') { e.preventDefault(); saveFn(); } });
    },
  });
}
// Enter num campo de «adicionar» carrega no botão +
function enterClicks(bd, inputs, btnSel) {
  inputs.forEach(s => { const el = $(s, bd); if (el) el.addEventListener('keydown', e => { if (e.key === 'Enter') { e.preventDefault(); $(btnSel, bd).click(); } }); });
}

// guarda a configuração de conta reforçada como nova versão em vigor a partir de `from`
// (as versões anteriores ficam no histórico; cfg = null desativa a partir dessa data)
function setReinforced(acc, cfg, from) {
  let vs = intVersions(acc).map(v => ({ ...v }));
  const last = vs[vs.length - 1] || null;
  const lastOn = last && last.on ? last : null;
  if (!cfg) {
    if (!lastOn) return false;
    vs = vs.filter(v => v.from < from);
    if (vs.length) vs.push({ from, on: false });
  } else if (lastOn && sameIntCfg(lastOn, cfg)) {
    if (from === lastOn.from || from === todayISO()) return false; // nada mudou
    // mesma configuração com outra data: muda o início da versão em vigor
    const prev = vs[vs.length - 2];
    if (prev && from <= prev.from) { vs = vs.filter(v => v.from < from); vs.push({ from, on: true, ...cfg }); }
    else lastOn.from = from;
  } else {
    vs = vs.filter(v => v.from < from);
    vs.push({ from, on: true, ...cfg });
  }
  acc.reinforced = vs.some(v => v.on) ? { versions: vs } : null;
  return true;
}
