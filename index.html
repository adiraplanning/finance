<head>
  <meta charset="UTF-8">

  <!-- iPhone / Android: abrir a partir do ecrã principal como uma app -->
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">

  <meta name="apple-mobile-web-app-status-bar-style" content="default">

  <!-- ícone: o «fluxo» do dinheiro — linha a subir sobre um gráfico, nas cores da app (versão simplificada para o separador) -->
  <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><defs><linearGradient id='g' x1='0' y1='0' x2='1' y2='1'><stop offset='0' stop-color='%232563d9'/><stop offset='.5' stop-color='%231f8fd0'/><stop offset='1' stop-color='%2312b07f'/></linearGradient></defs><rect width='100' height='100' rx='22.5' fill='url(%23g)'/><path d='M20 80V64.5a6.5 6.5 0 0 1 13 0V80zM39 80V56.5a6.5 6.5 0 0 1 13 0V80zM58 80V46.5a6.5 6.5 0 0 1 13 0V80z' fill='%23fff' fill-opacity='.22'/><path d='M18 70C42 74 54 40 76 29' fill='none' stroke='%23fff' stroke-width='7.8' stroke-linecap='round'/><path d='M84.5 24.8 77.6 38.8 69.1 21.9z' fill='%23fff' stroke='%23fff' stroke-width='2.2' stroke-linejoin='round'/><circle cx='18' cy='70' r='6.2' fill='%23fff'/></svg>">
  <link rel="icon" type="image/png" sizes="192x192" href="icons/icon-192.png">

  <script>
    // o manifesto (instalar no telemóvel) só faz sentido quando a app é servida por http(s);
    // aberta como ficheiro no PC, não se adiciona — evita erros na consola
    if (/^https?:$/.test(location.protocol)) {
      const l = document.createElement('link');
      l.rel = 'manifest'; l.href = 'manifest.webmanifest';
      document.head.appendChild(l);
    }
  </script>
  <style>
/* ============ Fluxo — Finanças Pessoais ============ */
/* Tokens */
:root {
  color-scheme: light;
  --bg: #ffffff;
  --surface: #ffffff;
  --wash: #f7f7f5;
  --ink: #0b0b0b;
  --ink-2: #52514e;
  --ink-3: #898781;
  --line: #e7e6e1;
  --hairline: rgba(11, 11, 11, 0.08);

  /* Série categórica (validada em fundo branco) */
  --s1: #2a78d6; /* azul */
  --s2: #1baf7a; /* aqua */
  --s3: #eda100; /* amarelo */
  --s4: #008300; /* verde */
  --s5: #4a3aa7; /* violeta */
  --s6: #e34948; /* vermelho */
  --s7: #e87ba4; /* magenta */
  --s8: #eb6834; /* laranja */

  --good: #0ca30c;
  --good-text: #006300;
  --warn: #fab219;
  --crit: #d03b3b;

  --blue-100: #cde2fb;
  --blue-wash: rgba(42, 120, 214, 0.10);

  --radius: 14px;
  --radius-s: 10px;
  --shadow: 0 1px 2px rgba(11, 11, 11, 0.04), 0 8px 24px -12px rgba(11, 11, 11, 0.10);
  --shadow-lift: 0 2px 4px rgba(11, 11, 11, 0.05), 0 16px 40px -16px rgba(11, 11, 11, 0.18);

  --font: ui-sans-serif, system-ui, "Segoe UI Variable Text", "Segoe UI", Inter, Roboto, "Helvetica Neue", sans-serif;
}

* { box-sizing: border-box; }

html, body {
  margin: 0;
  padding: 0;
  background: var(--bg);
  color: var(--ink);
  font-family: var(--font);
  font-size: 14px;
  line-height: 1.45;
  -webkit-font-smoothing: antialiased;
}

button, input, select, textarea { font: inherit; color: inherit; }

::selection { background: var(--blue-100); }

/* ============ Layout ============ */
.app { display: flex; min-height: 100vh; }

.sidebar {
  width: 236px;
  flex: 0 0 236px;
  border-right: 1px solid var(--line);
  display: flex;
  flex-direction: column;
  padding: 20px 14px;
  position: sticky;
  top: 0;
  height: 100vh;
  background: var(--bg);
}

.brand {
  display: flex;
  align-items: center;
  gap: 10px;
  padding: 4px 10px 18px;
  font-weight: 650;
  font-size: 16px;
  letter-spacing: -0.01em;
}
.brand .logo {
  width: 30px; height: 30px;
  border-radius: 9px;
  background: var(--ink);
  color: #fff;
  display: grid;
  place-items: center;
  font-size: 15px;
  font-weight: 700;
}
.brand small { display: block; font-weight: 450; color: var(--ink-3); font-size: 11px; letter-spacing: 0; }

.side-nav { display: flex; flex-direction: column; gap: 2px; flex: 1; min-height: 0; }
.nav-group { display: flex; flex-direction: column; gap: 2px; }
.nav-group + .nav-group { margin-top: 15px; }
.nav-group.nav-group-system { margin-top: auto; padding-top: 14px; border-top: 1px solid var(--line); }
.nav-section {
  font-size: 10.5px;
  font-weight: 650;
  text-transform: uppercase;
  letter-spacing: 0.06em;
  color: var(--ink-3);
  padding: 0 11px 5px;
}
.nav-item {
  display: flex;
  align-items: center;
  gap: 11px;
  width: 100%;
  padding: 9px 11px;
  border: 0;
  background: transparent;
  border-radius: 10px;
  color: var(--ink-2);
  font-weight: 500;
  font-size: 13.5px;
  cursor: pointer;
  text-align: left;
  transition: background 0.15s ease, color 0.15s ease;
}
.nav-item svg { width: 18px; height: 18px; flex: 0 0 18px; }
.nav-item:hover { background: var(--wash); color: var(--ink); }
.nav-item.active { background: var(--wash); color: var(--ink); font-weight: 600; }
.nav-item.active svg { color: var(--ink); }

.side-footer { margin-top: auto; display: flex; flex-direction: column; gap: 8px; padding: 0 2px; }
.backup-hint { font-size: 11.5px; color: var(--ink-3); padding: 0 9px; }
.side-footer .row { display: flex; gap: 8px; }
.side-footer .btn { flex: 1; justify-content: center; }

.main {
  flex: 1;
  min-width: 0;
  padding: 26px 34px 60px;
}

/* ============ Header ============ */
.header {
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 16px;
  margin-bottom: 24px;
}
.header h1 { font-size: 21px; font-weight: 650; letter-spacing: -0.015em; margin: 0; }
.header .sub { color: var(--ink-3); font-size: 12.5px; margin-top: 2px; }
.header-actions { display: flex; align-items: center; gap: 10px; }

.month-nav {
  display: flex;
  align-items: center;
  gap: 2px;
  border: 1px solid var(--line);
  border-radius: 10px;
  padding: 2px;
  background: var(--surface);
}
.month-nav button {
  border: 0; background: transparent; cursor: pointer;
  width: 28px; height: 28px; border-radius: 8px;
  display: grid; place-items: center; color: var(--ink-2);
}
.month-nav button:hover { background: var(--wash); color: var(--ink); }
.month-nav .label {
  min-width: 118px; text-align: center;
  font-weight: 600; font-size: 13px;
  text-transform: capitalize;
}

/* ============ Buttons ============ */
.btn {
  display: inline-flex;
  align-items: center;
  gap: 7px;
  padding: 8px 14px;
  border-radius: 10px;
  border: 1px solid var(--line);
  background: var(--surface);
  color: var(--ink);
  font-weight: 550;
  font-size: 13px;
  cursor: pointer;
  transition: background 0.15s ease, border-color 0.15s ease, transform 0.05s ease;
  white-space: nowrap;
}
.btn:hover { background: var(--wash); }
.btn:active { transform: scale(0.98); }
.btn svg { width: 15px; height: 15px; }

.btn-primary { background: var(--ink); color: #fff; border-color: var(--ink); }
.btn-primary:hover { background: #262624; }

.btn-danger { color: var(--crit); border-color: rgba(208, 59, 59, 0.35); }
.btn-danger:hover { background: rgba(208, 59, 59, 0.06); }

.btn-icon {
  width: 30px; height: 30px; padding: 0;
  display: inline-grid; place-items: center;
  border: 0; background: transparent; border-radius: 8px;
  color: var(--ink-3); cursor: pointer;
}
.btn-icon:hover { background: var(--wash); color: var(--ink); }
.btn-icon.danger:hover { color: var(--crit); background: rgba(208, 59, 59, 0.07); }

/* ============ Cards / tiles ============ */
.card {
  background: var(--surface);
  border: 1px solid var(--line);
  border-radius: var(--radius);
  box-shadow: var(--shadow);
  padding: 20px 22px;
}
.card + .card { margin-top: 18px; }
.card-head {
  display: flex; align-items: baseline; justify-content: space-between;
  gap: 12px; margin-bottom: 14px;
}
.card-title { font-size: 13.5px; font-weight: 650; letter-spacing: -0.01em; }
.card-note { font-size: 12px; color: var(--ink-3); }

.tiles {
  display: grid;
  grid-template-columns: 1.6fr repeat(4, 1fr);
  gap: 14px;
  margin-bottom: 18px;
}
.tile {
  background: var(--surface);
  border: 1px solid var(--line);
  border-radius: var(--radius);
  box-shadow: var(--shadow);
  padding: 16px 18px;
  min-width: 0;
}
.tile .t-label { font-size: 12px; color: var(--ink-2); font-weight: 500; }
.tile .t-value { font-size: 22px; font-weight: 650; letter-spacing: -0.02em; margin-top: 4px; }
.tile .t-delta { font-size: 11.5px; margin-top: 3px; color: var(--ink-3); }
.tile .t-delta.up { color: var(--good-text); }
.tile .t-delta.down { color: var(--crit); }

.hero { grid-row: span 1; display: flex; flex-direction: column; justify-content: space-between; position: relative; overflow: hidden; }
.hero .t-value { font-size: 34px; margin-top: 2px; }
.hero-split { margin-top: 14px; }
.hero-bar { display: flex; gap: 2px; height: 8px; border-radius: 4px; overflow: hidden; margin-bottom: 11px; }
.hero-bar span { height: 100%; min-width: 3px; }
.hero-rows { display: flex; flex-direction: column; gap: 5px; }
.hero-rows .row { display: flex; align-items: center; gap: 8px; font-size: 12px; color: var(--ink-2); }
.hero-rows .dot { width: 8px; height: 8px; border-radius: 3px; flex: 0 0 8px; }
.hero-rows .nm { white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.hero-rows .val { margin-left: auto; font-weight: 600; color: var(--ink); font-variant-numeric: tabular-nums; }
.hero-note { margin-top: 9px; font-size: 11.5px; color: var(--ink-3); }
button.hero-note.clickable {
  display: block;
  border: 0; background: transparent; padding: 0;
  text-align: left; cursor: pointer;
  text-decoration: underline dotted transparent;
  text-underline-offset: 3px;
  transition: color 0.15s ease, text-decoration-color 0.15s ease;
}
button.hero-note.clickable:hover { color: var(--ink); text-decoration-color: var(--ink-3); }

.reserved-row {
  display: flex; justify-content: space-between; align-items: baseline;
  gap: 14px; padding: 9px 2px;
  border-top: 1px solid var(--hairline);
  font-size: 13px;
}
.reserved-row:first-child { border-top: 0; }
.reserved-row .nm { color: var(--ink-2); }
.reserved-row .val { font-weight: 600; font-variant-numeric: tabular-nums; white-space: nowrap; }
.reserved-row.total { border-top: 1px solid var(--line); margin-top: 4px; }
.reserved-row.total .nm { font-weight: 650; color: var(--ink); }

.inv-hist-notes {
  margin-top: 12px;
  padding: 11px 13px;
  background: var(--wash);
  border-radius: var(--radius-s);
  font-size: 12.5px;
  color: var(--ink-2);
  line-height: 1.5;
  white-space: pre-wrap;
  word-break: break-word;
}
.inv-hist-notes .lbl {
  display: block;
  font-size: 10.5px;
  font-weight: 650;
  text-transform: uppercase;
  letter-spacing: 0.05em;
  color: var(--ink-3);
  margin-bottom: 3px;
}

.charts-row {
  display: grid;
  grid-template-columns: 1.25fr 1fr;
  gap: 18px;
  margin-bottom: 18px;
}
.insight-row > .card,
.charts-row > .card { height: 100%; margin-top: 0; }

/* ============ Visão geral — cartões de destaque ============ */
.insight-row { display: grid; grid-template-columns: 1.25fr 1fr; gap: 18px; margin-bottom: 18px; }
.insight-row.single { grid-template-columns: 1fr; }
.insight-card { cursor: pointer; height: 100%; transition: border-color 0.15s, box-shadow 0.15s; }
.insight-card:hover { border-color: var(--line-2, #d7d7d3); box-shadow: 0 2px 10px rgba(11, 11, 11, 0.05); }
.insight-name { font-weight: 600; font-size: 13.5px; display: flex; align-items: center; gap: 8px; margin-bottom: 11px; }
.insight-name .c-dot { width: 9px; height: 9px; border-radius: 3px; flex: 0 0 9px; }
.alert-rows { display: flex; flex-direction: column; gap: 12px; }
.alert-row { display: grid; grid-template-columns: 120px 1fr 48px; align-items: center; gap: 12px; }
.alert-row .c-name { font-size: 12.5px; color: var(--ink-2); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; display: flex; align-items: center; gap: 7px; }
.alert-row .c-name .c-dot { width: 8px; height: 8px; border-radius: 3px; flex: 0 0 8px; }
.alert-row .a-val { font-size: 12.5px; font-weight: 600; text-align: right; font-variant-numeric: tabular-nums; }
.alert-row .a-val.over { color: var(--crit); }
.alert-row .a-val.near { color: #8a6100; }

/* Fundo de emergência (cartão da Visão geral) */
.ef-card { display: flex; align-items: center; gap: 28px; margin-bottom: 18px; }
.ef-left { flex: 0 0 auto; min-width: 190px; }
.ef-months { display: flex; align-items: baseline; gap: 8px; margin-top: 7px; }
.ef-months strong { font-size: 30px; font-weight: 680; letter-spacing: -0.02em; line-height: 1; font-variant-numeric: tabular-nums; }
.ef-unit { font-size: 12.5px; color: var(--ink-2); }
.ef-status { font-size: 12px; margin-top: 6px; color: var(--ink-3); }
.ef-status.pl-pos { color: var(--good-text); }
.ef-status.pl-neg { color: var(--crit); }
.ef-right { flex: 1; min-width: 0; }
.ef-meter { height: 12px; border-radius: 6px; overflow: hidden; }
.ef-meter .fill { height: 100%; border-radius: 6px; min-width: 2px; transition: width 0.4s cubic-bezier(0.22, 1, 0.36, 1); }
.ef-legend { display: flex; justify-content: space-between; gap: 16px; margin-top: 9px; font-size: 12.5px; color: var(--ink-2); flex-wrap: wrap; }
.ef-legend strong { color: var(--ink); font-variant-numeric: tabular-nums; }
.ef-hint { color: var(--ink-3); }
.ef-cta { display: inline-block; margin-top: 10px; background: none; border: 0; padding: 0; font: inherit; font-size: 12.5px; color: var(--s1); cursor: pointer; }
.ef-cta:hover { text-decoration: underline; }

/* Empurrão de recorrentes por registar (Visão geral) */
.recur-nudge { display: flex; align-items: center; justify-content: space-between; gap: 16px; margin-bottom: 18px; padding: 14px 18px; }
.recur-nudge .rn-left { display: flex; align-items: center; gap: 13px; min-width: 0; }
.rn-icon { display: inline-flex; width: 34px; height: 34px; border-radius: 9px; background: var(--blue-wash); color: var(--s1); align-items: center; justify-content: center; flex: 0 0 auto; }
.rn-icon svg { width: 18px; height: 18px; }
.rn-txt { min-width: 0; }
.rn-title { font-weight: 600; font-size: 13.5px; }
.rn-sub { font-size: 12px; color: var(--ink-3); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; margin-top: 1px; }
.recur-nudge .btn { flex: 0 0 auto; }

/* linha de checkbox (modais) */
.check-row { display: flex; align-items: flex-start; gap: 10px; font-size: 13px; cursor: pointer; margin-bottom: 13px; }
.check-row input { margin-top: 1px; width: 16px; height: 16px; flex: 0 0 auto; accent-color: var(--s1); cursor: pointer; }
.check-row > span { display: flex; flex-direction: column; gap: 2px; }
.check-row small { color: var(--ink-3); font-size: 11.5px; }

/* ============ Legend & chart bits ============ */
.legend { display: flex; gap: 16px; align-items: center; font-size: 12px; color: var(--ink-2); }
.legend .key { display: inline-flex; align-items: center; gap: 6px; }
.legend .dot { width: 9px; height: 9px; border-radius: 3px; }

.flow-svg { display: block; width: 100%; height: auto; }
.flow-svg text { font-family: var(--font); }

.bar-group { cursor: default; }
.bar-group rect.hit { fill: transparent; }
.bar-group:hover rect.hit { fill: rgba(11, 11, 11, 0.035); }

/* categorias — barras horizontais */
.cat-rows { display: flex; flex-direction: column; gap: 11px; }
.cat-row { display: grid; grid-template-columns: 118px 1fr 84px; align-items: center; gap: 12px; }
.cat-row .c-name { font-size: 12.5px; color: var(--ink-2); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; display: flex; align-items: center; gap: 7px; }
.cat-row .c-dot { width: 8px; height: 8px; border-radius: 3px; flex: 0 0 8px; }
.cat-row .c-track { height: 13px; border-radius: 0 4px 4px 0; position: relative; }
.cat-row .c-fill { height: 100%; border-radius: 0 4px 4px 0; min-width: 2px; transition: width 0.4s cubic-bezier(0.22, 1, 0.36, 1); }
.cat-row .c-val { font-size: 12.5px; font-weight: 600; text-align: right; font-variant-numeric: tabular-nums; }

/* donut */
.donut-wrap { display: flex; align-items: center; gap: 26px; }
.donut-wrap svg { flex: 0 0 auto; }
.donut-legend { display: flex; flex-direction: column; gap: 8px; min-width: 0; flex: 1; }
.donut-legend .row { display: flex; align-items: center; gap: 8px; font-size: 12.5px; }
.donut-legend .dot { width: 9px; height: 9px; border-radius: 3px; flex: 0 0 9px; }
.donut-legend .name { color: var(--ink-2); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; flex: 1; }
.donut-legend .val { font-weight: 600; font-variant-numeric: tabular-nums; }
.donut-legend .pct { color: var(--ink-3); font-size: 11.5px; width: 44px; text-align: right; font-variant-numeric: tabular-nums; }

/* ============ Transações ============ */
.toolbar { display: flex; gap: 10px; margin-bottom: 18px; flex-wrap: wrap; }
.toolbar .search { flex: 1; min-width: 200px; position: relative; }
.toolbar .search svg { position: absolute; left: 11px; top: 50%; transform: translateY(-50%); width: 15px; height: 15px; color: var(--ink-3); }
.toolbar .search input { padding-left: 34px; width: 100%; }

.input, .toolbar select, .toolbar input {
  padding: 8px 12px;
  border: 1px solid var(--line);
  border-radius: 10px;
  background: var(--surface);
  font-size: 13px;
  outline: none;
  transition: border-color 0.15s ease, box-shadow 0.15s ease;
}
.toolbar select { cursor: pointer; }
.input:focus, .toolbar input:focus, .toolbar select:focus,
.field input:focus, .field select:focus, .field textarea:focus {
  border-color: var(--s1);
  box-shadow: 0 0 0 3px var(--blue-wash);
}

.day-group { margin-bottom: 4px; }
.day-head {
  display: flex; justify-content: space-between; align-items: baseline;
  padding: 14px 6px 7px;
  font-size: 11.5px; font-weight: 600; color: var(--ink-3);
  text-transform: capitalize;
  letter-spacing: 0.02em;
}
.day-head .day-total { font-variant-numeric: tabular-nums; font-weight: 550; }

.tx-row {
  display: grid;
  grid-template-columns: 1fr 150px 130px 120px 64px;
  align-items: center;
  gap: 12px;
  padding: 10px 6px;
  border-top: 1px solid var(--hairline);
  border-radius: 8px;
  cursor: pointer;
  transition: background 0.12s ease;
}
.tx-row:hover { background: var(--wash); }
.tx-desc { display: flex; align-items: center; gap: 10px; min-width: 0; }
.tx-desc .avatar {
  width: 32px; height: 32px; flex: 0 0 32px;
  border-radius: 10px;
  display: grid; place-items: center;
  font-size: 12px; font-weight: 650;
}
.tx-desc .txt { min-width: 0; }
.tx-desc .txt .d1 { font-weight: 550; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.tx-desc .txt .d2 { font-size: 11.5px; color: var(--ink-3); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.tx-cat { font-size: 12px; color: var(--ink-2); display: flex; align-items: center; gap: 7px; min-width: 0; }
.tx-cat .c-dot { width: 8px; height: 8px; border-radius: 3px; flex: 0 0 8px; }
.tx-cat span { white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.tx-acc { font-size: 12px; color: var(--ink-3); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.tx-amount { text-align: right; font-weight: 600; font-variant-numeric: tabular-nums; white-space: nowrap; }
.tx-amount.in { color: var(--good-text); }
.tx-actions { display: flex; justify-content: flex-end; gap: 2px; opacity: 0; transition: opacity 0.12s ease; }
.tx-row:hover .tx-actions { opacity: 1; }

/* ============ Orçamentos ============ */
.budget-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 14px; }
.budget-card { border: 1px solid var(--line); border-radius: var(--radius-s); padding: 15px 16px; }
.budget-card .b-head { display: flex; justify-content: space-between; align-items: center; margin-bottom: 10px; }
.budget-card .b-name { font-weight: 600; font-size: 13px; display: flex; align-items: center; gap: 8px; }
.budget-card .b-name .c-dot { width: 8px; height: 8px; border-radius: 3px; }
.budget-card .b-nums { display: flex; justify-content: space-between; gap: 10px; font-size: 12px; color: var(--ink-2); margin-top: 8px; }
.insight-card .b-nums { display: flex; flex-direction: column; align-items: flex-start; gap: 2px; font-size: 12px; color: var(--ink-2); margin-top: 8px; }
.budget-card .b-nums strong,
.insight-card .b-nums strong { color: var(--ink); font-variant-numeric: tabular-nums; }
.meter { height: 10px; border-radius: 5px; overflow: hidden; }
.meter .fill { height: 100%; border-radius: 5px; min-width: 2px; transition: width 0.4s cubic-bezier(0.22, 1, 0.36, 1); }
.b-status { font-size: 11.5px; margin-top: 7px; display: flex; align-items: center; gap: 5px; color: var(--ink-3); }
.b-status.over { color: var(--crit); font-weight: 550; }
.b-status.near { color: #8a6100; font-weight: 550; }

.no-budget-row {
  display: flex; justify-content: space-between; align-items: center;
  padding: 9px 6px; border-top: 1px solid var(--hairline); font-size: 13px;
}
.no-budget-row .n { display: flex; align-items: center; gap: 8px; color: var(--ink-2); }

/* ============ Investimentos ============ */
.inv-table { width: 100%; border-collapse: collapse; }
.inv-table th {
  text-align: left; font-size: 11px; font-weight: 600; color: var(--ink-3);
  text-transform: uppercase; letter-spacing: 0.05em;
  padding: 8px 10px; border-bottom: 1px solid var(--line);
}
.inv-table th.num, .inv-table td.num { text-align: right; font-variant-numeric: tabular-nums; }
.inv-table td { padding: 11px 10px; border-bottom: 1px solid var(--hairline); font-size: 13px; }
.inv-table tr:last-child td { border-bottom: 0; }
.inv-table tbody tr { transition: background 0.12s ease; }
.inv-table tbody tr:hover { background: var(--wash); }
.inv-name { font-weight: 600; }
.inv-name small { display: block; font-weight: 450; color: var(--ink-3); font-size: 11px; }
.badge {
  display: inline-block; padding: 2.5px 9px; border-radius: 999px;
  font-size: 11px; font-weight: 550;
  background: var(--wash); color: var(--ink-2); border: 1px solid var(--line);
}
.pl-pos { color: var(--good-text); font-weight: 600; }
.pl-neg { color: var(--crit); font-weight: 600; }
.inv-table tr.inv-closed td { color: var(--ink-3); }
.inv-table tr.inv-closed .inv-name { font-weight: 550; }
.inv-warn { color: var(--warn); cursor: help; }
.badge-buy { background: var(--blue-wash); color: var(--s1); border-color: transparent; }
.badge-sell { background: rgba(12, 163, 12, 0.12); color: var(--good-text); border-color: transparent; }

/* botão-link discreto (ex.: "vender tudo") */
.linklike { background: none; border: 0; padding: 0; font: inherit; color: var(--s1); cursor: pointer; text-decoration: underline; }
.linklike:hover { opacity: 0.8; }
/* pré-visualização do resultado no modal de venda */
.sell-preview { min-height: 16px; font-size: 12px; color: var(--ink-2); margin-top: 2px; }
/* indicador de lançamento gerido a partir de Investimentos */
.tx-managed { display: inline-flex; align-items: center; color: var(--ink-3); padding: 6px; }
.tx-managed svg { width: 15px; height: 15px; }

/* janela «Opções» de cada conta (acertar saldo, fundo, conta reforçada) */
.opt-sec { padding: 14px 0 2px; border-top: 1px solid var(--hairline); }
.opt-sec:first-child { padding-top: 0; border-top: 0; }
.opt-title { font-size: 11.5px; font-weight: 650; text-transform: uppercase; letter-spacing: 0.05em; color: var(--ink-3); margin-bottom: 9px; }
.opt-note { margin: 0 0 12px; color: var(--ink-2); font-size: 12.5px; }
.opt-preview { margin: -4px 0 13px; font-size: 12px; color: var(--ink-2); line-height: 1.5; }
.opt-preview:empty { display: none; }
.opt-hist { margin: 0 0 13px; padding: 8px 11px; border-radius: var(--radius-s); background: var(--wash); font-size: 11.5px; color: var(--ink-2); }
.opt-hist .h-t { font-weight: 600; color: var(--ink-3); margin-bottom: 3px; }
.opt-hist .h-r { padding: 1.5px 0; font-variant-numeric: tabular-nums; }
.badge-reinf { background: var(--blue-wash); color: var(--s1); border-color: transparent; }
.field-hint { margin: 5px 0 0; font-size: 11.5px; color: var(--ink-3); line-height: 1.45; }
.field-hint:empty { display: none; }

/* ============ Definições ============ */
.settings-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 18px; align-items: start; }
.settings-grid .card { margin: 0; }
.settings-col { display: flex; flex-direction: column; gap: 18px; min-width: 0; }
.setting-row {
  display: flex; justify-content: space-between; align-items: center;
  padding: 10px 2px; border-top: 1px solid var(--hairline);
  font-size: 13px; gap: 10px;
}
.setting-row:first-of-type { border-top: 0; }
.setting-row .meta { color: var(--ink-3); font-size: 12px; }
.setting-row .grow { flex: 1; min-width: 0; }
.add-inline { display: flex; gap: 8px; margin-top: 12px; }
.add-inline input, .add-inline select { flex: 1; }

.backup-card { display: flex; align-items: center; justify-content: space-between; gap: 20px; }
.backup-card .info h3 { margin: 0 0 4px; font-size: 15px; font-weight: 650; }
.backup-card .info p { margin: 0; color: var(--ink-2); font-size: 12.5px; max-width: 48ch; }
.backup-card .actions { display: flex; gap: 10px; flex: 0 0 auto; }

.danger-zone { border-color: rgba(208, 59, 59, 0.25); }

/* ============ Formulários / Modal ============ */
.modal-backdrop {
  position: fixed; inset: 0;
  background: rgba(11, 11, 11, 0.32);
  backdrop-filter: blur(3px);
  display: grid; place-items: center;
  z-index: 100;
  animation: fadeIn 0.15s ease;
  padding: 20px;
}
.modal {
  background: var(--surface);
  border-radius: 16px;
  box-shadow: var(--shadow-lift);
  width: 100%;
  max-width: 460px;
  max-height: calc(100vh - 40px);
  overflow: auto;
  animation: popIn 0.18s cubic-bezier(0.22, 1, 0.36, 1);
}
.modal.wide { max-width: 560px; }
.modal-head {
  display: flex; justify-content: space-between; align-items: center;
  padding: 18px 22px 0;
}
.modal-head h2 { margin: 0; font-size: 16px; font-weight: 650; letter-spacing: -0.01em; }
.modal-body { padding: 16px 22px 4px; }
.modal-foot {
  display: flex; justify-content: flex-end; gap: 10px;
  padding: 14px 22px 20px;
}
@keyframes fadeIn { from { opacity: 0; } }
@keyframes popIn { from { opacity: 0; transform: scale(0.97) translateY(6px); } }

.field { margin-bottom: 13px; }
.field label { display: block; font-size: 12px; font-weight: 550; color: var(--ink-2); margin-bottom: 5px; }
.field input, .field select, .field textarea {
  width: 100%;
  padding: 9px 12px;
  border: 1px solid var(--line);
  border-radius: var(--radius-s);
  background: var(--surface);
  font-size: 13.5px;
  outline: none;
  transition: border-color 0.15s ease, box-shadow 0.15s ease;
}
.field textarea { resize: vertical; min-height: 60px; }
.field .err { color: var(--crit); font-size: 11.5px; margin-top: 4px; display: none; }
.ro-field {
  padding: 9px 12px;
  border: 1px solid var(--line);
  border-radius: var(--radius-s);
  background: var(--wash);
  font-size: 13.5px;
  color: var(--ink-2);
  font-variant-numeric: tabular-nums;
}
.field.invalid input, .field.invalid select { border-color: var(--crit); }
.field.invalid .err { display: block; }
.form-row { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }

.seg {
  display: grid; grid-auto-flow: column; grid-auto-columns: 1fr;
  gap: 3px;
  background: var(--wash);
  border-radius: var(--radius-s);
  padding: 3px;
  margin-bottom: 14px;
}
.seg button {
  border: 0; background: transparent;
  padding: 8px; border-radius: 8px;
  font-weight: 550; font-size: 13px; color: var(--ink-3);
  cursor: pointer;
  transition: all 0.15s ease;
}
.seg button.active { background: var(--surface); color: var(--ink); box-shadow: 0 1px 3px rgba(11, 11, 11, 0.10); }
.seg button.active.exp { color: var(--crit); }
.seg button.active.inc { color: var(--good-text); }

/* ============ Recorrentes ============ */
.choice-btn {
  display: block; width: 100%; text-align: left;
  padding: 14px 16px; margin-bottom: 10px;
  border: 1px solid var(--line); border-radius: 12px;
  background: var(--surface); cursor: pointer;
  transition: background 0.13s ease, border-color 0.13s ease, transform 0.05s ease;
}
.choice-btn:hover { background: var(--wash); border-color: var(--ink-3); }
.choice-btn:active { transform: scale(0.99); }
.choice-btn .c-t { display: block; font-weight: 650; font-size: 14px; }
.choice-btn .c-d { display: block; font-size: 12px; color: var(--ink-3); margin-top: 2px; }

.rec-row {
  display: flex; align-items: center; gap: 10px;
  padding: 10px 10px 10px 12px; margin-bottom: 7px;
  border: 1px solid var(--line); border-radius: 11px;
  cursor: pointer;
  transition: background 0.12s ease, border-color 0.12s ease;
}
.rec-row:hover { background: var(--wash); }
.rec-row.done { opacity: 0.6; }
.rec-row .rec-main { flex: 1; min-width: 0; }
.rec-row .r1 { font-weight: 550; font-size: 13px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.rec-row .r2 { font-size: 11.5px; color: var(--ink-3); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.rec-row .rec-val { font-weight: 600; font-variant-numeric: tabular-nums; white-space: nowrap; }
.rec-row .rec-val.in { color: var(--good-text); }
.rec-row .done-tag { font-size: 11px; color: var(--good-text); font-weight: 600; white-space: nowrap; }
.rec-row.later { opacity: 0.6; }                 /* não sai este mês (trimestral, semestral, anual) */
.rec-row .later-tag { font-size: 11px; color: var(--ink-3); font-weight: 550; white-space: nowrap; }

/* ============ Análise ============ */
.an-controls {
  display: flex; flex-wrap: wrap; gap: 14px;
  align-items: center; justify-content: space-between;
}
.an-controls .seg { margin: 0; flex: 0 0 auto; }
.an-controls .seg button { padding: 7px 14px; }
.an-periods { display: flex; align-items: center; gap: 8px; flex-wrap: wrap; }
.an-lbl { font-size: 12px; color: var(--ink-3); }
.an-side { display: flex; gap: 6px; }
.an-periods select { cursor: pointer; text-transform: capitalize; }
.an-side select[data-part="year"] { width: 84px; }
.an-side select[data-part="sub"] { min-width: 130px; }
.an-periods #anSwap { font-size: 15px; }

.seg.mini { padding: 2px; }
.seg.mini button { padding: 4px 10px; font-size: 12px; }

.delta-pill {
  display: inline-block; padding: 2.5px 10px; border-radius: 999px;
  font-size: 11.5px; font-weight: 600; white-space: nowrap;
  font-variant-numeric: tabular-nums;
}
.delta-pill.good { background: rgba(12, 163, 12, 0.10); color: var(--good-text); }
.delta-pill.bad { background: rgba(208, 59, 59, 0.10); color: var(--crit); }
.delta-pill.neu { background: var(--wash); color: var(--ink-2); }

.cmp-head, .cmp-row {
  display: grid;
  grid-template-columns: 1fr 110px 110px 170px;
  gap: 10px; align-items: center;
  padding: 8px 6px;
}
.cmp-head {
  font-size: 11px; font-weight: 600; color: var(--ink-3);
  text-transform: uppercase; letter-spacing: 0.05em;
  border-bottom: 1px solid var(--line);
  padding-bottom: 6px;
}
.cmp-row { border-top: 1px solid var(--hairline); font-size: 13px; }
.cmp-row:nth-of-type(2) { border-top: 0; }
.cmp-head .num, .cmp-row .num { text-align: right; font-variant-numeric: tabular-nums; }
.cmp-row .c-name { display: flex; align-items: center; gap: 8px; min-width: 0; color: var(--ink-2); }
.cmp-row .c-name .c-dot { width: 8px; height: 8px; border-radius: 3px; flex: 0 0 8px; }
.cmp-row.total { border-top: 1px solid var(--line); font-weight: 650; }
.cmp-row.total .num { color: var(--ink); }

.insight { font-size: 12.5px; color: var(--ink-2); margin-top: 6px; }
.an-note {
  margin-bottom: 18px;
  padding: 10px 14px;
  border: 1px solid rgba(250, 178, 25, 0.45);
  background: rgba(250, 178, 25, 0.08);
  border-radius: var(--radius-s);
  font-size: 12.5px;
  color: var(--ink-2);
}

@media (max-width: 1080px) {
  .cmp-head, .cmp-row { grid-template-columns: 1fr 90px 90px 130px; }
}

.hist-pager {
  display: flex; align-items: center; justify-content: center;
  gap: 14px; padding: 10px 0 4px;
  font-size: 12px; color: var(--ink-3);
}
.hist-pager .btn { padding: 4px 9px; }
.hist-pager .btn:disabled { opacity: 0.35; cursor: default; }
.hist-pager .btn svg { width: 14px; height: 14px; }

/* ============ Vazios / toast / tooltip ============ */
.empty {
  text-align: center;
  padding: 44px 20px;
  color: var(--ink-3);
}
.empty .e-icon { width: 44px; height: 44px; border-radius: 13px; background: var(--wash); display: grid; place-items: center; margin: 0 auto 12px; color: var(--ink-3); }
.empty h3 { margin: 0 0 4px; color: var(--ink); font-size: 14.5px; font-weight: 600; }
.empty p { margin: 0 0 16px; font-size: 12.5px; }

.toast {
  position: fixed;
  bottom: 26px; left: 50%;
  transform: translateX(-50%) translateY(10px);
  background: var(--ink); color: #fff;
  padding: 10px 18px;
  border-radius: 11px;
  font-size: 13px; font-weight: 500;
  box-shadow: var(--shadow-lift);
  opacity: 0;
  transition: opacity 0.2s ease, transform 0.2s ease;
  z-index: 200;
  pointer-events: none;
}
.toast.show { opacity: 1; transform: translateX(-50%) translateY(0); }

.chart-tip {
  position: fixed;
  z-index: 150;
  background: var(--ink);
  color: #fff;
  border-radius: 9px;
  padding: 8px 12px;
  font-size: 12px;
  pointer-events: none;
  box-shadow: var(--shadow-lift);
  opacity: 0;
  transition: opacity 0.1s ease;
  max-width: 240px;
}
.chart-tip.show { opacity: 1; }
.chart-tip .tt-title { font-weight: 650; margin-bottom: 3px; text-transform: capitalize; }
.chart-tip .tt-row { display: flex; align-items: center; gap: 6px; white-space: nowrap; }
.chart-tip .tt-row .dot { width: 7px; height: 7px; border-radius: 2px; }
.chart-tip .tt-row .v { margin-left: auto; padding-left: 14px; font-variant-numeric: tabular-nums; font-weight: 600; }

/* ============ Diário ============ */
.journal-composer { padding: 15px 18px; }
.journal-input {
  width: 100%; border: 0; background: transparent; resize: none;
  font-family: var(--font); font-size: 14.5px; line-height: 1.55; color: var(--ink);
  padding: 2px 1px; outline: none; display: block;
}
.journal-input::placeholder { color: var(--ink-3); }
.journal-composer-foot { display: flex; align-items: center; justify-content: space-between; gap: 12px; margin-top: 10px; }
.journal-hint { font-size: 11.5px; color: var(--ink-3); }
.journal-edit-btns { display: inline-flex; gap: 8px; }

.journal-stats { display: flex; align-items: center; gap: 16px; margin: 20px 2px 12px; font-size: 12.5px; color: var(--ink-2); }
.journal-stats strong { color: var(--ink); font-variant-numeric: tabular-nums; }

.journal-day + .journal-day { margin-top: 20px; }
.journal-day-label { font-size: 12px; font-weight: 650; color: var(--ink-3); text-transform: capitalize; margin: 0 2px 9px; }

.journal-entry {
  background: var(--surface); border: 1px solid var(--line); border-radius: var(--radius);
  box-shadow: var(--shadow); padding: 14px 16px;
}
.journal-entry + .journal-entry { margin-top: 10px; }
.journal-entry-body { font-size: 14px; line-height: 1.62; color: var(--ink); overflow-wrap: anywhere; }
.journal-entry-foot { display: flex; align-items: center; justify-content: space-between; gap: 10px; margin-top: 9px; }
.journal-time { font-size: 11.5px; color: var(--ink-3); text-transform: capitalize; }
.journal-entry-actions { display: inline-flex; gap: 2px; opacity: 0; transition: opacity 0.15s; }
.journal-entry:hover .journal-entry-actions,
.journal-entry:focus-within .journal-entry-actions { opacity: 1; }
.journal-entry.editing { border-color: var(--blue-100); box-shadow: var(--shadow-lift); }
.journal-edit-input { min-height: 60px; }

/* ============ Responsivo ============ */
@media (max-width: 1080px) {
  .tiles { grid-template-columns: repeat(2, 1fr); }
  .hero { grid-column: span 2; }
  .charts-row { grid-template-columns: 1fr; }
  .insight-row { grid-template-columns: 1fr; }
  .budget-grid { grid-template-columns: 1fr; }
  .settings-grid { grid-template-columns: 1fr; }
  .ef-card { flex-direction: column; align-items: stretch; gap: 14px; }
  .ef-left { min-width: 0; }
}
@media (max-width: 820px) {
  .app { flex-direction: column; }
  .sidebar {
    width: 100%; flex: none; height: auto; position: static;
    flex-direction: row; align-items: center;
    border-right: 0; border-bottom: 1px solid var(--line);
    padding: 10px 14px; gap: 8px;
  }
  .brand { padding: 0 8px 0 0; }
  .brand small { display: none; }
  .side-nav { flex-direction: row; overflow-x: auto; flex: 1; align-items: center; }
  .nav-group { flex-direction: row; gap: 2px; }
  .nav-group + .nav-group { margin-top: 0; margin-left: 8px; padding-left: 8px; border-left: 1px solid var(--line); }
  .nav-group.nav-group-system { margin-top: 0; margin-left: 8px; padding-top: 0; padding-left: 8px; border-top: 0; border-left: 1px solid var(--line); }
  .nav-section { display: none; }
  .nav-item span { display: none; }
  .side-footer { display: none; }
  .main { padding: 18px 16px 50px; }
  .tx-row { grid-template-columns: 1fr 110px; }
  .tx-cat, .tx-acc, .tx-actions { display: none; }
}

/* ============ Telemóvel (iPhone / Android) ============ */
html { -webkit-text-size-adjust: 100%; text-size-adjust: 100%; }
.nav-more { display: none; }              /* botão «Mais» — só na barra de baixo do telemóvel */
.modal-foot:empty { display: none; }
.choice-btn.active { border-color: var(--ink); }
.more-backup { margin-top: 16px; padding-top: 14px; border-top: 1px solid var(--hairline); display: flex; flex-direction: column; gap: 9px; }
.more-backup .backup-hint { padding: 0; }
.more-backup .row { display: flex; gap: 8px; }
.more-backup .btn { flex: 1; justify-content: center; }

/* ecrãs tácteis: o que com rato só aparece ao passar por cima fica sempre visível */
@media (hover: none) {
  .tx-actions, .journal-entry-actions { opacity: 1; }
}
/* ecrãs tácteis: campos a 16px (abaixo disso o iPhone faz zoom ao escrever) e toques sem atraso */
@media (pointer: coarse) {
  input, select, textarea, .journal-input { font-size: 16px !important; }
  button, label, .tx-row, .rec-row, .choice-btn { touch-action: manipulation; -webkit-tap-highlight-color: transparent; }
}

@media (max-width: 640px) {
  /* navegação em baixo, ao alcance do polegar (as secções menos usadas ficam em «Mais») */
  .sidebar {
    position: fixed; top: auto; bottom: 0; left: 0; right: 0; z-index: 90;
    height: auto;
    padding: 0 max(6px, env(safe-area-inset-right)) env(safe-area-inset-bottom) max(6px, env(safe-area-inset-left));
    border-top: 1px solid var(--line); border-bottom: 0;
    background: rgba(255, 255, 255, 0.94);
    -webkit-backdrop-filter: saturate(180%) blur(14px);
    backdrop-filter: saturate(180%) blur(14px);
  }
  .brand { display: none; }
  .side-nav { overflow: visible; justify-content: space-around; gap: 0; }
  .nav-group { display: contents; }
  .nav-secondary { display: none !important; }
  .nav-item, .nav-more {
    display: flex; flex: 1 1 0; min-width: 0;
    flex-direction: column; align-items: center; justify-content: center;
    gap: 3px; padding: 8px 1px 7px; border-radius: 0;
    font-size: 10px; font-weight: 550; letter-spacing: -0.01em; color: var(--ink-3);
    background: transparent !important;
  }
  .nav-item span { display: block; max-width: 100%; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .nav-item svg { width: 22px; height: 22px; flex: 0 0 22px; }
  .nav-item.active { color: var(--ink); font-weight: 600; }

  .main {
    padding: 16px max(16px, env(safe-area-inset-right)) calc(88px + env(safe-area-inset-bottom)) max(16px, env(safe-area-inset-left));
  }
  .toast { bottom: calc(82px + env(safe-area-inset-bottom)); width: max-content; max-width: calc(100% - 32px); text-align: center; }

  /* cabeçalho: título por cima, ações por baixo a toda a largura */
  .header { flex-direction: column; align-items: stretch; gap: 12px; margin-bottom: 18px; }
  .header h1 { font-size: 22px; }
  .header-actions { flex-wrap: wrap; }
  .header-actions > * { flex: 1 1 auto; }
  .header-actions > .btn { justify-content: center; }
  .month-nav { justify-content: space-between; }
  .month-nav .label { min-width: 0; flex: 1; }

  /* grelhas a uma ou duas colunas (algumas trazem colunas fixas no próprio HTML) */
  .tiles { grid-template-columns: repeat(2, minmax(0, 1fr)) !important; gap: 10px; }
  .hero { grid-column: 1 / -1; }
  .charts-row { grid-template-columns: minmax(0, 1fr) !important; }
  .card { padding: 16px; }
  .donut-wrap { flex-direction: column; align-items: stretch; gap: 16px; }
  .donut-wrap svg { align-self: center; }
  .backup-card { flex-direction: column; align-items: stretch; gap: 14px; }
  .backup-card .actions { flex-wrap: wrap; }
  .backup-card .actions .btn { flex: 1 1 auto; justify-content: center; }

/* ============================================================
   Fluxo — Finanças Pessoais
   App local, sem dependências. Dados guardados no browser (IndexedDB; localStorage como reserva).
   ============================================================ */
'use strict';

const LS_KEY = 'fluxo.finance.v1';
const PALETTE = ['#2a78d6', '#1baf7a', '#eda100', '#008300', '#4a3aa7', '#e34948', '#e87ba4', '#eb6834'];
const OTHER_GRAY = '#898781';
const INV_TYPES_DEFAULT = ['Ações', 'ETF', 'Fundo', 'Cripto', 'Obrigações', 'PPR', 'Outro'];
const invTypes = () => (Array.isArray(DB.invTypes) && DB.invTypes.length) ? DB.invTypes : INV_TYPES_DEFAULT;

const EUR = new Intl.NumberFormat('pt-PT', { style: 'currency', currency: 'EUR' });

/* ---------- helpers ---------- */
const $ = (sel, el = document) => el.querySelector(sel);
const $$ = (sel, el = document) => [...el.querySelectorAll(sel)];

function uid() {
  try { return crypto.randomUUID(); }
  catch (e) { return 'id-' + Date.now().toString(36) + '-' + Math.random().toString(36).slice(2, 9); }
}
function esc(s) {
  return String(s ?? '').replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
}
function fmt(cents) { return EUR.format((cents || 0) / 100); }
function fmtSign(cents) { return (cents > 0 ? '+' : '') + EUR.format((cents || 0) / 100); }
function fmtPct(x, dec = 1) {
  if (!isFinite(x)) return '—';
  return (x > 0 ? '+' : '') + (x * 100).toFixed(dec).replace('.', ',') + ' %';
}
function parseAmount(str) {
  if (typeof str !== 'string') return null;
  let s = str.trim().replace(/[\s€]/g, '');
  if (!s) return null;
  const hasC = s.includes(','), hasD = s.includes('.');
  if (hasC && hasD) {
    if (s.lastIndexOf(',') > s.lastIndexOf('.')) s = s.replace(/\./g, '').replace(',', '.');
    else s = s.replace(/,/g, '');
  } else if (hasC) s = s.replace(',', '.');
  const v = parseFloat(s);
  if (!isFinite(v) || v < 0) return null;
  return Math.round(v * 100);
}
function parseAmountSigned(str) {
  if (typeof str !== 'string') return null;
  const s = str.trim();
  const neg = s.startsWith('-') || s.startsWith('−');
  const v = parseAmount(neg ? s.slice(1) : s);
  return v === null ? null : (neg ? -v : v);
}
function parseQty(str) {
  if (typeof str !== 'string') return null;
  const s = str.trim().replace(/\s/g, '').replace(',', '.');
  const v = parseFloat(s);
  return isFinite(v) && v >= 0 ? v : null;
}
function fmtQty(q) { return (q ?? 0).toLocaleString('pt-PT', { maximumFractionDigits: 8 }); }

/* preços de investimentos: euros em float, até 8 casas decimais */
const PRICE_FMT = new Intl.NumberFormat('pt-PT', { minimumFractionDigits: 2, maximumFractionDigits: 8 });
function fmtPrice(eur) { return PRICE_FMT.format(eur || 0) + ' €'; }
function numToInput(v) { return (v ?? 0).toLocaleString('pt-PT', { maximumFractionDigits: 8, useGrouping: false }); }
function parsePrice(str) {
  if (typeof str !== 'string') return null;
  let s = str.trim().replace(/[\s€]/g, '');
  if (!s) return null;
  const hasC = s.includes(','), hasD = s.includes('.');
  if (hasC && hasD) {
    if (s.lastIndexOf(',') > s.lastIndexOf('.')) s = s.replace(/\./g, '').replace(',', '.');
    else s = s.replace(/,/g, '');
  } else if (hasC) s = s.replace(',', '.');
  const v = parseFloat(s);
  if (!isFinite(v) || v < 0) return null;
  return Math.round(v * 1e8) / 1e8;
}

function todayISO() {
  const d = new Date();
  return `${d.getFullYear()}-${String(d.getMonth() + 1).padStart(2, '0')}-${String(d.getDate()).padStart(2, '0')}`;
}
function currentYM() { return todayISO().slice(0, 7); }
function ymAdd(ymStr, delta) {
  let [y, m] = ymStr.split('-').map(Number);
  m += delta;
  y += Math.floor((m - 1) / 12);
  m = ((m - 1) % 12 + 12) % 12 + 1;
  return `${y}-${String(m).padStart(2, '0')}`;
}
function monthLabel(ymStr) {
  const [y, m] = ymStr.split('-').map(Number);
  return new Date(y, m - 1, 1).toLocaleDateString('pt-PT', { month: 'long', year: 'numeric' });
}
function rangeMonthsLabel(lo, hi) {
  if (lo === hi) return monthLabel(lo);
  const [y1] = lo.split('-'), [y2] = hi.split('-');
  return y1 === y2
    ? `${monthShort(lo)} – ${monthShort(hi)} ${y1}`
    : `${monthShort(lo)} ${y1} – ${monthShort(hi)} ${y2}`;
}
function monthShort(ymStr) {
  const [y, m] = ymStr.split('-').map(Number);
  return new Date(y, m - 1, 1).toLocaleDateString('pt-PT', { month: 'short' }).replace('.', '');
}
function dayLabel(iso) {
  const d = new Date(iso + 'T12:00:00');
  return d.toLocaleDateString('pt-PT', { weekday: 'short', day: 'numeric', month: 'long' }).replace('.,', ',');
}
function hexA(hex, a) {
  const n = parseInt(hex.slice(1), 16);
  return `rgba(${(n >> 16) & 255}, ${(n >> 8) & 255}, ${n & 255}, ${a})`;
}
function niceCeil(v) {
  if (v <= 0) return 100;
  const p = Math.pow(10, Math.floor(Math.log10(v)));
  const n = v / p;
  const m = n <= 1 ? 1 : n <= 2 ? 2 : n <= 2.5 ? 2.5 : n <= 5 ? 5 : 10;
  return m * p;
}
function euroAxis(cents) {
  const v = cents / 100;
  if (Math.abs(v) >= 1000) return (v / 1000).toLocaleString('pt-PT', { maximumFractionDigits: 1 }) + ' mil';
  return v.toLocaleString('pt-PT', { maximumFractionDigits: 0 });
}

/* ---------- dados ---------- */
function defaultData() {
  const cat = (name, type, i) => ({ id: uid(), name, type, colorIndex: i });
  return {
    version: 1,
    app: 'fluxo-finance',
    settings: { currency: 'EUR', lastExportAt: null, budgetAlertPct: 80, emergencyMonths: 6 },
    accounts: [{ id: uid(), name: 'Conta Principal', initialBalance: 0 }],
    categories: [
      cat('Alimentação', 'despesa', 0),
      cat('Restaurantes & Cafés', 'despesa', 1),
      cat('Casa & Contas', 'despesa', 2),
      cat('Transportes', 'despesa', 3),
      cat('Saúde', 'despesa', 4),
      cat('Lazer', 'despesa', 5),
      cat('Compras', 'despesa', 6),
      cat('Subscrições', 'despesa', 7),
      cat('Viagens', 'despesa', 8),
      cat('Impostos & Taxas', 'despesa', 9),
      cat('Outras despesas', 'despesa', 10),
      cat('Salário', 'receita', 0),
      cat('Freelance & Extras', 'receita', 1),
      cat('Juros & Dividendos', 'receita', 2),
      cat('Presentes', 'receita', 3),
      cat('Reembolsos', 'receita', 4),
      cat('Outras receitas', 'receita', 5),
    ],
    transactions: [], // {id, date:'YYYY-MM-DD', type:'despesa'|'receita'|'transferencia', amount(cents), categoryId, accountId, toAccountId, description, notes, createdAt}
    budgets: [],      // {categoryId, limit(cents)}
    investments: [],  // {id, name, ticker, type, quantity, avgPriceEur, currentPriceEur, notes, updatedAt, purchases:[{id,date,amountPaid(cents),quantity,initial?}]} — quantity/avgPriceEur derivam de purchases
    goals: [],        // {id, name, target(cents), deadline('YYYY-MM'|null), contributions:[{id,date,amount(cents)}], done, createdAt}
    journal: [],      // {id, text, date:'YYYY-MM-DD', createdAt, updatedAt?} — ideias/pensamentos financeiros (vista "Ideias")
    recurrents: [],   // {id, type, amount(cents), categoryId, accountId, toAccountId, description, notes, dayOfMonth(1-31|null), freq(1|3|6|12 meses; sem valor = 1), refMonth(1-12|null), createdAt}
    invTypes: [...INV_TYPES_DEFAULT], // tipos de investimento editáveis nas Definições
  };
}

function recurrentLabel(r) {
  if (r.description) return r.description;
  if (r.type === 'transferencia') {
    return `${accById(r.accountId)?.name || '?'} → ${accById(r.toAccountId)?.name || '?'}`;
  }
  return catById(r.categoryId)?.name || 'Recorrente';
}
/* periodicidade dos recorrentes: r.freq = meses entre ocorrências (1, 3, 6 ou 12; sem valor = mensal)
   e r.refMonth = um dos meses (1-12) em que sai — define o ciclo (ex.: a cada 6 meses com março → março e setembro) */
const REC_FREQS = [[1, 'Todos os meses'], [3, 'A cada 3 meses'], [6, 'A cada 6 meses'], [12, 'Uma vez por ano']];
function recFreq(r) { const f = Number(r && r.freq); return [1, 3, 6, 12].includes(f) ? f : 1; }
function recRefMonth(r) {
  const m = Number(r && r.refMonth);
  return m >= 1 && m <= 12 ? m : (Number(String(r?.createdAt || todayISO()).slice(5, 7)) || 1);
}
// meses do ano (1-12) em que o recorrente sai
function recDueMonths(r) {
  const f = recFreq(r), ref = recRefMonth(r), out = [];
  for (let k = 0; k < 12 / f; k++) out.push(((ref - 1 + k * f) % 12) + 1);
  return out.sort((a, b) => a - b);
}
function recIsDueIn(r, ym) {
  const f = recFreq(r);
  if (f === 1) return true;
  const m = Number(ym.slice(5, 7));
  return ((m - recRefMonth(r)) % f + f) % f === 0;
}
function recNextDue(r, fromYM) {
  for (let i = 0; i < 12; i++) { const ym = ymAdd(fromYM, i); if (recIsDueIn(r, ym)) return ym; }
  return fromYM;
}
function recRegisteredIn(r, ym) { return DB.transactions.some(t => t.recurrentId === r.id && t.date.startsWith(ym)); }
// ocorrência deste mês já registada (nos não mensais conta também um pagamento antecipado no mês anterior)
function recCovered(r, ym) { return recRegisteredIn(r, ym) || (recFreq(r) > 1 && recRegisteredIn(r, ymAdd(ym, -1))); }
function recIsPending(r, ym) { return recIsDueIn(r, ym) && !recCovered(r, ym); }
function registeredThisMonth(r) { return recCovered(r, currentYM()); }
const monthName = m => new Date(2000, m - 1, 1).toLocaleDateString('pt-PT', { month: 'long' });
const monthAbbr = m => new Date(2000, m - 1, 1).toLocaleDateString('pt-PT', { month: 'short' }).replace('.', '');
function joinPt(list) { return list.length > 1 ? list.slice(0, -1).join(', ') + ' e ' + list[list.length - 1] : (list[0] || ''); }
// texto curto da periodicidade (vazio para os mensais, que é o normal)
function recFreqText(r) {
  const f = recFreq(r);
  if (f === 1) return '';
  if (f === 12) return `uma vez por ano (${monthName(recRefMonth(r))})`;
  return `a cada ${f} meses (${joinPt(recDueMonths(r).map(monthAbbr))})`;
}

function goalSaved(g) { return (g.contributions || []).reduce((s, c) => s + c.amount, 0); }
function goalsReserved() { return (DB.goals || []).filter(g => !g.done).reduce((s, g) => s + goalSaved(g), 0); }

// limiar (fração 0..1) a partir do qual um orçamento é considerado «em alerta» — editável nas Definições
function budgetAlertPct() {
  const v = Number(DB.settings.budgetAlertPct);
  return (Number.isFinite(v) && v > 0 && v <= 100) ? v / 100 : 0.8;
}
// cor da barra de um orçamento consoante a percentagem usada (usa o limiar global para o amarelo)
function meterColors(pct) {
  if (pct > 1) return { fill: '#d03b3b', track: '#f7dcdc' };
  if (pct >= budgetAlertPct()) return { fill: '#fab219', track: '#fdeed0' };
  return { fill: '#2a78d6', track: '#dbe9fb' };
}

// meta (nº de meses) do fundo de emergência — editável nas Definições
function emergencyMonthsTarget() {
  const v = Number(DB.settings.emergencyMonths);
  return (Number.isFinite(v) && v > 0 && v <= 60) ? v : 6;
}
// despesa média mensal: média dos últimos 3 meses completos; sem histórico, usa o mês atual
function avgMonthlyExpense() {
  const start = dataStartYM();
  let sum = 0, n = 0;
  for (let i = 1; i <= 3; i++) {
    const ym = ymAdd(currentYM(), -i);
    if (ym < start) break;
    sum += monthTotals(ym).exp;
    n++;
  }
  if (n > 0) return Math.round(sum / n);
  const cur = monthTotals(currentYM()).exp;
  return cur > 0 ? cur : null; // sem dados suficientes
}
// estado do fundo: saldo das contas marcadas como fundo (ou todo o dinheiro) ÷ despesa média mensal
function emergencyFundStatus() {
  const flagged = DB.accounts.filter(a => a.emergencyFund);
  const usingAllCash = flagged.length === 0;
  const accs = usingAllCash ? DB.accounts : flagged;
  const balance = Math.max(0, accs.reduce((s, a) => s + accountBalance(a), 0));
  const avg = avgMonthlyExpense();
  const months = (avg && avg > 0) ? balance / avg : null;
  return { balance, avg, months, usingAllCash, target: emergencyMonthsTarget() };
}

// migra posições antigas (preços em cêntimos inteiros) para euros float com até 8 casas,
// e cria o diário de compras onde não exista (posição atual vira o registo inicial)
function migrateInvestments(db) {
  for (const p of db.investments || []) {
    if (p.avgPriceEur == null) p.avgPriceEur = (p.avgPrice || 0) / 100;
    if (p.currentPriceEur == null) p.currentPriceEur = (p.currentPrice || 0) / 100;
    delete p.avgPrice;
    delete p.currentPrice;
    if (!Array.isArray(p.purchases)) {
      p.purchases = p.quantity > 0 ? [{
        id: uid(),
        date: (typeof p.updatedAt === 'string' && /^\d{4}-\d{2}-\d{2}/.test(p.updatedAt)) ? p.updatedAt.slice(0, 10) : todayISO(),
        amountPaid: Math.round(p.quantity * p.avgPriceEur * 100),
        quantity: p.quantity,
        initial: true,
      }] : [];
    }
    // entradas do diário sem tipo são compras (retrocompatível com dados anteriores às vendas)
    for (const c of p.purchases) if (c && !c.kind) c.kind = 'buy';
  }
  // lista de tipos: parte da predefinição e junta quaisquer tipos usados que não estejam lá
  if (!Array.isArray(db.invTypes) || !db.invTypes.length) db.invTypes = [...INV_TYPES_DEFAULT];
  for (const p of db.investments || []) {
    if (p.type && !db.invTypes.includes(p.type)) db.invTypes.push(p.type);
  }
  return db;
}

const q8 = n => Math.round(n * 1e8) / 1e8;

// Motor único da posição: reprocessa o diário por ordem cronológica e deriva
// quantidade, preço médio, custo remanescente e resultado realizado (custo médio).
// Compras: {kind:'buy', quantity, amountPaid} · Vendas: {kind:'sell', quantity, amountReceived}
function positionCalc(p) {
  const lots = (p.purchases || []).map((l, i) => ({ l, i }))
    .sort((a, b) => (a.l.date || '').localeCompare(b.l.date || '') || (a.i - b.i))
    .map(x => x.l);
  let qty = 0, cost = 0, realized = 0;   // qty em unidades; cost/realized em cêntimos
  const perSell = {};
  let inconsistent = false;
  for (const l of lots) {
    if (l.kind === 'sell') {
      const avgCents = qty > 0 ? cost / qty : 0;      // custo médio por unidade (cêntimos, fracionário)
      let sq = l.quantity;
      if (sq > qty + 1e-9) { inconsistent = true; sq = qty; }   // guarda: não vender mais do que há
      const basis = Math.round(avgCents * sq);        // custo das unidades vendidas
      const proceeds = l.amountReceived || 0;
      cost -= basis;
      qty = q8(qty - sq);
      realized += proceeds - basis;
      perSell[l.id] = { soldQty: sq, proceeds, basis, realized: proceeds - basis };
      if (qty <= 0) { qty = 0; cost = 0; }            // fecho limpo, sem resíduos de arredondamento
    } else {
      qty = q8(qty + l.quantity);
      cost += l.amountPaid || 0;
    }
  }
  const avg = qty > 0 ? cost / 100 / qty : 0;
  const scale = avg >= 1000 ? 100 : avg >= 1 ? 1e4 : 1e8; // precisão de exibição sensata
  return {
    quantity: qty,
    avgPriceEur: qty > 0 ? Math.round(avg * scale) / scale : 0,
    costRemaining: cost,      // base de custo do que ainda tens
    realized,                 // resultado realizado acumulado
    perSell,                  // por id de venda: {soldQty, proceeds, basis, realized}
    inconsistent,             // uma venda excedeu as unidades disponíveis nessa data
    hasSells: lots.some(l => l.kind === 'sell'),
  };
}

// quantidade e preço médio derivam do diário (compras e vendas)
function recalcPosition(p) {
  const c = positionCalc(p);
  p.quantity = c.quantity;
  p.avgPriceEur = c.avgPriceEur;
}
function invInvested(p) { return positionCalc(p).costRemaining; }

/* ---------- armazenamento: IndexedDB, com localStorage como reserva ----------
   Os dados vivem numa base IndexedDB «fluxo» (store «kv», chave «db»), sem o limite de ~5 MB do localStorage.
   Na primeira abertura desta versão copia-se o que estiver no localStorage, confirma-se a cópia lendo-a de volta
   e só então se apaga o original. Se o browser não tiver IndexedDB (ou não o conseguir abrir), usa-se o localStorage. */
const IDB_NAME = 'fluxo', IDB_STORE = 'kv', IDB_KEY = 'db';
const LS_MODE_KEY = 'fluxo.storage'; // 'idb' depois de migrado: os dados já não estão no localStorage
const STORE = { backend: 'ls', idb: null, writing: false, dirty: false, migrateFromLS: false, blocked: false, lastError: null };

function lsGet(key) { try { return localStorage.getItem(key); } catch (e) { return null; } }
function lsRemove(key) { try { localStorage.removeItem(key); } catch (e) { /* sem acesso */ } }

function idbOpen(timeoutMs = 4000) {
  return new Promise((resolve, reject) => {
    let idb;
    try { idb = window.indexedDB; } catch (e) { idb = null; }
    if (!idb) { reject(new Error('IndexedDB não disponível')); return; }
    let settled = false;
    const finish = (fn, v) => { if (settled) return false; settled = true; clearTimeout(timer); fn(v); return true; };
    const timer = setTimeout(() => finish(reject, new Error('IndexedDB não respondeu')), timeoutMs);
    let req;
    try { req = idb.open(IDB_NAME, 1); } catch (e) { finish(reject, e); return; }
    req.onupgradeneeded = () => { if (!req.result.objectStoreNames.contains(IDB_STORE)) req.result.createObjectStore(IDB_STORE); };
    req.onsuccess = () => { if (!finish(resolve, req.result)) req.result.close(); };
    req.onerror = () => finish(reject, req.error || new Error('erro ao abrir o IndexedDB'));
  });
}
// corre um pedido numa transação e resolve quando a transação fica gravada (complete)
function idbRun(mode, fn) {
  return new Promise((resolve, reject) => {
    let tx, req;
    try {
      tx = STORE.idb.transaction(IDB_STORE, mode);
      req = fn(tx.objectStore(IDB_STORE));
    } catch (e) { reject(e); return; }
    tx.oncomplete = () => resolve(req ? req.result : undefined);
    tx.onerror = () => reject(tx.error || (req && req.error) || new Error('erro no IndexedDB'));
    tx.onabort = () => reject(tx.error || new Error('gravação cancelada'));
  });
}

// lê os dados guardados (null = não arrancar: os dados existem mas o IndexedDB não abre agora)
async function loadData() {
  let raw = null, obj = null;
  try {
    STORE.idb = await idbOpen();
    STORE.backend = 'idb';
  } catch (e) {
    console.warn('IndexedDB indisponível — a usar o localStorage:', e);
    STORE.idb = null;
    STORE.backend = 'ls';
  }
  if (STORE.backend === 'idb') {
    try { obj = await idbRun('readonly', s => s.get(IDB_KEY)); }
    catch (e) { console.error('Erro a ler o IndexedDB:', e); STORE.blocked = true; return null; }
    if (!obj) {
      raw = lsGet(LS_KEY);              // primeira vez nesta versão: traz os dados do localStorage
      if (raw) STORE.migrateFromLS = true;
    }
  } else {
    if (lsGet(LS_MODE_KEY) === 'idb') { STORE.blocked = true; return null; } // os dados estão no IndexedDB
    raw = lsGet(LS_KEY);
  }
  if (raw) {
    try { obj = JSON.parse(raw); }
    catch (e) { console.error('Erro a ler dados locais:', e); obj = null; STORE.migrateFromLS = false; }
  }
  if (!obj || !Array.isArray(obj.transactions)) return defaultData();
  return migrateInvestments(Object.assign(defaultData(), obj));
}

let DB = defaultData(); // substituído pelos dados guardados antes de a app arrancar (ver start)
let interestSyncedOn = null; // dia do último cálculo de juros (para lançar os novos se a app ficar aberta de um dia para o outro)
function save() {
  try { syncInterest(); } catch (e) { console.error('Erro a calcular os juros das contas reforçadas:', e); }
  interestSyncedOn = todayISO();
  persist();
}
function persist() {
  if (STORE.blocked) return; // nunca gravar por cima de dados que não se conseguiram ler
  if (STORE.backend === 'idb') {
    STORE.dirty = true;
    if (!STORE.writing) flushIDB();
    return;
  }
  try { localStorage.setItem(LS_KEY, JSON.stringify(DB)); STORE.lastError = null; }
  catch (e) { reportSaveError(e); }
}
// grava o estado atual; se houver alterações entretanto, volta a gravar (fica sempre a última versão)
async function flushIDB() {
  STORE.writing = true;
  try {
    while (STORE.dirty) {
      STORE.dirty = false;
      await idbRun('readwrite', s => s.put(DB, IDB_KEY)); // o put copia o estado neste instante
      if (STORE.migrateFromLS) {
        const back = await idbRun('readonly', s => s.get(IDB_KEY));
        if (back && Array.isArray(back.transactions)) {      // cópia confirmada — só agora sai do localStorage
          lsRemove(LS_KEY);
          try { localStorage.setItem(LS_MODE_KEY, 'idb'); } catch (e) { /* sem acesso ao localStorage */ }
          STORE.migrateFromLS = false;
        }
      }
    }
    STORE.lastError = null;
  } catch (e) {
    reportSaveError(e);
  } finally {
    STORE.writing = false;
  }
}
// Definições → Backup: quanto ocupam os dados e quanto espaço o browser dá a esta app
async function fillStorageInfo() {
  const el = $('#storageInfo');
  if (!el) return;
  const fmtBytes = b => b >= 1e9 ? (b / 1e9).toLocaleString('pt-PT', { maximumFractionDigits: 1 }) + ' GB'
    : b >= 1e6 ? (b / 1e6).toLocaleString('pt-PT', { maximumFractionDigits: 1 }) + ' MB'
    : Math.max(1, Math.round(b / 1e3)) + ' KB';
  let txt = `Os teus dados ocupam ${fmtBytes(new Blob([JSON.stringify(DB)]).size)}`;
  if (STORE.backend === 'ls') txt += ' de um limite de cerca de 5 MB (localStorage)';
  else {
    try {
      const est = navigator.storage && navigator.storage.estimate ? await navigator.storage.estimate() : null;
      if (est && est.quota) txt += ` · espaço que o browser permite a esta app: ~${fmtBytes(est.quota)}`;
    } catch (e) { /* estimativa indisponível */ }
  }
  try {
    if (navigator.storage && navigator.storage.persisted && await navigator.storage.persisted()) txt += ' · protegidos contra limpeza automática';
  } catch (e) { /* sem informação */ }
  if (STORE.lastError) txt += STORE.lastError === 'quota' ? ' · ⚠ a última gravação falhou por falta de espaço' : ' · ⚠ a última gravação falhou';
  if (el.isConnected) el.textContent = txt + '.';
}
function reportSaveError(e) {
  console.error('Erro a gravar os dados:', e);
  const quota = !!e && (e.name === 'QuotaExceededError' || e.code === 22);
  STORE.lastError = quota ? 'quota' : 'write';
  toast(quota ? '⚠ Sem espaço para gravar — exporta já um backup' : '⚠ Não foi possível gravar — exporta um backup');
}
// os juros vencem à meia-noite: se o dia mudou, lança-os logo (sem atrapalhar uma janela ou um campo em uso)
function refreshIfNewDay() {
  if (interestSyncedOn === todayISO()) return;
  save();
  const tag = document.activeElement?.tagName;
  if (!$('#modalBackdrop') && tag !== 'INPUT' && tag !== 'TEXTAREA' && tag !== 'SELECT') render();
}
function scheduleMidnightRefresh() {
  const now = new Date();
  const next = new Date(now.getFullYear(), now.getMonth(), now.getDate() + 1, 0, 0, 2); // 00:00:02 de amanhã
  setTimeout(() => { refreshIfNewDay(); scheduleMidnightRefresh(); }, next - now);
}

/* ---------- estado de UI ---------- */
const UI = {
  view: 'dashboard',
  month: currentYM(),
  journalEdit: null,
  tx: { q: '', type: 'all', cat: 'all', scope: 'month', from: null, to: null, page: 1 },
  an: { type: 'month', a: currentYM(), b: ymAdd(currentYM(), -1), metric: 'exp', mode: 'compare', from: null, to: null },

/* ---------- lookups & cálculos ---------- */
const catById = id => DB.categories.find(c => c.id === id);
const accById = id => DB.accounts.find(a => a.id === id);
function catColor(cat) {
  if (!cat) return OTHER_GRAY;
  return PALETTE[(cat.colorIndex || 0) % PALETTE.length];
}
function txOfMonth(ymStr) { return DB.transactions.filter(t => t.date.startsWith(ymStr)); }
function monthTotals(ymStr) {
  let inc = 0, exp = 0;
  for (const t of txOfMonth(ymStr)) {
    if (t.type === 'receita') inc += t.amount;
    else if (t.type === 'despesa') exp += t.amount;
    // transferências não são receita nem despesa — só movem dinheiro entre contas
  }
  return { inc, exp, net: inc - exp };
}
function cashTotal() {
  let total = DB.accounts.reduce((s, a) => s + (a.initialBalance || 0), 0);
  for (const t of DB.transactions) {
    if (t.type === 'receita') total += t.amount;
    else if (t.type === 'despesa') total -= t.amount;
    else if (t.type === 'ajuste') total += t.amount; // valor com sinal
    // transferências têm efeito líquido nulo no total
  }
  return total;
}
function accountBalance(acc) {
  let b = acc.initialBalance || 0;
  for (const t of DB.transactions) {
    if (t.type === 'transferencia') {
      if (t.accountId === acc.id) b -= t.amount;
      if (t.toAccountId === acc.id) b += t.amount;
      continue;
    }
    if (t.accountId !== acc.id) continue;
    if (t.type === 'receita') b += t.amount;
    else if (t.type === 'despesa') b -= t.amount;
    else if (t.type === 'ajuste') b += t.amount; // valor com sinal
  }
  return b;
}

/* ---------- Contas reforçadas (juros automáticos) ----------
   acc.reinforced = { versions: [{ from:'YYYY-MM-DD', on:true, rate, per, freq, base, tax, dest }, { from, on:false }] }
     rate: taxa em % (ex.: 1.5), relativa a per ('ano' | 'mes' | 'dia')
     freq: pagamento 'diario' (no dia seguinte, como a Revolut) | 'mensal' (último dia do mês) | 'anual' (31/12)
     base: dias por ano na conversão da taxa (360, como a Revolut, ou 365)
     tax: retenção na fonte em % · dest: conta que recebe os juros (null = a própria, com juros sobre juros)
   Cada versão vale desde a sua data até à seguinte — mudar a taxa só conta daí para a frente.
   Os juros acumulam todos os dias sobre o saldo de fim do dia; os pagamentos são receitas geradas pela app
   (t.interestOf = id da conta reforçada), recalculadas sempre que os dados são gravados. */
const INT_PER_LABEL = { ano: 'ao ano', mes: 'ao mês', dia: 'ao dia' };
const INT_FREQ_LABEL = { diario: 'diário', mensal: 'mensal', anual: 'anual' };

function isoAddDays(iso, n) {
  const d = new Date(iso + 'T12:00:00');
  d.setDate(d.getDate() + n);
  return `${d.getFullYear()}-${String(d.getMonth() + 1).padStart(2, '0')}-${String(d.getDate()).padStart(2, '0')}`;
}
function fmtDateShort(iso) { const [y, m, d] = iso.split('-'); return `${d}/${m}/${y}`; }
function fmtRate(x) { return (Number(x) || 0).toLocaleString('pt-PT', { minimumFractionDigits: 2, maximumFractionDigits: 4 }) + '%'; }
function fmtTaxPct(x) { return (Number(x) || 0).toLocaleString('pt-PT', { maximumFractionDigits: 2 }) + '%'; }
function parsePct(str) {
  if (typeof str !== 'string') return null;
  const s = str.trim().replace(/[\s%]/g, '').replace(',', '.');
  if (!s) return null;
  const v = Number(s);
  return isFinite(v) && v >= 0 ? v : null;
}

function intVersions(acc) { return (acc && acc.reinforced && Array.isArray(acc.reinforced.versions)) ? acc.reinforced.versions : []; }
// versão ativa num dia (null se a conta não está reforçada nesse dia)
function intVersionOn(acc, iso) {
  let v = null;
  for (const x of intVersions(acc)) if (x.from <= iso) v = x;
  return v && v.on ? v : null;
}
function intLatest(acc) { const vs = intVersions(acc); return vs.length ? vs[vs.length - 1] : null; }
function intLastOn(acc) { const vs = intVersions(acc); for (let i = vs.length - 1; i >= 0; i--) if (vs[i].on) return vs[i]; return null; }
function intIsActive(acc) { const l = intLatest(acc); return !!(l && l.on); }
function intDailyRate(v) {
  const r = (Number(v.rate) || 0) / 100;
  const base = Number(v.base) === 365 ? 365 : 360;
  if (v.per === 'dia') return r;
  if (v.per === 'mes') return r * 12 / base;
  return r / base;
}
function intSummary(v) { return `${fmtRate(v.rate)} ${INT_PER_LABEL[v.per] || ''} · pagamento ${INT_FREQ_LABEL[v.freq] || ''}`; }
function sameIntCfg(a, b) {
  return Number(a.rate) === Number(b.rate) && a.per === b.per && a.freq === b.freq
    && Number(a.base) === Number(b.base) && Number(a.tax) === Number(b.tax) && (a.dest || null) === (b.dest || null);
}

// aplica um saldo/movimento ao mapa de saldos (mesma lógica de accountBalance)
function applyTxToBalances(bal, t) {
  const add = (id, v) => { if (bal.has(id)) bal.set(id, bal.get(id) + v); };
  if (t.type === 'transferencia') { add(t.accountId, -t.amount); add(t.toAccountId, t.amount); }
  else if (t.type === 'receita') add(t.accountId, t.amount);
  else if (t.type === 'despesa') add(t.accountId, -t.amount);
  else if (t.type === 'ajuste') add(t.accountId, t.amount);
}

// categoria das receitas de juros: a que os juros já usam, senão uma com «juros» no nome, senão cria-a
function interestCategoryId(prevGen) {
  const used = prevGen.map(t => t.categoryId).find(id => catById(id));
  if (used) return used;
  let c = DB.categories.find(x => x.type === 'receita' && /juros/i.test(x.name));
  if (!c) {
    c = { id: uid(), name: 'Juros & Dividendos', type: 'receita', colorIndex: DB.categories.filter(x => x.type === 'receita').length };
    DB.categories.push(c);
  }
  return c.id;
}

// Recalcula todos os juros das contas reforçadas, dia a dia, desde a primeira versão ativa até hoje.
// Regras como na Revolut: juro bruto do dia = saldo de fim do dia × taxa diária; imposto = juro × retenção;
// só se pagam cêntimos inteiros (o resto acumula) e só há pagamento quando o líquido chega a 0,01 €.
function syncInterest() {
  const prevGen = DB.transactions.filter(t => t.interestOf);
  const base = DB.transactions.filter(t => !t.interestOf);
  const accs = DB.accounts.filter(a => intVersions(a).some(v => v.on));
  const today = todayISO();
  const payments = new Map();

  if (accs.length) {
    let start = '9999-12-31';
    for (const a of accs) { const f = intVersions(a).find(v => v.on).from; if (f < start) start = f; }
    if (/^\d{4}-\d{2}-\d{2}$/.test(start) && start < today) {
      const bal = new Map(DB.accounts.map(a => [a.id, a.initialBalance || 0]));
      const byDay = new Map();
      for (const t of base) {
        if (!t.date || t.date >= today) continue;          // hoje ainda não terminou; o futuro não conta
        if (t.date < start) { applyTxToBalances(bal, t); continue; }
        if (!byDay.has(t.date)) byDay.set(t.date, []);
        byDay.get(t.date).push(t);
      }
      const states = accs.map(acc => ({ acc, accG: 0, accT: 0, vPrev: null }));
      const pay = (st, date, v) => {
        const g = Math.floor(st.accG + 1e-7), tx = Math.floor(st.accT + 1e-7);
        if (g - tx < 1) return;                             // líquido inferior a 0,01 € — continua a acumular
        st.accG -= g; st.accT -= tx;
        const dest = (v.dest && bal.has(v.dest)) ? v.dest : st.acc.id;
        bal.set(dest, bal.get(dest) + (g - tx));
        const key = `${st.acc.id}|${dest}|${date}`;
        const p = payments.get(key) || { accId: st.acc.id, dest, date, gross: 0, tax: 0, taxPct: Number(v.tax) || 0 };
        p.gross += g; p.tax += tx;
        payments.set(key, p);
      };

      for (let d = start; d <= today; d = isoAddDays(d, 1)) {
        // 1) início do dia: pagamento diário do dia anterior, ou acerto se a periodicidade/destino mudou ou a conta deixou de ser reforçada
        for (const st of states) {
          const vp = st.vPrev;
          if (!vp) continue;
          const vc = intVersionOn(st.acc, d);
          if (vp.freq === 'diario' || !vc || vc.freq !== vp.freq || (vc.dest || null) !== (vp.dest || null)) pay(st, d, vp);
        }
        if (d === today) break;
        // 2) movimentos do dia
        for (const t of byDay.get(d) || []) applyTxToBalances(bal, t);
        // 3) juros do dia sobre o saldo de fim do dia
        for (const st of states) {
          const v = intVersionOn(st.acc, d);
          st.vPrev = v;
          if (!v) continue;
          const accrued = Math.max(0, bal.get(st.acc.id)) * intDailyRate(v);
          st.accG += accrued;
          st.accT += accrued * Math.min(100, Math.max(0, Number(v.tax) || 0)) / 100;
        }
        // 4) fim do dia: pagamentos mensais (último dia do mês) e anuais (31/12)
        const lastOfMonth = isoAddDays(d, 1).slice(8) === '01';
        for (const st of states) {
          const v = st.vPrev;
          if (v && ((v.freq === 'mensal' && lastOfMonth) || (v.freq === 'anual' && d.slice(5) === '12-31'))) pay(st, d, v);
        }
      }
    }
  }

  const gen = [];
  if (payments.size) {
    const catId = interestCategoryId(prevGen);
    const prevById = new Map(prevGen.map(t => [t.id, t]));
    for (const p of payments.values()) {
      const acc = accById(p.accId);
      const id = `int-${p.accId}-${p.dest}-${p.date}`;
      gen.push({
        id, date: p.date, type: 'receita', amount: p.gross - p.tax,
        categoryId: catId, accountId: p.dest, toAccountId: null,
        description: `Juros — ${acc ? acc.name : 'conta reforçada'}`,
        notes: p.taxPct > 0 ? `Bruto ${fmt(p.gross)} · retenção ${fmt(p.tax)} (${fmtTaxPct(p.taxPct)})` : `Bruto ${fmt(p.gross)} · sem retenção`,
        interestOf: p.accId,
        createdAt: prevById.get(id)?.createdAt || `${p.date}T23:59:00.000Z`,
      });
    }
  }
  DB.transactions = base.concat(gen);
}

// estimativa para a janela de opções: com o saldo atual constante, quanto rende por pagamento e num ano
function intEstimate(balanceCents, v, toSelf) {
  const d = intDailyRate(v);
  const nf = 1 - Math.min(100, Math.max(0, Number(v.tax) || 0)) / 100;
  const n = v.freq === 'diario' ? 365 : v.freq === 'mensal' ? 12 : 1;   // pagamentos por ano
  const perGross = balanceCents * d * 365 / n;
  const year = f => toSelf ? balanceCents * (Math.pow(1 + d * 365 / n * f, n) - 1) : perGross * f * n;
  return { perNet: perGross * nf, yearNet: year(nf), yearGross: year(1) };
}

function invTotals() {
  let invested = 0, current = 0, realized = 0;
  for (const p of DB.investments) {
    const c = positionCalc(p);
    invested += c.costRemaining;
    current += Math.round(c.quantity * p.currentPriceEur * 100);
    realized += c.realized;
  }
  return { invested, current, pl: current - invested, realized };
}
function spentByCategory(ymStr) {
  const map = new Map();
  for (const t of txOfMonth(ymStr)) {
    if (t.type !== 'despesa') continue;
    map.set(t.categoryId, (map.get(t.categoryId) || 0) + t.amount);
  }
  return map;
}

/* ---------- ícones ---------- */
