    },
  });
}

// cria/atualiza/remove o lançamento de crédito ligado a uma venda (reutiliza o tipo "ajuste",
// que já credita a conta e é ignorado nas receitas/despesas)
function syncSaleDeposit(p, lot, accId, proceeds, date) {
  const idx = lot.depositTxId ? DB.transactions.findIndex(t => t.id === lot.depositTxId) : -1;
  if (accId) {
    if (idx >= 0) {
      const tx = DB.transactions[idx];
      tx.accountId = accId; tx.amount = proceeds; tx.date = date; tx.description = `Venda — ${p.name}`;
    } else {
      const tx = {
        id: uid(), type: 'ajuste', accountId: accId, amount: proceeds, date,
        description: `Venda — ${p.name}`, investmentId: p.id, saleLotId: lot.id,
        createdAt: new Date().toISOString(),
      };
      DB.transactions.push(tx);
      lot.depositTxId = tx.id;
    }
  } else if (idx >= 0) {
    DB.transactions.splice(idx, 1);
    lot.depositTxId = null;
  }
}

// cria/atualiza/remove o lançamento de débito ligado a uma compra (reutiliza "ajuste" com sinal
// negativo — debita a conta e é ignorado nas despesas/receitas, logo não afeta o fundo nem os orçamentos)
function syncBuyDebit(p, lot, accId, cost, date) {
  const idx = lot.debitTxId ? DB.transactions.findIndex(t => t.id === lot.debitTxId) : -1;
  if (accId) {
    if (idx >= 0) {
      const tx = DB.transactions[idx];
      tx.accountId = accId; tx.amount = -cost; tx.date = date; tx.description = `Compra — ${p.name}`;
    } else {
      const tx = {
        id: uid(), type: 'ajuste', accountId: accId, amount: -cost, date,
        description: `Compra — ${p.name}`, investmentId: p.id, buyLotId: lot.id,
        createdAt: new Date().toISOString(),
      };
      DB.transactions.push(tx);
      lot.debitTxId = tx.id;
    }
  } else if (idx >= 0) {
    DB.transactions.splice(idx, 1);
    lot.debitTxId = null;
  }
}

function openSellModal(p, sale = null, opts = {}) {
  const isEdit = !!sale;
  const maxSell = q8(p.quantity + (isEdit ? sale.quantity : 0)); // unidades disponíveis para esta venda
  // custo médio por unidade (cêntimos) para a pré-visualização do resultado
  let previewAvgCents = (p.avgPriceEur || 0) * 100;
  if (!previewAvgCents) {
    const buys = (p.purchases || []).filter(l => l.kind !== 'sell');
    const bq = buys.reduce((s, l) => s + l.quantity, 0), bc = buys.reduce((s, l) => s + (l.amountPaid || 0), 0);
    previewAvgCents = bq > 0 ? bc / bq : 0;
  }
  const initialAcc = isEdit
    ? (sale.depositTxId && DB.transactions.some(t => t.id === sale.depositTxId) ? DB.transactions.find(t => t.id === sale.depositTxId).accountId : '')
    : (DB.accounts[0]?.id || '');

  openModal({
    title: `${isEdit ? 'Editar venda' : 'Vender'} — ${p.name}`,
    body: `
      <div class="form-row">
        <div class="field" id="fSQty"><label>Quantidade a vender</label><input id="inSQty" inputmode="decimal" placeholder="0" value="${sale ? fmtQty(sale.quantity) : ''}" autocomplete="off"><div class="err">Quantidade inválida ou superior ao que tens.</div></div>
        <div class="field"><label>Data</label><input id="inSDate" type="date" value="${sale ? sale.date : todayISO()}"></div>
      </div>
      <div style="margin:-6px 0 12px;font-size:11.5px;color:var(--ink-3)">Disponível: <strong>${fmtQty(maxSell)}</strong> un. · <button type="button" class="linklike" id="sellAll">vender tudo</button></div>
      <div class="field" id="fSAmt"><label>Total recebido (€) <span style="font-weight:400;color:var(--ink-3)">(líquido de comissões)</span></label><input id="inSAmt" inputmode="decimal" placeholder="0,00" value="${sale ? (sale.amountReceived / 100).toFixed(2).replace('.', ',') : ''}" autocomplete="off"><div class="err">Indica um valor maior que zero.</div></div>
      <div class="field"><label>Depositar em</label><select id="inSAcc">
        ${DB.accounts.map(a => `<option value="${a.id}"${initialAcc === a.id ? ' selected' : ''}>${esc(a.name)}</option>`).join('')}
        <option value=""${initialAcc === '' ? ' selected' : ''}>Não depositar (fica só na carteira)</option>
      </select></div>
      ${!isEdit ? `<div class="field" id="fSCur"><label>Preço atual agora <span style="font-weight:400;color:var(--ink-3)">(opcional — atualiza o preço de mercado)</span></label><input id="inSCur" inputmode="decimal" placeholder="${numToInput(p.currentPriceEur)}" autocomplete="off"><div class="err">Preço inválido.</div></div>` : ''}
      <div class="sell-preview" id="sellPreview"></div>
    `,
    footHtml: `<button class="btn" data-cancel>Cancelar</button><button class="btn btn-primary" data-save>${isEdit ? 'Guardar' : 'Registar venda'}</button>`,
    onMount(bd) {
      const back = () => { if (opts.fromHistory) openInvHistoryModal(p, opts.page || 1); };
      $('[data-cancel]', bd).addEventListener('click', () => { closeModal(); back(); });
      const qtyIn = $('#inSQty', bd), amtIn = $('#inSAmt', bd), prev = $('#sellPreview', bd);
      const updatePreview = () => {
        const qty = parseQty(qtyIn.value);
        const amt = parseAmount(amtIn.value);
        if (qty === null || qty <= 0) { prev.innerHTML = ''; return; }
        const implied = amt ? `preço de venda ${fmtPrice(Math.round(amt / qty) / 100)}` : '';
        let realizedTxt = '';
        if (amt && previewAvgCents) {
          const r = amt - Math.round(previewAvgCents * qty);
          realizedTxt = `<span class="${r > 0 ? 'pl-pos' : r < 0 ? 'pl-neg' : ''}">${r >= 0 ? 'mais' : 'menos'}-valia estimada ${fmtSign(r)}</span>`;
        }
        prev.innerHTML = [implied, realizedTxt].filter(Boolean).join(' · ');
      };
      qtyIn.addEventListener('input', updatePreview);
      amtIn.addEventListener('input', updatePreview);
      $('#sellAll', bd).addEventListener('click', () => { qtyIn.value = fmtQty(maxSell); updatePreview(); amtIn.focus(); });
      updatePreview();

      const saveFn = () => {
        const qty = parseQty(qtyIn.value);
        const amt = parseAmount(amtIn.value);
        const badQty = qty === null || qty <= 0 || qty > maxSell + 1e-9;
        $('#fSQty', bd).classList.toggle('invalid', badQty);
        $('#fSAmt', bd).classList.toggle('invalid', !amt);
        let curPrice = null;
        if (!isEdit) {
          const raw = $('#inSCur', bd).value.trim();
          if (raw) { curPrice = parsePrice(raw); $('#fSCur', bd).classList.toggle('invalid', curPrice === null); if (curPrice === null) return; }
        }
        if (badQty || !amt) return;
        const date = $('#inSDate', bd).value || todayISO();
        const accId = $('#inSAcc', bd).value;
        let lot;
        if (isEdit) {
          lot = sale;
          lot.date = date; lot.quantity = qty; lot.amountReceived = amt;
        } else {
          lot = { id: uid(), date, kind: 'sell', quantity: qty, amountReceived: amt, createdAt: new Date().toISOString() };
          p.purchases.push(lot);
        }
        syncSaleDeposit(p, lot, accId, amt, date);
        recalcPosition(p);
        if (curPrice !== null) p.currentPriceEur = curPrice;
        p.updatedAt = new Date().toISOString();
        const realized = positionCalc(p).perSell[lot.id]?.realized ?? 0;
        save(); closeModal(); render();
        toast(`${isEdit ? 'Venda atualizada' : 'Venda registada'} — ${realized >= 0 ? 'mais' : 'menos'}-valia ${fmtSign(realized)}`);
        back();
      };
      $('[data-save]', bd).addEventListener('click', saveFn);
      bd.addEventListener('keydown', e => { if (e.key === 'Enter' && e.target.tagName !== 'SELECT') { e.preventDefault(); saveFn(); } });
    },
  });
}

function openInvHistoryModal(p, page = 1) {
  const PER_PAGE = 15;
  const calc = positionCalc(p);
  const list = [...p.purchases].sort((a, b) => b.date.localeCompare(a.date)); // mais recentes primeiro
  const pageCount = Math.max(1, Math.ceil(list.length / PER_PAGE));
  page = Math.min(Math.max(1, page), pageCount);
  const pageList = list.slice((page - 1) * PER_PAGE, page * PER_PAGE);
  openModal({
    title: `Histórico — ${p.name}`,
    wide: true,
    body: list.length ? `
      ${pageList.map(c => {
        const isSell = c.kind === 'sell';
        const amount = isSell ? (c.amountReceived || 0) : (c.amountPaid || 0);
        const implied = fmtPrice(c.quantity > 0 ? Math.round(amount / c.quantity) / 100 : 0);
        const rz = isSell ? (calc.perSell[c.id]?.realized ?? 0) : null;
        return `
        <div class="rec-row" style="cursor:default">
          <div class="rec-main">
            <div class="r1"><span class="badge ${isSell ? 'badge-sell' : 'badge-buy'}" style="margin-right:10px">${isSell ? 'Venda' : 'Compra'}</span>${esc(dayLabel(c.date).replace(/^./, ch => ch.toUpperCase()))}${c.initial ? ' <span class="badge" style="margin-left:5px">posição inicial</span>' : ''}</div>
            <div class="r2">${fmtQty(c.quantity)} un. · preço ${implied}${isSell ? ` · <span class="${rz > 0 ? 'pl-pos' : rz < 0 ? 'pl-neg' : ''}">${rz >= 0 ? 'mais' : 'menos'}-valia ${fmtSign(rz)}</span>` : ''}</div>
          </div>
          <span class="rec-val">${isSell ? '+' : ''}${fmt(amount)}</span>
          <span style="white-space:nowrap">
            <button class="btn-icon" data-edit-lot="${c.id}" title="Editar">${I.edit}</button>
            <button class="btn-icon danger" data-del-lot="${c.id}" title="Apagar">${I.trash}</button>
          </span>
        </div>`;
      }).join('')}
      ${pageCount > 1 ? `
      <div class="hist-pager">
        <button class="btn" data-pg-prev ${page === 1 ? 'disabled' : ''}>${I.left}</button>
        <span>Página ${page} de ${pageCount} · ${list.length} registos</span>
        <button class="btn" data-pg-next ${page === pageCount ? 'disabled' : ''}>${I.right}</button>
      </div>` : ''}
      <div class="reserved-row total">
        <span class="nm">Em carteira — ${fmtQty(calc.quantity)} un.${calc.quantity > 0 ? ` · preço médio ${fmtPrice(calc.avgPriceEur)}` : ''}</span>
        <span class="val">${fmt(calc.costRemaining)}</span>
      </div>
      ${calc.hasSells ? `<div class="reserved-row"><span class="nm">Resultado realizado</span><span class="val ${calc.realized > 0 ? 'pl-pos' : calc.realized < 0 ? 'pl-neg' : ''}">${fmtSign(calc.realized)}</span></div>
      <div style="margin-top:8px;font-size:11px;color:var(--ink-3)">O resultado realizado é recalculado se editares compras ou vendas anteriores.</div>` : ''}
      ${calc.inconsistent ? `<div style="margin-top:8px;font-size:11.5px;color:var(--crit)">⚠ Uma venda excedeu as unidades disponíveis nessa data — revê as datas/quantidades.</div>` : ''}
      ${p.notes ? `<div class="inv-hist-notes"><span class="lbl">Notas</span>${esc(p.notes)}</div>` : ''}`
      : `<div class="empty" style="padding:22px 10px"><h3>Sem registos</h3><p>Regista a primeira compra desta posição.</p></div>`,
    footHtml: `<button class="btn" data-new-buy style="margin-right:auto">${I.plus}<span>Registar compra</span></button>
               ${calc.quantity > 0 ? `<button class="btn" data-new-sell>${I.sell}<span>Registar venda</span></button>` : ''}
               <button class="btn btn-primary" data-close-ok>Fechar</button>`,
    onMount(bd) {
      $('[data-close-ok]', bd).addEventListener('click', closeModal);
      $('[data-new-buy]', bd).addEventListener('click', () => { closeModal(); openBuyModal(p, null, { fromHistory: true, page }); });
      const nSell = $('[data-new-sell]', bd);
      if (nSell) nSell.addEventListener('click', () => { closeModal(); openSellModal(p, null, { fromHistory: true, page }); });
      const pgPrev = $('[data-pg-prev]', bd);
      if (pgPrev) pgPrev.addEventListener('click', () => openInvHistoryModal(p, page - 1));
      const pgNext = $('[data-pg-next]', bd);
      if (pgNext) pgNext.addEventListener('click', () => openInvHistoryModal(p, page + 1));
      $$('[data-edit-lot]', bd).forEach(b => b.addEventListener('click', () => {
        const c = p.purchases.find(x => x.id === b.dataset.editLot);
        closeModal();
        if (c.kind === 'sell') openSellModal(p, c, { fromHistory: true, page });
        else openBuyModal(p, c, { fromHistory: true, page });
      }));
      $$('[data-del-lot]', bd).forEach(b => b.addEventListener('click', () => {
        const c = p.purchases.find(x => x.id === b.dataset.delLot);
        const isSell = c.kind === 'sell';
        const amount = isSell ? (c.amountReceived || 0) : (c.amountPaid || 0);
        confirmModal({
          title: isSell ? 'Apagar venda?' : 'Apagar compra?',
          message: isSell
            ? `Venda de ${fmtQty(c.quantity)} un. por ${fmt(amount)} em ${esc(c.date)}.${c.depositTxId ? ' O depósito associado na conta também será removido.' : ''} A posição será recalculada.`
            : `Compra de ${fmt(amount)} (${fmtQty(c.quantity)} un.) em ${esc(c.date)}.${c.debitTxId ? ' O débito associado na conta também será removido.' : ''} A quantidade e o preço médio da posição serão recalculados.`,
          confirmLabel: 'Apagar', danger: true,
          onConfirm() {
            const linkId = c.depositTxId || c.debitTxId;
            if (linkId) DB.transactions = DB.transactions.filter(t => t.id !== linkId);
            p.purchases = p.purchases.filter(x => x.id !== c.id);
            recalcPosition(p);
            p.updatedAt = new Date().toISOString();
            save(); render();
            toast(isSell ? 'Venda apagada — posição recalculada' : 'Compra apagada — posição recalculada');
            openInvHistoryModal(p, page);
          },
          onCancel: () => openInvHistoryModal(p, page),
        });
      }));
    },
  });
}

function openPricesModal() {
  if (!DB.investments.length) { toast('Ainda não tens posições'); return; }
  openModal({
    title: 'Atualizar preços',
    wide: true,
    body: DB.investments.map(p => `
      <div class="form-row" style="align-items:center;grid-template-columns:1.4fr 1fr">
        <div style="font-size:13px"><strong>${esc(p.name)}</strong>${p.ticker ? ` <span style="color:var(--ink-3)">· ${esc(p.ticker)}</span>` : ''}<br><small style="color:var(--ink-3)">atual: ${fmtPrice(p.currentPriceEur)}</small></div>

}

/* ---------- Análise ---------- */
const AN_TYPES = [['month', 'Mês'], ['quarter', 'Trimestre'], ['semester', 'Semestre'], ['year', 'Ano']];

function periodMonths(type, key) {
  if (type === 'month') return [key];
  if (type === 'year') return Array.from({ length: 12 }, (_, i) => `${key}-${String(i + 1).padStart(2, '0')}`);
  const [y, pk] = key.split('-');
  const n = +pk.slice(1);
  if (pk[0] === 'Q') {
    const start = (n - 1) * 3 + 1;
    return [0, 1, 2].map(i => `${y}-${String(start + i).padStart(2, '0')}`);
  }
  const start = n === 1 ? 1 : 7;
  return [0, 1, 2, 3, 4, 5].map(i => `${y}-${String(start + i).padStart(2, '0')}`);
}
function periodLabel(type, key) {
  if (type === 'month') return monthLabel(key);
  if (type === 'year') return key;
  const [y, pk] = key.split('-');
  return `${pk[0] === 'Q' ? 'T' + pk.slice(1) : pk} ${y}`;
}
// primeiro mês com qualquer registo (movimento ou compra de investimento); sem registos → mês atual
function dataStartYM() {
  let min = null;
  const touch = d => {
    const ym = String(d).slice(0, 7);
    if (/^\d{4}-\d{2}$/.test(ym) && (!min || ym < min)) min = ym;
  };
  for (const t of DB.transactions) touch(t.date);
  for (const p of DB.investments) for (const c of (p.purchases || [])) touch(c.date);
  return min || currentYM();
}
// janela de análise: do primeiro registo até hoje — nada antes, nada no futuro
function yearOptions() {
  const start = +dataStartYM().slice(0, 4);
  const cur = new Date().getFullYear();
  const list = [];
  for (let y = Math.max(cur, start); y >= Math.min(cur, start); y--) list.push(String(y));
  return list;
}
function subPeriodOptions(type, year) {
  const startYM = dataStartYM();
  const now = new Date();
  const lo = +year === +startYM.slice(0, 4) ? +startYM.slice(5, 7) : 1;  // 1º ano de dados começa no 1º registo
  const hi = +year === now.getFullYear() ? now.getMonth() + 1 : 12;      // ano corrente acaba no mês atual
  if (type === 'month') {
    const list = [];
    for (let m = lo; m <= hi; m++) {
      list.push({ val: String(m).padStart(2, '0'), label: new Date(2000, m - 1, 1).toLocaleDateString('pt-PT', { month: 'long' }) });
    }
    return list;
  }
  if (type === 'quarter') {
    const loQ = Math.ceil(lo / 3), hiQ = Math.ceil(hi / 3);
    const spans = ['jan–mar', 'abr–jun', 'jul–set', 'out–dez'];
    return [1, 2, 3, 4].filter(q => q >= loQ && q <= hiQ).map(q => ({ val: 'Q' + q, label: `T${q} · ${spans[q - 1]}` }));
  }
  const loS = lo <= 6 ? 1 : 2, hiS = hi <= 6 ? 1 : 2;
  return [1, 2].filter(s => s >= loS && s <= hiS).map(s => ({ val: 'S' + s, label: `S${s} · ${s === 1 ? 'jan–jun' : 'jul–dez'}` }));
}
function defaultPeriodsFor(type) {
  const now = new Date();
  const y = now.getFullYear(), m = now.getMonth() + 1;
  if (type === 'month') return { a: currentYM(), b: ymAdd(currentYM(), -1) };
  if (type === 'year') return { a: String(y), b: String(y - 1) };
  if (type === 'quarter') {
    const q = Math.ceil(m / 3);
    return { a: `${y}-Q${q}`, b: q === 1 ? `${y - 1}-Q4` : `${y}-Q${q - 1}` };
  }
  const s = m <= 6 ? 1 : 2;
  return { a: `${y}-S${s}`, b: s === 1 ? `${y - 1}-S2` : `${y}-S1` };
}
function periodTotals(months) {
  const set = new Set(months);
  const r = {
    inc: 0, exp: 0, invested: 0,
    byCatExp: new Map(), byCatInc: new Map(),
    incByM: months.map(() => 0), expByM: months.map(() => 0),
  };
  for (const t of DB.transactions) {
    const ym = t.date.slice(0, 7);
    if (!set.has(ym)) continue;
    const i = months.indexOf(ym);
    if (t.type === 'receita') {
      r.inc += t.amount; r.incByM[i] += t.amount;
      r.byCatInc.set(t.categoryId, (r.byCatInc.get(t.categoryId) || 0) + t.amount);
    } else if (t.type === 'despesa') {
      r.exp += t.amount; r.expByM[i] += t.amount;
      r.byCatExp.set(t.categoryId, (r.byCatExp.get(t.categoryId) || 0) + t.amount);
    }
  }
  for (const p of DB.investments) {
    for (const c of (p.purchases || [])) {
      if (set.has(c.date.slice(0, 7))) r.invested += c.amountPaid;
    }
  }
  r.net = r.inc - r.exp;
  r.activeMonths = months.reduce((s, _, i) => s + ((r.incByM[i] || r.expByM[i]) ? 1 : 0), 0);
  return r;
}
function deltaPill(a, b, dir) { // dir: 'up' = subir é bom · 'down' = descer é bom · 'neu' = neutro
  const d = a - b;
  if (d === 0) return `<span class="delta-pill neu">= igual</span>`;
  const cls = dir === 'neu' ? 'neu' : ((d > 0) === (dir === 'up') ? 'good' : 'bad');
  const pct = b > 0 ? ` · ${fmtPct(d / b)}` : '';
  return `<span class="delta-pill ${cls}">${d > 0 ? '▲' : '▼'} ${fmtSign(d)}${pct}</span>`;
}

function keyFromFirstMonth(type, ym) {
  const [y, m] = ym.split('-');
  if (type === 'year') return y;
  if (type === 'month') return ym;
  const mm = +m;
  return type === 'quarter' ? `${y}-Q${Math.ceil(mm / 3)}` : `${y}-S${mm <= 6 ? 1 : 2}`;
}
function shortPeriodLabel(type, k) {
  if (type === 'year') return k;
  const [y, s] = k.split('-');
  if (type === 'month') return monthShort(k) + ' ' + y.slice(2);
  return (s[0] === 'Q' ? 'T' + s.slice(1) : s) + ' ' + y.slice(2);
}

function renderAnalysisRange(v, sideSelects) {
  const an = UI.an;
  const span = { month: 1, quarter: 3, semester: 6, year: 12 }[an.type];
  const keys = [];
  let cur = periodMonths(an.type, an.from)[0];
  const end = periodMonths(an.type, an.to)[0];
  while (cur <= end && keys.length < 60) {
    keys.push(keyFromFirstMonth(an.type, cur));
    cur = ymAdd(cur, span);
  }
  const perMonths = keys.map(k => periodMonths(an.type, k));
  const allMonths = perMonths.flat();
  const T = periodTotals(allMonths);
  const nowYM = currentYM();
  const elapsed = Math.max(1, allMonths.filter(m => m <= nowYM).length);
  const single = keys.length === 1;
  const rangeLab = single ? periodLabel(an.type, keys[0]) : `${periodLabel(an.type, an.from)} — ${periodLabel(an.type, an.to)}`;
  const typeName = { month: 'meses', quarter: 'trimestres', semester: 'semestres', year: 'anos' }[an.type];
  const savingsRate = T.inc > 0 ? T.net / T.inc : NaN;
  const avg = val => fmt(Math.round(val / elapsed)) + '/mês';

  let cols = [];
  if (!single) {
    cols = keys.map((k, i) => {
      const t = periodTotals(perMonths[i]);
      return { label: shortPeriodLabel(an.type, k), inc: t.inc, exp: t.exp, tip: periodLabel(an.type, k) };
    });
  } else if (allMonths.length > 1) {
    cols = allMonths.map(ym => {
      const t = periodTotals([ym]);
      return { label: monthShort(ym), inc: t.inc, exp: t.exp, tip: monthLabel(ym) };

  const gridCols = 'grid-template-columns:1fr 120px 120px 90px';
  const catTable = (map, catType, totalAll) => {
    const rows = [];
    for (const [id, val] of map) {

      if (cat && cat.type !== catType) continue;
      if (val > 0) rows.push({ cat, val });
    }
    if (!rows.length) return null;
    rows.sort((x, y) => y.val - x.val);
    return `
      <div class="cmp-head" style="${gridCols}"><span></span><span class="num">Total</span><span class="num">Média</span><span class="num">Peso</span></div>

        <div class="cmp-row" style="${gridCols}">
          <span class="c-name"><span class="c-dot" style="background:${catColor(r.cat)}"></span>${esc(r.cat ? r.cat.name : 'Sem categoria')}</span>
          <span class="num">${fmt(r.val)}</span>
          <span class="num" style="color:var(--ink-3)">${elapsed > 1 ? avg(r.val) : '—'}</span>
          <span class="num" style="color:var(--ink-3)">${totalAll > 0 ? (r.val / totalAll * 100).toFixed(1).replace('.', ',') + ' %' : ''}</span>
        </div>`).join('')}
      <div class="cmp-row total" style="${gridCols}">

        <span class="num">${fmt(totalAll)}</span>
        <span class="num">${elapsed > 1 ? avg(totalAll) : '—'}</span>
        <span class="num">100 %</span>
      </div>`;

  const expTable = catTable(T.byCatExp, 'despesa', T.exp);
  const incTable = catTable(T.byCatInc, 'receita', T.inc);

  v.innerHTML = `
    ${analysisControlsHTML(sideSelects)}
    ${!single ? `<div class="card-note" style="margin:-6px 0 12px;text-transform:capitalize">${esc(rangeLab)} · ${keys.length} ${typeName}${an.type !== 'month' ? ` · ${allMonths.length} meses` : ''}</div>` : ''}

    <div class="tiles" style="grid-template-columns:repeat(4,1fr)">
      <div class="tile">
        <div class="t-label">Receitas</div>
        <div class="t-value" style="color:var(--good-text)">${fmt(T.inc)}</div>
        <div class="t-delta">${elapsed > 1 ? 'média ' + avg(T.inc) : esc(rangeLab)}</div>
      </div>
      <div class="tile">
        <div class="t-label">Despesas</div>
        <div class="t-value">${fmt(T.exp)}</div>
        <div class="t-delta">${elapsed > 1 ? 'média ' + avg(T.exp) : esc(rangeLab)}</div>
      </div>
      <div class="tile">
        <div class="t-label">Poupança</div>
        <div class="t-value">${fmt(T.net)}</div>
        <div class="t-delta">${isFinite(savingsRate) ? 'taxa ' + (savingsRate * 100).toFixed(0) + ' %' : '—'}${elapsed > 1 ? ' · média ' + avg(T.net) : ''}</div>
      </div>

        <div class="t-label">Aportes em investimentos</div>
        <div class="t-value">${fmt(T.invested)}</div>

  bindAnalysisControls(v);

function catCompareRows(mapA, mapB, catType) {
  const ids = new Set([...mapA.keys(), ...mapB.keys()]);
  const rows = [];
  for (const id of ids) {
    const cat = catById(id);
    if (cat && cat.type !== catType) continue;
    const a = mapA.get(id) || 0, b = mapB.get(id) || 0;
    if (a === 0 && b === 0) continue;
    rows.push({ cat, a, b });
  }
  rows.sort((x, y) => y.a - x.a || y.b - x.b);
  return rows;
}

function renderAnalysis(v) {
  const an = UI.an;
  const hasData = DB.transactions.length > 0 || DB.investments.some(p => (p.purchases || []).length);
  if (!hasData) {
    v.innerHTML = `<div class="card"><div class="empty">
      <div class="e-icon">${I.inv}</div>
      <h3>Ainda não há dados para analisar</h3>
      <p>Regista movimentos durante algum tempo e volta aqui para comparar meses, trimestres e anos.</p>
    </div></div>`;
    return;
  }

  const yearOpts = yearOptions();
  const splitKey = key => an.type === 'year' ? { y: key, sub: null } : { y: key.split('-')[0], sub: key.split('-')[1] };
  const fixKey = key => {
    let { y, sub } = splitKey(key);
    if (!yearOpts.includes(y)) {
      // yearOpts está por ordem decrescente: [0] = mais recente, [len-1] = mais antigo
      y = +y < +yearOpts[yearOpts.length - 1] ? yearOpts[yearOpts.length - 1] : yearOpts[0];
    }
    if (an.type !== 'year') {
      const ss = subPeriodOptions(an.type, y);
      if (!ss.some(o => o.val === sub)) {
        sub = (sub && sub < ss[0].val) ? ss[0].val : ss[ss.length - 1].val; // aproxima ao limite mais próximo
      }
      return `${y}-${sub}`;
    }
    return y;
  };
  an.a = fixKey(an.a);
  an.b = fixKey(an.b);
  const mA = periodMonths(an.type, an.a), mB = periodMonths(an.type, an.b);
  const A = periodTotals(mA), B = periodTotals(mB);
  const labA = periodLabel(an.type, an.a), labB = periodLabel(an.type, an.b);

  const sideSelects = side => {
    const { y, sub } = splitKey(an[side]);
    let html = `<select class="input" data-side="${side}" data-part="year" title="Ano">${yearOpts.map(k => `<option value="${k}"${k === y ? ' selected' : ''}>${k}</option>`).join('')}</select>`;
    if (an.type !== 'year') {
      html += `<select class="input" data-side="${side}" data-part="sub" title="Período">${subPeriodOptions(an.type, y).map(o => `<option value="${o.val}"${o.val === sub ? ' selected' : ''}>${esc(o.label)}</option>`).join('')}</select>`;
    }
    return `<div class="an-side">${html}</div>`;
  };

  // modo intervalo: valida De/Até e delega
  if (!an.from || !an.to) { const d = defaultPeriodsFor(an.type); an.from = d.b; an.to = d.a; }
  an.from = fixKey(an.from);
  an.to = fixKey(an.to);
  if (periodMonths(an.type, an.from)[0] > periodMonths(an.type, an.to)[0]) [an.from, an.to] = [an.to, an.from];
  if (an.mode === 'range') { renderAnalysisRange(v, sideSelects); return; }

  // gráfico mês a mês (períodos com mais de um mês)
  const METRICS = [['exp', 'Despesas'], ['inc', 'Receitas'], ['net', 'Poupança']];
  const metricVal = (T, i) => an.metric === 'exp' ? T.expByM[i] : an.metric === 'inc' ? T.incByM[i] : Math.max(T.incByM[i] - T.expByM[i], 0);
  const cols = mA.map((ym, i) => ({
    label: an.type === 'year' ? monthShort(ym) : monthShort(ym) + ' ' + ym.slice(2, 4),
    a: metricVal(A, i),
    b: metricVal(B, i),
    tipA: monthLabel(ym),
    tipB: mB[i] ? monthLabel(mB[i]) : '—',
  }));

  const expRows = catCompareRows(A.byCatExp, B.byCatExp, 'despesa');
  const incRows = catCompareRows(A.byCatInc, B.byCatInc, 'receita');

  const cmpTable = (rows, totalA, totalB, dir) => `
    <div class="cmp-head"><span></span><span class="num">${esc(labA)}</span><span class="num">${esc(labB)}</span><span class="num">Diferença</span></div>
    ${rows.map(r => `
      <div class="cmp-row">
        <span class="c-name"><span class="c-dot" style="background:${catColor(r.cat)}"></span>${esc(r.cat ? r.cat.name : 'Sem categoria')}</span>
        <span class="num">${fmt(r.a)}</span>
        <span class="num" style="color:var(--ink-3)">${fmt(r.b)}</span>
        <span class="num">${deltaPill(r.a, r.b, dir)}</span>
      </div>`).join('')}
    <div class="cmp-row total">
      <span>Total</span>
      <span class="num">${fmt(totalA)}</span>
      <span class="num" style="color:var(--ink-3)">${fmt(totalB)}</span>
      <span class="num">${deltaPill(totalA, totalB, dir)}</span>
    </div>`;

  // oportunidades de poupança
  const both = expRows.filter(r => r.a > 0 && r.b > 0);
  const up = both.filter(r => r.a > r.b).sort((x, y) => (y.a - y.b) - (x.a - x.b))[0];
  const down = both.filter(r => r.a < r.b).sort((x, y) => (x.a - x.b) - (y.a - y.b))[0];
  const insights = (up || down) ? `
    <div style="margin-top:12px">
      ${up ? `<div class="insight">📈 Maior subida: <strong>${esc(up.cat ? up.cat.name : 'Sem categoria')}</strong> gastou mais ${fmt(up.a - up.b)} do que em ${esc(labB)} — é aqui que mora a oportunidade de poupança.</div>` : ''}
      ${down ? `<div class="insight">📉 Maior descida: <strong>${esc(down.cat ? down.cat.name : 'Sem categoria')}</strong> poupou ${fmt(down.b - down.a)} face a ${esc(labB)}.</div>` : ''}
    </div>` : '';

  const savingsRateA = A.inc > 0 ? A.net / A.inc : NaN;
  const savingsRateB = B.inc > 0 ? B.net / B.inc : NaN;

  v.innerHTML = `
    ${analysisControlsHTML(sideSelects)}

    <div class="tiles" style="grid-template-columns:repeat(4,1fr)">
      <div class="tile">
        <div class="t-label">Receitas</div>
        <div class="t-value" style="color:var(--good-text)">${fmt(A.inc)}</div>
        <div class="t-delta">${esc(labB)}: ${fmt(B.inc)}</div>
        <div style="margin-top:6px">${deltaPill(A.inc, B.inc, 'up')}</div>
      </div>
      <div class="tile">
        <div class="t-label">Despesas</div>
        <div class="t-value">${fmt(A.exp)}</div>
        <div class="t-delta">${esc(labB)}: ${fmt(B.exp)}</div>
        <div style="margin-top:6px">${deltaPill(A.exp, B.exp, 'down')}</div>
      </div>
      <div class="tile">
        <div class="t-label">Poupança</div>
        <div class="t-value">${fmt(A.net)}</div>
        <div class="t-delta">${isFinite(savingsRateA) ? 'taxa ' + (savingsRateA * 100).toFixed(0) + ' %' : '—'}${isFinite(savingsRateB) ? ' · antes ' + (savingsRateB * 100).toFixed(0) + ' %' : ''}</div>
        <div style="margin-top:6px">${deltaPill(A.net, B.net, 'up')}</div>
      </div>
      <div class="tile">
        <div class="t-label">Aportes em investimentos</div>
        <div class="t-value">${fmt(A.invested)}</div>
        <div class="t-delta">${esc(labB)}: ${fmt(B.invested)}</div>
        <div style="margin-top:6px">${deltaPill(A.invested, B.invested, 'neu')}</div>
      </div>
    </div>

    ${mA.length > 1 && A.activeMonths > 0 && B.activeMonths > 0 && A.activeMonths !== B.activeMonths ? `
    <div class="an-note">⚠ Comparação parcial: ${esc(labA)} tem movimentos em ${A.activeMonths} ${A.activeMonths === 1 ? 'mês' : 'meses'} e ${esc(labB)} em ${B.activeMonths} — os totais não são diretamente comparáveis. O gráfico mês a mês conta a história justa.</div>` : ''}

    ${mA.length > 1 ? `
    <div class="card" style="margin-bottom:18px">
      <div class="card-head">
        <span class="card-title">Mês a mês</span>
        <div style="display:flex;align-items:center;gap:14px">
          <div class="seg mini" id="anMetric" style="margin:0">
            ${METRICS.map(([k, lab]) => `<button type="button" data-m="${k}"${k === an.metric ? ' class="active"' : ''}>${lab}</button>`).join('')}
          </div>
          <div class="legend">
            <span class="key"><span class="dot" style="background:#2a78d6"></span>${esc(labA)}</span>
            <span class="key"><span class="dot" style="background:#898781"></span>${esc(labB)}</span>
          </div>
        </div>
      </div>
      ${compareChartHTML(cols, labA, labB)}
    </div>` : ''}

    <div class="card" style="margin-bottom:18px">
      <div class="card-head"><span class="card-title">Despesas por categoria</span><span class="card-note">${esc(labA)} vs ${esc(labB)}</span></div>
      ${expRows.length ? cmpTable(expRows, A.exp, B.exp, 'down') + insights : `<div class="empty" style="padding:22px 10px"><h3>Sem despesas nestes períodos</h3><p>Escolhe outros períodos em cima.</p></div>`}
    </div>

    <div class="card">
      <div class="card-head"><span class="card-title">Receitas por categoria</span><span class="card-note">${esc(labA)} vs ${esc(labB)}</span></div>
      ${incRows.length ? cmpTable(incRows, A.inc, B.inc, 'up') : `<div class="empty" style="padding:22px 10px"><h3>Sem receitas nestes períodos</h3><p>Escolhe outros períodos em cima.</p></div>`}
    </div>
  `;

  bindAnalysisControls(v);
  const met = $('#anMetric', v);
  if (met) $$('button', met).forEach(b => b.addEventListener('click', () => { an.metric = b.dataset.m; render(); }));
  bindCmpTooltip(cols, labA, labB);
}

/* ---------- Ideias ---------- */
function isoOf(d) {
  return `${d.getFullYear()}-${String(d.getMonth() + 1).padStart(2, '0')}-${String(d.getDate()).padStart(2, '0')}`;
}
function journalDay(e) { return e.date || (e.createdAt || '').slice(0, 10); }

function journalDayLabel(dateStr) {
  const today = todayISO();
  const yest = new Date(); yest.setDate(yest.getDate() - 1);
  if (dateStr === today) return 'Hoje';
  if (dateStr === isoOf(yest)) return 'Ontem';
  const d = new Date(dateStr + 'T00:00:00');
  const opts = { weekday: 'long', day: 'numeric', month: 'long' };
  if (d.getFullYear() !== new Date().getFullYear()) opts.year = 'numeric';
  return d.toLocaleDateString('pt-PT', opts);
}

function autoGrow(el) { el.style.height = 'auto'; el.style.height = Math.min(el.scrollHeight, 260) + 'px'; }

function journalEntryHTML(e) {
  if (UI.journalEdit === e.id) {
    return `
    <div class="journal-entry editing" data-id="${e.id}">
      <textarea class="journal-input journal-edit-input" rows="2">${esc(e.text)}</textarea>
      <div class="journal-composer-foot">
        <span class="journal-hint">Enter guarda · Esc cancela</span>
        <span class="journal-edit-btns">
          <button class="btn" data-j-cancel>Cancelar</button>
          <button class="btn btn-primary" data-j-save>Guardar</button>
        </span>
      </div>
    </div>`;
  }
  const time = new Date(e.createdAt).toLocaleTimeString('pt-PT', { hour: '2-digit', minute: '2-digit' });
  const edited = e.updatedAt ? ' · editado' : '';
  return `
  <div class="journal-entry" data-id="${e.id}">
    <div class="journal-entry-body">${esc(e.text).replace(/\n/g, '<br>')}</div>
    <div class="journal-entry-foot">
      <span class="journal-time">${time}${edited}</span>
      <span class="journal-entry-actions">
        <button class="btn-icon" data-j-edit="${e.id}" title="Editar">${I.edit}</button>
        <button class="btn-icon danger" data-j-del="${e.id}" title="Apagar">${I.trash}</button>
      </span>
    </div>
  </div>`;
}

function renderIdeias(v) {
  const entries = [...(DB.journal || [])]
    .sort((a, b) => (b.createdAt || '').localeCompare(a.createdAt || ''));
  const total = entries.length;

  // agrupar por dia (entries já ordenadas do mais recente para o mais antigo)
  const groups = [];
  let cur = null;
  for (const e of entries) {
    const day = journalDay(e);
    if (!cur || cur.day !== day) { cur = { day, label: journalDayLabel(day), items: [] }; groups.push(cur); }
    cur.items.push(e);
  }

  v.innerHTML = `
    <div class="card journal-composer">
      <textarea id="jInput" class="journal-input" rows="2" placeholder="Tiveste uma ideia sobre o teu dinheiro? Regista-a aqui — uma estratégia, algo a melhorar, uma oportunidade…"></textarea>
      <div class="journal-composer-foot">
        <span class="journal-hint">Enter para guardar · Shift+Enter para nova linha</span>
        <button class="btn btn-primary" id="jSave">${I.plus}<span>Registar ideia</span></button>
      </div>
    </div>

    ${total ? `<div class="journal-stats">
      <span><strong>${total}</strong> ${total === 1 ? 'ideia' : 'ideias'}</span>
    </div>` : ''}

    ${total ? groups.map(g => `
      <div class="journal-day">
        <div class="journal-day-label">${esc(g.label)}</div>
        ${g.items.map(journalEntryHTML).join('')}
      </div>`).join('') : `
      <div class="card"><div class="empty" style="padding:40px 12px">
        <div class="e-icon">${I.idea}</div>
        <h3>Ainda sem ideias</h3>
        <p>Regista aí em cima a primeira ideia que te surgir sobre o teu dinheiro. Sem regras nem formato — fica aqui guardada para quando precisares.</p>
      </div></div>`}
  `;

  const input = $('#jInput', v);
  autoGrow(input);
  input.addEventListener('input', () => autoGrow(input));
  const saveEntry = () => {
    const text = input.value.trim();
    if (!text) { input.focus(); return; }
    DB.journal.push({ id: uid(), text, date: todayISO(), createdAt: new Date().toISOString() });
    save(); render(); toast('Ideia guardada');
  };
  $('#jSave', v).addEventListener('click', saveEntry);
  input.addEventListener('keydown', e => {
    if (e.key === 'Enter' && !e.shiftKey) { e.preventDefault(); saveEntry(); }
  });

  bindJournalEntries(v);

  // foco: no editor se estiver a editar, senão no compositor (retoma o fluxo sem fricção)
  if (!UI.journalEdit) input.focus();
}

function bindJournalEntries(v) {
  $$('[data-j-edit]', v).forEach(b => b.addEventListener('click', () => { UI.journalEdit = b.dataset.jEdit; render(); }));
  $$('[data-j-del]', v).forEach(b => b.addEventListener('click', () => {
    const id = b.dataset.jDel;
    confirmModal({
      title: 'Apagar ideia?',
      message: 'Esta ideia será removida. Esta ação não pode ser anulada.',
      confirmLabel: 'Apagar', danger: true,
      onConfirm() {
        DB.journal = DB.journal.filter(x => x.id !== id);
        if (UI.journalEdit === id) UI.journalEdit = null;
        save(); render(); toast('Ideia apagada');
      },
    });
  }));

  const ed = $('.journal-entry.editing', v);
  if (!ed) return;
  const ta = $('.journal-edit-input', ed);
  ta.focus(); ta.setSelectionRange(ta.value.length, ta.value.length); autoGrow(ta);
  ta.addEventListener('input', () => autoGrow(ta));
  const saveEdit = () => {
    const id = UI.journalEdit;
    const e = DB.journal.find(x => x.id === id);
    const text = ta.value.trim();
    if (e && text) { e.text = text; e.updatedAt = new Date().toISOString(); }
    UI.journalEdit = null; save(); render();
    if (e && text) toast('Ideia atualizada');
  };
  $('[data-j-save]', ed).addEventListener('click', saveEdit);
  $('[data-j-cancel]', ed).addEventListener('click', () => { UI.journalEdit = null; render(); });
  ta.addEventListener('keydown', e => {
    if (e.key === 'Enter' && !e.shiftKey) { e.preventDefault(); saveEdit(); }
    else if (e.key === 'Escape') { e.preventDefault(); UI.journalEdit = null; render(); }
  });
}

        $('[data-save]', bd).addEventListener('click', saveFn);
        bd.addEventListener('keydown', e => { if (e.key === 'Enter') { e.preventDefault(); saveFn(); } });
      },
    });
  }));
  $$('[data-del-cat]', v).forEach(b => {
    if (b.disabled) return;
    b.addEventListener('click', () => {
      DB.categories = DB.categories.filter(x => x.id !== b.dataset.delCat);
      save(); render(); toast('Categoria apagada');
    });
  });

  $('#btnAddRec').addEventListener('click', () => openRecurrentEditModal());
  $$('[data-edit-rec]', v).forEach(b => b.addEventListener('click', () => openRecurrentEditModal(DB.recurrents.find(r => r.id === b.dataset.editRec))));
  $$('[data-del-rec]', v).forEach(b => b.addEventListener('click', () => {

      confirmLabel: 'Apagar', danger: true,

    });

  // tipos de investimento
  const ensureInvTypes = () => { if (!Array.isArray(DB.invTypes) || !DB.invTypes.length) DB.invTypes = [...INV_TYPES_DEFAULT]; };
  $('#btnAddInvType').addEventListener('click', () => {

    if (!name) { input.focus(); return; }

    if (DB.invTypes.some(t => t.toLowerCase() === name.toLowerCase())) { toast('Esse tipo já existe'); return; }
    DB.invTypes.push(name);
    save(); render(); toast('Tipo adicionado');

  $$('[data-ren-itype]', v).forEach(b => b.addEventListener('click', () => {
    const oldName = b.dataset.renItype;
    openModal({
      title: 'Renomear tipo',
      body: `<div class="field"><label>Nome</label><input id="inRenType" value="${esc(oldName)}" autocomplete="off"></div>`,
      footHtml: `<button class="btn" data-cancel>Cancelar</button><button class="btn btn-primary" data-save>Guardar</button>`,
      onMount(bd) {
        $('[data-cancel]', bd).addEventListener('click', closeModal);
        const saveFn = () => {
          const n = $('#inRenType', bd).value.trim();
          if (!n) return;
          ensureInvTypes();
          if (n !== oldName && DB.invTypes.some(t => t.toLowerCase() === n.toLowerCase())) { toast('Esse tipo já existe'); return; }
          DB.invTypes = DB.invTypes.map(t => t === oldName ? n : t);
          DB.investments.forEach(p => { if (p.type === oldName) p.type = n; }); // renomeia nas posições em uso
          save(); closeModal(); render(); toast('Tipo renomeado');
        };
        $('[data-save]', bd).addEventListener('click', saveFn);
        bd.addEventListener('keydown', e => { if (e.key === 'Enter') { e.preventDefault(); saveFn(); } });
      },
    });
  }));
  $$('[data-del-itype]', v).forEach(b => {
    if (b.disabled) return;
    b.addEventListener('click', () => {
      ensureInvTypes();
      if (DB.invTypes.length <= 1) { toast('Tem de existir pelo menos um tipo'); return; }
      DB.invTypes = DB.invTypes.filter(t => t !== b.dataset.delItype);
      save(); render(); toast('Tipo apagado');
    });
  });
}

// guarda a configuração de conta reforçada como nova versão em vigor a partir de `from`
// (as versões anteriores ficam no histórico; cfg = null desativa a partir dessa data)
function setReinforced(acc, cfg, from) {
  let vs = intVersions(acc).map(v => ({ ...v }));
  const last = vs[vs.length - 1] || null;
  const lastOn = last && last.on ? last : null;
  if (!cfg) {
    if (!lastOn) return false;
    vs = vs.filter(v => v.from < from);
    if (vs.length) vs.push({ from, on: false });
  } else if (lastOn && sameIntCfg(lastOn, cfg)) {
    if (from === lastOn.from || from === todayISO()) return false; // nada mudou
    // mesma configuração com outra data: muda o início da versão em vigor
    const prev = vs[vs.length - 2];
    if (prev && from <= prev.from) { vs = vs.filter(v => v.from < from); vs.push({ from, on: true, ...cfg }); }
    else lastOn.from = from;
  } else {
    vs = vs.filter(v => v.from < from);
    vs.push({ from, on: true, ...cfg });
  }
  acc.reinforced = vs.some(v => v.on) ? { versions: vs } : null;
  return true;
}

function openAccOptionsModal(acc) {
  const appBalance = accountBalance(acc);
  const today = todayISO();
  const active = intIsActive(acc);
  const versions = intVersions(acc);
  const cur = intLastOn(acc) || { rate: null, per: 'ano', freq: 'diario', base: 360, tax: 28, dest: null };
  const others = DB.accounts.filter(a => a.id !== acc.id);
  const received = DB.transactions.filter(t => t.interestOf === acc.id).reduce((s, t) => s + t.amount, 0);
  // valores pequenos (abaixo de 1 €) com 3 casas, para se ver o que rende por dia
  const fmt3 = c => Math.abs(c) < 100 ? (c / 100).toLocaleString('pt-PT', { minimumFractionDigits: 2, maximumFractionDigits: 3 }) + ' €' : fmt(Math.round(c));
  const pct2 = x => (x * 100).toLocaleString('pt-PT', { minimumFractionDigits: 2, maximumFractionDigits: 2 }) + '%';
  const histHTML = versions.length ? `
    <div class="opt-hist">
      <div class="h-t">Histórico</div>
      ${versions.map(v => `<div class="h-r">desde ${fmtDateShort(v.from)} — ${v.on
        ? `${esc(intSummary(v))} · retenção ${fmtTaxPct(v.tax)}${v.dest && v.dest !== acc.id ? ` · para ${esc(accById(v.dest)?.name || '?')}` : ''}`
        : 'desativada'}</div>`).join('')}
      ${received ? `<div class="h-r" style="margin-top:3px">Juros líquidos já lançados: <strong>${fmt(received)}</strong></div>` : ''}
    </div>` : '';

  openModal({
    title: `Opções — ${acc.name}`,
    wide: true,
    body: `
      <div class="opt-sec">
        <div class="opt-title">Acertar saldo</div>
        <p class="opt-note">Saldo na app: <strong>${fmt(appBalance)}</strong>. Escreve o saldo real (o que o banco mostra) e a app cria um movimento de acerto com a diferença — sem tocar nas receitas nem nas despesas do mês. Deixa vazio para não acertar.</p>
        <div class="field" id="fReal"><label>Saldo real (€)</label><input id="inReal" inputmode="decimal" placeholder="${(appBalance / 100).toFixed(2).replace('.', ',')}" autocomplete="off"><div class="err">Indica um valor válido (pode ser negativo).</div></div>
        <p class="opt-preview" id="fixPreview"></p>
      </div>

      <div class="opt-sec">
        <div class="opt-title">Fundo de emergência</div>
        <label class="check-row"><input type="checkbox" id="inAccFund"${acc.emergencyFund ? ' checked' : ''}><span>É o meu fundo de emergência<small>Conta o saldo desta conta no indicador de meses cobertos na Visão geral. Pode ser também uma conta reforçada.</small></span></label>
      </div>

      <div class="opt-sec">
        <div class="opt-title">Conta reforçada</div>
        <label class="check-row"><input type="checkbox" id="inReinf"${active ? ' checked' : ''}><span>Definir como conta reforçada<small>A app lança os juros sozinha, à meia-noite: contam todos os dias sobre o saldo ao fim do dia e são pagos na periodicidade escolhida, já com a retenção na fonte descontada.</small></span></label>
        <div id="reinfFields"${active ? '' : ' style="display:none"'}>
          <div class="field"><label>Pagamento dos juros</label>
            <div class="seg" id="segFreq" style="margin:0">
              <button type="button" data-f="diario">Diário</button>
              <button type="button" data-f="mensal">Mensal</button>
              <button type="button" data-f="anual">Anual</button>
            </div>
          </div>
          <div class="form-row">
            <div class="field" id="fRate"><label>Taxa de juro (%)</label><input id="inRate" inputmode="decimal" placeholder="Ex.: 1,50" value="${cur.rate != null ? numToInput(cur.rate) : ''}" autocomplete="off"><div class="err">Indica uma taxa maior que zero.</div></div>
            <div class="field"><label>A taxa é</label><select id="inPer">
              <option value="ano"${cur.per === 'ano' ? ' selected' : ''}>ao ano</option>
              <option value="mes"${cur.per === 'mes' ? ' selected' : ''}>ao mês</option>
              <option value="dia"${cur.per === 'dia' ? ' selected' : ''}>ao dia</option>
            </select></div>
          </div>
          <div class="form-row">
            <div class="field" id="fTax"><label>Retenção na fonte (%)</label><input id="inTax" inputmode="decimal" value="${numToInput(cur.tax)}" autocomplete="off"><div class="err">Indica um valor entre 0 e 100.</div></div>
            <div class="field"><label>Base de cálculo</label><select id="inBase">
              <option value="360"${Number(cur.base) !== 365 ? ' selected' : ''}>360 dias (como a Revolut)</option>
              <option value="365"${Number(cur.base) === 365 ? ' selected' : ''}>365 dias</option>
            </select></div>
          </div>
          <div class="field"><label>Receber os juros em</label><select id="inDest">
            <option value="">Esta conta (juros sobre juros)</option>
            ${others.map(a => `<option value="${a.id}"${cur.dest === a.id ? ' selected' : ''}>${esc(a.name)}</option>`).join('')}
          </select></div>
          <p class="opt-preview" id="reinfPreview"></p>
        </div>
        <div class="field" id="fFrom"><label id="lblFrom"></label><input id="inFrom" type="date" value="${today}"><div class="err">Indica uma data.</div><p class="field-hint" id="fromHint"></p></div>
        ${histHTML}
      </div>`,
    footHtml: `<button class="btn" data-cancel>Cancelar</button><button class="btn btn-primary" data-save>Guardar</button>`,
    onMount(bd) {
      $('[data-cancel]', bd).addEventListener('click', closeModal);

      // acertar saldo — pré-visualização da diferença
      const realIn = $('#inReal', bd), fixPrev = $('#fixPreview', bd);
      realIn.addEventListener('input', () => {
        const real = parseAmountSigned(realIn.value);
        if (real === null) { fixPrev.textContent = ''; return; }
        const diff = real - appBalance;
        fixPrev.textContent = diff === 0 ? 'O saldo já está certo — nada será criado.' : `Será criado um acerto de ${fmtSign(diff)}.`;
      });

      // conta reforçada
      let freq = cur.freq || 'diario';
      const chk = $('#inReinf', bd), fields = $('#reinfFields', bd), fFrom = $('#fFrom', bd), lblFrom = $('#lblFrom', bd);
      const rPrev = $('#reinfPreview', bd);
      const syncSeg = () => $$('#segFreq button', bd).forEach(b => b.classList.toggle('active', b.dataset.f === freq));
      const syncVisibility = () => {
        fields.style.display = chk.checked ? '' : 'none';
        fFrom.style.display = (chk.checked || active) ? '' : 'none';
        lblFrom.textContent = chk.checked ? (active ? 'Em vigor a partir de' : 'A contar desde') : 'Desativar a partir de';
      };
      const updPreview = () => {
        const rate = parsePct($('#inRate', bd).value);
        const tax = parsePct($('#inTax', bd).value);
        if (!rate || tax === null || tax > 100) { rPrev.textContent = ''; return; }
        if (appBalance <= 0) { rPrev.textContent = 'Com o saldo a zero ainda não há juros — começam a contar assim que houver saldo.'; return; }
        const v = { rate, per: $('#inPer', bd).value, freq, base: Number($('#inBase', bd).value), tax };
        const e = intEstimate(appBalance, v, !$('#inDest', bd).value);
        const perLbl = freq === 'diario' ? 'por dia' : freq === 'mensal' ? 'por mês' : 'por ano';
        rPrev.innerHTML = `Com o saldo atual (${fmt(appBalance)}): ≈ <strong>${fmt3(e.perNet)}</strong> líquidos ${perLbl}.<br>`
          + `Num ano: ≈ <strong>${fmt(Math.round(e.yearNet))}</strong> líquidos (${pct2(e.yearNet / appBalance)}) · ${fmt(Math.round(e.yearGross))} brutos (${pct2(e.yearGross / appBalance)}).`;
      };
      // explica quando a alteração começa a contar (os pagamentos acontecem à meia-noite)
      const fromHint = $('#fromHint', bd);
      const updFromHint = () => {
        const d = $('#inFrom', bd).value;
        if (!/^\d{4}-\d{2}-\d{2}$/.test(d)) { fromHint.textContent = ''; return; }
        const D = fmtDateShort(d), next = fmtDateShort(isoAddDays(d, 1));
        const periodTxt = freq === 'mensal'
          ? 'cada mês é pago à meia-noite que o fecha (com a data do último dia do mês)'
          : 'cada ano é pago à meia-noite que o fecha (com a data de 31/12)';
        let txt;
        if (!chk.checked) txt = `O último dia a render é ${fmtDateShort(isoAddDays(d, -1))}; o que faltar pagar é pago à meia-noite, já a ${D}.`;
        else if (!active) txt = freq === 'diario'
          ? `Os juros começam a contar a ${D}; o primeiro pagamento é à meia-noite, já a ${next}, e depois todos os dias à meia-noite.`
          : `Os juros começam a contar a ${D}; ${periodTxt}.`;
        else txt = freq === 'diario'
          ? `Os juros de ${D} já usam estes valores e são pagos à meia-noite, já a ${next}; os pagamentos até ${D} não mudam.`
          : `Os juros a partir de ${D} já usam estes valores; ${periodTxt}.`;
        if (d < today) txt += ' Como a data é passada, os juros desde essa data são recalculados.';
        fromHint.textContent = txt;
      };

      $$('#segFreq button', bd).forEach(b => b.addEventListener('click', () => { freq = b.dataset.f; syncSeg(); updPreview(); updFromHint(); }));
      chk.addEventListener('change', () => { syncVisibility(); updPreview(); updFromHint(); });
      ['#inRate', '#inTax'].forEach(s => $(s, bd).addEventListener('input', updPreview));
      ['#inPer', '#inBase', '#inDest'].forEach(s => $(s, bd).addEventListener('change', updPreview));
      ['input', 'change'].forEach(ev => $('#inFrom', bd).addEventListener(ev, updFromHint));
      syncSeg(); syncVisibility(); updPreview(); updFromHint();

      const saveFn = () => {
        const rawReal = realIn.value.trim();
        const real = rawReal ? parseAmountSigned(rawReal) : null;
        $('#fReal', bd).classList.toggle('invalid', !!rawReal && real === null);
        const from = $('#inFrom', bd).value;
        const fromOk = /^\d{4}-\d{2}-\d{2}$/.test(from);
        let cfg = null, ok = !(rawReal && real === null);
        if (chk.checked) {
          const rate = parsePct($('#inRate', bd).value);
          const tax = parsePct($('#inTax', bd).value);
          $('#fRate', bd).classList.toggle('invalid', !rate);
          $('#fTax', bd).classList.toggle('invalid', tax === null || tax > 100);
          if (!rate || tax === null || tax > 100) ok = false;
          cfg = { rate, per: $('#inPer', bd).value, freq, base: Number($('#inBase', bd).value) === 365 ? 365 : 360, tax, dest: $('#inDest', bd).value || null };
        }
        const needDate = chk.checked || active;
        $('#fFrom', bd).classList.toggle('invalid', needDate && !fromOk);
        if (needDate && !fromOk) ok = false;
        if (!ok) return;

        const done = [];
        const fund = $('#inAccFund', bd).checked;
        if (!!acc.emergencyFund !== fund) { acc.emergencyFund = fund; done.push(fund ? 'marcada como fundo de emergência' : 'deixou de ser o fundo de emergência'); }
        if (setReinforced(acc, cfg, fromOk ? from : today)) done.push(cfg ? 'conta reforçada guardada' : 'deixou de ser reforçada');
        save(); // recalcula os juros antes de acertar o saldo
        if (real !== null) {
          const appNow = accountBalance(acc);
          const diff = real - appNow;
          if (diff !== 0) {
            DB.transactions.push({
              id: uid(),
              date: today,
              type: 'ajuste',
              amount: diff, // com sinal
              categoryId: null,
              accountId: acc.id,
              toAccountId: null,
              description: 'Acerto de saldo',
              notes: `Saldo na app ${fmt(appNow)} → saldo real ${fmt(real)}`,
              createdAt: new Date().toISOString(),
            });
            save();
            done.push(`saldo acertado (${fmtSign(diff)})`);
          } else done.push('o saldo já estava certo');
        }
        closeModal(); render();
        const msg = done.join(' · ');
        toast(msg ? msg.charAt(0).toUpperCase() + msg.slice(1) : 'Sem alterações');
      };
      $('[data-save]', bd).addEventListener('click', saveFn);
      bd.addEventListener('keydown', e => { if (e.key === 'Enter' && e.target.tagName !== 'SELECT' && e.target.tagName !== 'BUTTON') { e.preventDefault(); saveFn(); } });
    },
  });
}

/* ---------- export / import ---------- */
function exportJSON() {
  const stamp = new Date().toISOString();
  const name = `financas-backup-${todayISO()}.json`;
  const payload = { ...DB, settings: { ...DB.settings, lastExportAt: stamp }, exportedAt: stamp };
  const blob = new Blob([JSON.stringify(payload, null, 2)], { type: 'application/json' });
  const done = () => { DB.settings.lastExportAt = stamp; save(); render(); toast('Backup exportado 📦'); };
  // no telemóvel usa a folha de partilha (guardar em Ficheiros/Drive, enviar…): no iPhone, uma app
  // aberta a partir do ecrã principal não consegue descarregar ficheiros. No PC descarrega como sempre.
  if (isTouchDevice() && navigator.canShare && typeof File === 'function') {
    const file = new File([blob], name, { type: 'application/json' });
    if (navigator.canShare({ files: [file] })) {
      navigator.share({ files: [file], title: 'Backup do Fluxo' })
        .then(done)
        .catch(err => { if (!err || err.name !== 'AbortError') downloadBlob(blob, name, done); });
      return;
    }
  }
  downloadBlob(blob, name, done);
}
function downloadBlob(blob, name, then) {
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href = url;
  a.download = name;
  document.body.appendChild(a);
  a.click();
  a.remove();
  setTimeout(() => URL.revokeObjectURL(url), 4000);
  if (then) then();
}

function handleImportFile(file) {
  const reader = new FileReader();
  reader.onload = () => {
    let obj;
    try { obj = JSON.parse(reader.result); }
    catch (e) { toast('Ficheiro inválido — não é JSON'); return; }
    const ok = obj && typeof obj === 'object'
      && Array.isArray(obj.transactions) && Array.isArray(obj.accounts)
      && Array.isArray(obj.categories) && Array.isArray(obj.investments);
    if (!ok) { toast('Este ficheiro não parece ser um backup do Fluxo'); return; }
    confirmModal({
      title: 'Importar backup?',
      message: `O ficheiro contém <strong>${obj.transactions.length}</strong> movimentos, <strong>${obj.accounts.length}</strong> contas, <strong>${obj.categories.length}</strong> categorias e <strong>${obj.investments.length}</strong> investimentos${obj.exportedAt ? ` (exportado em ${new Date(obj.exportedAt).toLocaleDateString('pt-PT')})` : ''}.<br><br><strong>Os dados atuais serão substituídos.</strong>`,
      confirmLabel: 'Substituir e importar',
      onConfirm() {
        DB = migrateInvestments(Object.assign(defaultData(), obj, { app: 'fluxo-finance', version: 1 }));
        if (!Array.isArray(DB.budgets)) DB.budgets = [];
        if (!Array.isArray(DB.goals)) DB.goals = [];
        if (!Array.isArray(DB.recurrents)) DB.recurrents = [];
        save();
        UI.view = 'dashboard';
        UI.month = currentYM();
        render();
        toast('Backup importado com sucesso');
      },
    });
  };
  reader.readAsText(file);
}

function renderBackupHint() {
  const el = $('#backupHint');
  if (!el) return;
  const last = DB.settings.lastExportAt;
  if (!last) { el.textContent = 'Sem backups ainda'; return; }
  const days = Math.floor((Date.now() - new Date(last).getTime()) / 86400000);
  el.textContent = days === 0 ? 'Backup feito hoje' : `Último backup há ${days} dia${days !== 1 ? 's' : ''}`;
}

/* ---------- arranque ---------- */
function init() {
  // navegação
  $$('.nav-item[data-view]').forEach(b => b.addEventListener('click', () => goToView(b.dataset.view)));
  $('#navMore').addEventListener('click', openMoreSheet);

  // botões de backup na barra lateral
  $('#sideExport').addEventListener('click', exportJSON);
  $('#sideImport').addEventListener('click', () => $('#importFile').click());
  $('#importFile').addEventListener('change', e => {
    if (e.target.files[0]) handleImportFile(e.target.files[0]);
    e.target.value = '';
  });

  // atalhos de teclado
  document.addEventListener('keydown', e => {
    if (e.key === 'Escape') { closeModal(); return; }
    const tag = document.activeElement?.tagName;
    if (tag === 'INPUT' || tag === 'TEXTAREA' || tag === 'SELECT') return;
    if ($('#modalBackdrop')) return;
    if (e.key.toLowerCase() === 'n') { e.preventDefault(); openNewMovementChooser(); }
  });

  save(); // garante persistência dos defaults na primeira execução
  render();

  // juros à meia-noite: com a app aberta, e ao voltar ao separador depois de o computador ter estado suspenso
  scheduleMidnightRefresh();
  document.addEventListener('visibilitychange', () => { if (!document.hidden) refreshIfNewDay(); });

  // gráficos: no telemóvel a dica abre com um toque — fecha ao tocar fora ou ao fazer scroll
  document.addEventListener('touchstart', e => { if (!e.target.closest('svg')) hideTip(); }, { passive: true });
  window.addEventListener('scroll', hideTip, { passive: true });

  if (isTouchDevice()) {
    // iPhone: o filtro .json pode deixar o ficheiro de backup a cinzento — a validação é feita ao ler
    $('#importFile').removeAttribute('accept');
    // pede ao browser para não apagar os dados por falta de espaço (sobretudo iOS/Android)
    if (navigator.storage && navigator.storage.persist) navigator.storage.persist().catch(() => {});
  }
  // quando servida por http(s) (instalada no telemóvel), funciona sem internet
  if ('serviceWorker' in navigator && /^https?:$/.test(location.protocol)) {
    navigator.serviceWorker.register('sw.js').catch(() => {});
  }
}

function isTouchDevice() { return !!(window.matchMedia && window.matchMedia('(pointer: coarse)').matches); }

// arranque: primeiro lê os dados guardados (IndexedDB é assíncrono), depois monta a app
async function start() {
  const data = await loadData();
  if (!data) { renderStorageBlocked(); return; }
  DB = data;
  init();
}
function renderStorageBlocked() {
  $('#view').innerHTML = `
    <div class="card"><div class="empty">
      <h3>Não foi possível abrir os dados</h3>
      <p>Os teus dados estão na base de dados deste browser (IndexedDB), mas ela não respondeu agora. Nada foi apagado nem alterado.<br>Fecha e volta a abrir a app; se continuar, reinicia o browser ou o telemóvel.</p>
      <button class="btn btn-primary" id="btnRetryLoad">Tentar de novo</button>
    </div></div>`;
  $('#btnRetryLoad').addEventListener('click', () => location.reload());
}

if (document.readyState === 'loading') document.addEventListener('DOMContentLoaded', start);
else start();

</script>
