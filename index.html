/* ---------- toast / tooltip ---------- */
let toastTimer = null;
function toast(msg) {
  let el = $('#toast');
  el.textContent = msg;
  el.classList.add('show');
  clearTimeout(toastTimer);
  toastTimer = setTimeout(() => el.classList.remove('show'), 2400);
}
function showTip(html, x, y) {
  const tip = $('#chartTip');
  tip.innerHTML = html;
  tip.classList.add('show');
  const r = tip.getBoundingClientRect();
  let px = x + 14, py = y - r.height - 10;
  if (px + r.width > window.innerWidth - 8) px = x - r.width - 14;
  if (py < 8) py = y + 16;
  tip.style.left = px + 'px';
  tip.style.top = py + 'px';
}
function hideTip() { $('#chartTip').classList.remove('show'); }

/* ---------- modais ---------- */
function openModal({ title, body, footHtml, wide = false, onMount }) {
  closeModal();
  const bd = document.createElement('div');
  bd.className = 'modal-backdrop';
  bd.id = 'modalBackdrop';
  bd.innerHTML = `
    <div class="modal${wide ? ' wide' : ''}" role="dialog" aria-modal="true">
      <div class="modal-head">
        <h2>${esc(title)}</h2>
        <button class="btn-icon" data-close aria-label="Fechar">✕</button>
      </div>
      <div class="modal-body">${body}</div>
      <div class="modal-foot">${footHtml || ''}</div>
    </div>`;
  document.body.appendChild(bd);
  bd.addEventListener('mousedown', e => { if (e.target === bd) closeModal(); });
  $('[data-close]', bd).addEventListener('click', closeModal);
  if (onMount) onMount(bd);
  // no PC põe o cursor no primeiro campo; no telemóvel não (abriria o teclado por cima da janela)
  const first = $('input, select, textarea', bd);
  if (first && !isTouchDevice()) setTimeout(() => first.focus(), 30);
  return bd;
}
function closeModal() {
  const bd = $('#modalBackdrop');
  if (bd) bd.remove();
}
function confirmModal({ title, message, confirmLabel = 'Confirmar', danger = false, requireText = null, onConfirm, onCancel = null }) {
  openModal({
    title,
    body: `<p style="margin:0 0 10px;color:var(--ink-2);font-size:13px">${message}</p>` +
      (requireText ? `<div class="field"><label>Escreve <strong>${esc(requireText)}</strong> para confirmar</label><input id="confirmText" autocomplete="off"></div>` : ''),
    footHtml: `<button class="btn" data-cancel>Cancelar</button>
               <button class="btn ${danger ? 'btn-danger' : 'btn-primary'}" data-ok ${requireText ? 'disabled' : ''}>${esc(confirmLabel)}</button>`,
    onMount(bd) {
      $('[data-cancel]', bd).addEventListener('click', () => { closeModal(); if (onCancel) onCancel(); });
      const ok = $('[data-ok]', bd);
      if (requireText) {
        $('#confirmText', bd).addEventListener('input', e => {
          ok.disabled = e.target.value.trim().toUpperCase() !== requireText.toUpperCase();
        });
      }
      ok.addEventListener('click', () => { closeModal(); onConfirm(); });
    },
  });
}

/* ============================================================
   GRÁFICOS
   ============================================================ */
function topRoundRect(x, y, w, h, r) {
  r = Math.min(r, h, w / 2);
  return `M${x} ${y + h} L${x} ${y + r} Q${x} ${y} ${x + r} ${y} L${x + w - r} ${y} Q${x + w} ${y} ${x + w} ${y + r} L${x + w} ${y + h} Z`;
}

function flowChartHTML(rows) {
  // rows: [{ym, inc, exp}]
  const W = 680, H = 252, padL = 52, padR = 8, padT = 16, padB = 30;
  const innerW = W - padL - padR, innerH = H - padT - padB;
  const maxVal = niceCeil(Math.max(100, ...rows.map(r => Math.max(r.inc, r.exp))));
  const y = v => padT + (1 - v / maxVal) * innerH;
  const groupW = innerW / rows.length;
  const barW = Math.min(20, Math.floor(groupW * 0.24));

  let grid = '';
  const steps = 4;
  for (let i = 0; i <= steps; i++) {
    const v = maxVal * i / steps;
    const yy = y(v);
    grid += `<line x1="${padL}" x2="${W - padR}" y1="${yy}" y2="${yy}" stroke="${i === 0 ? '#c3c2b7' : '#e1e0d9'}" stroke-width="1"/>`;
    grid += `<text x="${padL - 8}" y="${yy + 3.5}" text-anchor="end" font-size="10.5" fill="var(--ink-3)">${i === 0 ? '0' : euroAxis(v)}</text>`;
  }

  let bars = '';
  rows.forEach((r, i) => {
    const cx = padL + groupW * i + groupW / 2;
    const x1 = cx - barW - 1, x2 = cx + 1;
    const h1 = r.inc / maxVal * innerH, h2 = r.exp / maxVal * innerH;
    bars += `<g class="bar-group" data-i="${i}">
      <rect class="hit" x="${padL + groupW * i}" y="${padT}" width="${groupW}" height="${innerH}" rx="8"/>
      ${r.inc > 0 ? `<path d="${topRoundRect(x1, y(r.inc), barW, Math.max(h1, 2), 4)}" fill="#2a78d6"/>` : ''}
      ${r.exp > 0 ? `<path d="${topRoundRect(x2, y(r.exp), barW, Math.max(h2, 2), 4)}" fill="#e34948"/>` : ''}
      <text x="${cx}" y="${H - padB + 16}" text-anchor="middle" font-size="10.5" fill="var(--ink-3)" style="text-transform:capitalize">${esc(monthShort(r.ym))}</text>
    </g>`;
  });

  return `<svg class="flow-svg" viewBox="0 0 ${W} ${H}" id="flowChart">${grid}${bars}</svg>`;
}

function bindFlowTooltip(rows) {
  const svg = $('#flowChart');
  if (!svg) return;
  $$('.bar-group', svg).forEach(g => {
    const r = rows[+g.dataset.i];
    g.addEventListener('mousemove', e => {
      showTip(`
        <div class="tt-title">${esc(monthLabel(r.ym))}</div>
        <div class="tt-row"><span class="dot" style="background:#2a78d6"></span>Receitas <span class="v">${fmt(r.inc)}</span></div>
        <div class="tt-row"><span class="dot" style="background:#e34948"></span>Despesas <span class="v">${fmt(r.exp)}</span></div>
        <div class="tt-row" style="margin-top:3px;opacity:.85">Saldo <span class="v">${fmtSign(r.inc - r.exp)}</span></div>
      `, e.clientX, e.clientY);
    });
    g.addEventListener('mouseleave', hideTip);
  });
}

function donutHTML(slices, centerLabel, centerValue) {
  // slices: [{name, value, color}]
  const total = slices.reduce((s, x) => s + x.value, 0);
  if (total <= 0) return '';
  const cx = 90, cy = 90, R = 82, IR = 56;
  let a = -Math.PI / 2;
  let paths = '';
  slices.forEach((s, i) => {
    const frac = s.value / total;
    const a1 = a + Math.min(frac * Math.PI * 2, Math.PI * 2 - 0.0001);
    const large = (a1 - a) > Math.PI ? 1 : 0;
    const p = (ang, rr) => `${(cx + rr * Math.cos(ang)).toFixed(2)} ${(cy + rr * Math.sin(ang)).toFixed(2)}`;
    paths += `<path class="donut-slice" data-i="${i}" d="M${p(a, R)} A${R} ${R} 0 ${large} 1 ${p(a1, R)} L${p(a1, IR)} A${IR} ${IR} 0 ${large} 0 ${p(a, IR)} Z" fill="${s.color}" stroke="var(--surface)" stroke-width="2"/>`;
    a = a1;
  });
  return `<svg width="180" height="180" viewBox="0 0 180 180" id="donutChart">
    ${paths}
    <text x="${cx}" y="${cy - 4}" text-anchor="middle" font-size="11" fill="var(--ink-3)">${esc(centerLabel)}</text>
    <text x="${cx}" y="${cy + 15}" text-anchor="middle" font-size="15" font-weight="650" fill="var(--ink)">${esc(centerValue)}</text>
  </svg>`;
}

function bindDonutTooltip(slices) {
  const svg = $('#donutChart');
  if (!svg) return;
  const total = slices.reduce((s, x) => s + x.value, 0);
  $$('.donut-slice', svg).forEach(p => {
    const s = slices[+p.dataset.i];
    p.addEventListener('mousemove', e => {
      showTip(`<div class="tt-row"><span class="dot" style="background:${s.color}"></span>${esc(s.name)}
        <span class="v">${fmt(s.value)} · ${(s.value / total * 100).toFixed(1).replace('.', ',')}%</span></div>`, e.clientX, e.clientY);
    });
    p.addEventListener('mouseleave', hideTip);
  });
}

/* ---------- Dashboard ---------- */
function renderDashboard(v) {
  const m = monthTotals(UI.month);
  const prev = monthTotals(ymAdd(UI.month, -1));
  const cash = cashTotal();
  const inv = invTotals();
  const patrimonio = cash + inv.current;
  const savingsRate = m.inc > 0 ? m.net / m.inc : NaN;

  const deltaPct = (cur, before) => before > 0 ? (cur - before) / before : NaN;
  const dInc = deltaPct(m.inc, prev.inc), dExp = deltaPct(m.exp, prev.exp);

  // composição do património: cada conta + investimentos
  const parts = DB.accounts.map((a, i) => ({
    name: a.name, value: accountBalance(a), color: PALETTE[i % PALETTE.length],
  }));
  if (DB.investments.length) {
    parts.push({ name: 'Investimentos', value: inv.current, color: PALETTE[DB.accounts.length % PALETTE.length] });
  }
  const posTotal = parts.reduce((s, p) => s + Math.max(p.value, 0), 0);

  // fluxo 6 meses (a acabar no mês selecionado)
  const flowRows = [];
  for (let i = 5; i >= 0; i--) {
    const ym = ymAdd(UI.month, -i);
    const t = monthTotals(ym);
    flowRows.push({ ym, inc: t.inc, exp: t.exp });
  }

  // despesas por categoria (mês)
  const spent = spentByCategory(UI.month);
  let catRows = [...spent.entries()]
    .map(([id, val]) => ({ cat: catById(id), val }))
    .sort((a, b) => b.val - a.val);
  if (catRows.length > 8) {
    const top = catRows.slice(0, 7);

      <div class="tile">
        <div class="t-label">Investimentos</div>

        <div class="t-delta ${inv.pl > 0 ? 'up' : inv.pl < 0 ? 'down' : ''}">${inv.invested > 0 ? fmtSign(inv.pl) + ' (' + fmtPct(inv.pl / inv.invested) + ')' : 'sem posições'}</div>

// cartão da Visão geral: meses de despesa cobertos pelo fundo de emergência
function emergencyCardHTML(ef) {
  const m = ef.months, target = ef.target;
  let fill, track, statusClass, statusTxt;
  if (m >= target) { fill = '#0ca30c'; track = '#d3ecd3'; statusClass = 'pl-pos'; statusTxt = 'Meta atingida'; }
  else if (m >= target * 0.5) { fill = '#2a78d6'; track = '#dbe9fb'; statusClass = ''; statusTxt = 'A meio caminho'; }
  else if (m >= 1) { fill = '#fab219'; track = '#fdeed0'; statusClass = ''; statusTxt = 'A construir'; }
  else { fill = '#d03b3b'; track = '#f7dcdc'; statusClass = 'pl-neg'; statusTxt = 'Frágil'; }
  const pct = Math.min(m / target, 1) * 100;
  const monthsTxt = m >= 100 ? '99+' : m.toFixed(1).replace('.', ',');
  return `
    <div class="card ef-card">
      <div class="ef-left">
        <span class="card-title">Fundo de emergência</span>
        <div class="ef-months"><strong class="${statusClass}">${monthsTxt}</strong><span class="ef-unit">${m === 1 ? 'mês' : 'meses'} de despesas cobertos</span></div>
        <div class="ef-status ${statusClass}">${statusTxt} · meta ${target} ${target === 1 ? 'mês' : 'meses'}</div>
      </div>
      <div class="ef-right">
        <div class="ef-meter" style="background:${track}"><div class="fill" style="width:${pct.toFixed(1)}%;background:${fill}"></div></div>
        <div class="ef-legend">
          <span>Fundo <strong>${fmt(ef.balance)}</strong>${ef.usingAllCash ? ' <span class="ef-hint">(todas as contas)</span>' : ''}</span>
          <span>Despesa média/mês <strong>${fmt(ef.avg)}</strong></span>
        </div>
        ${ef.usingAllCash ? `<button class="ef-cta" id="efDesignate">Marcar a conta do meu fundo →</button>` : ''}
      </div>
    </div>`;
}

// cartão da Visão geral: objetivo ativo com o prazo mais próximo
function nextGoalCardHTML(g) {
  const saved = goalSaved(g);
  const target = g.target || 0;
  const pct = target > 0 ? saved / target : 0;
  const reached = pct >= 1;
  const missing = target - saved;
  const [gy, gm] = g.deadline.split('-').map(Number);
  const now = new Date();
  const monthsLeft = (gy - now.getFullYear()) * 12 + (gm - 1 - now.getMonth());
  const dlLabel = new Date(gy, gm - 1, 1).toLocaleDateString('pt-PT', { month: 'long', year: 'numeric' });
  const overdue = !reached && monthsLeft <= 0;
  const fill = reached ? '#0ca30c' : overdue ? '#d03b3b' : '#2a78d6';
  const track = reached ? '#d3ecd3' : overdue ? '#f7dcdc' : '#dbe9fb';

  let status;
  if (reached) status = '✔ Objetivo alcançado';
  else if (overdue) status = `⚠ Prazo já passou — faltam ${fmt(missing)}`;
  else status = `Faltam ${fmt(missing)} · ${fmt(Math.ceil(missing / monthsLeft))}/mês em ${monthsLeft} ${monthsLeft === 1 ? 'mês' : 'meses'}`;

  return `
    <div class="card insight-card" data-goto-goals title="Ver objetivos">
      <div class="card-head">
        <span class="card-title">Próximo objetivo</span>
        <span class="card-note" style="text-transform:capitalize">${esc(dlLabel)}</span>
      </div>
      <div class="insight-name"><span class="c-dot" style="background:${PALETTE[0]}"></span>${esc(g.name)}</div>
      <div class="meter" style="background:${track}"><div class="fill" style="width:${Math.min(pct * 100, 100).toFixed(1)}%;background:${fill}"></div></div>
      <div class="b-nums"><span><strong>${fmt(saved)}</strong> de ${fmt(target)}</span><span>${(pct * 100).toFixed(0)} %</span></div>
      <div class="b-status ${overdue ? 'over' : reached ? '' : pct >= 0.8 ? 'near' : ''}">${status}</div>
    </div>`;
}

// cartão da Visão geral: orçamentos do mês que atingiram o limiar de alerta
function budgetAlertsCardHTML(alerts, alertPct) {
  return `
    <div class="card insight-card" data-goto-budgets title="Ver orçamentos">
      <div class="card-head">
        <span class="card-title">Orçamentos em alerta</span>
        <span class="card-note">≥ ${(alertPct * 100).toFixed(0)} % do limite</span>
      </div>
      <div class="alert-rows">
        ${alerts.map(b => {
          const pct = b.spent / b.limit;
          const over = pct > 1;
          const mcol = meterColors(pct);
          return `
          <div class="alert-row">
            <span class="c-name"><span class="c-dot" style="background:${catColor(b.cat)}"></span>${esc(b.cat.name)}</span>
            <div class="meter" style="background:${mcol.track}"><div class="fill" style="width:${Math.min(pct * 100, 100).toFixed(1)}%;background:${mcol.fill}"></div></div>
            <span class="a-val ${over ? 'over' : 'near'}">${(pct * 100).toFixed(0)} %</span>
          </div>`;
        }).join('')}
      </div>

}

function openReservedModal() {
  const active = (DB.goals || []).filter(g => !g.done);
  if (!active.length) return;
  openModal({
    title: 'Reservado para objetivos',
    body: `
      ${active.map(g => `
        <div class="reserved-row">
          <span class="nm">${esc(g.name)}</span>
          <span class="val">${fmt(goalSaved(g))} reservados</span>
        </div>`).join('')}
      <div class="reserved-row total">
        <span class="nm">Total</span>
        <span class="val">${fmt(goalsReserved())}</span>
      </div>`,
    footHtml: `<button class="btn" data-goto style="margin-right:auto">Ver objetivos</button>
               <button class="btn btn-primary" data-close-ok>Fechar</button>`,
    onMount(bd) {
      $('[data-close-ok]', bd).addEventListener('click', closeModal);

function txRowHTML(t) {
  if (t.type === 'ajuste') {
    const acc = accById(t.accountId);
    const isInv = !!t.investmentId;      // ligado a uma compra/venda de investimento
    const isBuy = isInv && t.amount < 0; // compra = saída de dinheiro
    const glyph = isBuy ? '↓' : isInv ? '↑' : '±';
    const avBg = isBuy ? hexA('#d03b3b', 0.14) : isInv ? hexA('#0ca30c', 0.14) : 'var(--wash)';
    const avFg = isBuy ? 'var(--crit)' : isInv ? 'var(--good-text)' : 'var(--ink-2)';
    const catLabel = isBuy ? 'Compra' : isInv ? 'Venda' : 'Acerto';
    const catDot = isBuy ? '#d03b3b' : isInv ? '#0ca30c' : OTHER_GRAY;
    return `
    <div class="tx-row" data-id="${t.id}"${isInv ? ' title="Movimento de investimento — gerido a partir de Investimentos"' : ''}>
      <div class="tx-desc">
        <div class="avatar" style="background:${avBg};color:${avFg}">${glyph}</div>
        <div class="txt">
          <div class="d1">${esc(t.description || 'Acerto de saldo')}</div>
          ${t.notes ? `<div class="d2">${esc(t.notes)}</div>` : ''}
        </div>
      </div>
      <div class="tx-cat"><span class="c-dot" style="background:${catDot}"></span><span>${catLabel}</span></div>
      <div class="tx-acc">${esc(acc ? acc.name : '—')}</div>
      <div class="tx-amount${(isInv && !isBuy) ? ' in' : ''}"${isBuy ? ' style="color:var(--crit)"' : (isInv ? '' : ' style="color:var(--ink-2)"')}>${fmtSign(t.amount)}</div>
      <div class="tx-actions">
        ${isInv ? `<span class="tx-managed" title="Gerido em Investimentos">${I.inv}</span>` : `<button class="btn-icon danger" data-del title="Apagar">${I.trash}</button>`}
      </div>
    </div>`;
  }
  if (t.type === 'transferencia') {
    const from = accById(t.accountId);
    const to = accById(t.toAccountId);
    return `
    <div class="tx-row" data-id="${t.id}">
      <div class="tx-desc">
        <div class="avatar" style="background:var(--wash);color:var(--ink-2)">⇄</div>
        <div class="txt">
          <div class="d1">${esc(t.description || 'Transferência')}</div>
          ${t.notes ? `<div class="d2">${esc(t.notes)}</div>` : ''}
        </div>
      </div>
      <div class="tx-cat"><span class="c-dot" style="background:${OTHER_GRAY}"></span><span>Transferência</span></div>
      <div class="tx-acc">${esc(from ? from.name : '—')} → ${esc(to ? to.name : '—')}</div>
      <div class="tx-amount" style="color:var(--ink-2)">${fmt(t.amount)}</div>
      <div class="tx-actions">
        <button class="btn-icon" data-edit title="Editar">${I.edit}</button>
        <button class="btn-icon danger" data-del title="Apagar">${I.trash}</button>
      </div>
    </div>`;
  }
  const cat = catById(t.categoryId);
  const acc = accById(t.accountId);
  const color = catColor(cat);
  const isInc = t.type === 'receita';
  const isInt = !!t.interestOf;          // juros gerados por uma conta reforçada
  const letter = (cat ? cat.name : '?').charAt(0).toUpperCase();
  return `
    <div class="tx-row" data-id="${t.id}"${isInt ? ' title="Juros automáticos — geridos nas Opções da conta reforçada (Definições → Contas)"' : ''}>
      <div class="tx-desc">
        <div class="avatar" style="background:${hexA(color, 0.14)};color:var(--ink-2)">${esc(letter)}</div>
        <div class="txt">
          <div class="d1">${esc(t.description || (cat ? cat.name : 'Movimento'))}</div>
          ${t.notes ? `<div class="d2">${esc(t.notes)}</div>` : ''}
        </div>
      </div>
      <div class="tx-cat"><span class="c-dot" style="background:${color}"></span><span>${esc(cat ? cat.name : '—')}</span></div>
      <div class="tx-acc">${esc(acc ? acc.name : '—')}</div>
      <div class="tx-amount ${isInc ? 'in' : ''}">${isInc ? '+' : '−'}${fmt(t.amount)}</div>
      <div class="tx-actions">
        ${isInt ? `<span class="tx-managed" title="Gerido nas Opções da conta reforçada">${I.adjust}</span>` : `<button class="btn-icon" data-edit title="Editar">${I.edit}</button>
        <button class="btn-icon danger" data-del title="Apagar">${I.trash}</button>`}

function bindTxRowEvents(scope) {
  $$('.tx-row', scope).forEach(row => {
    const id = row.dataset.id;
    row.addEventListener('click', e => {
      if (e.target.closest('[data-del]')) { deleteTx(id); return; }
      const t = DB.transactions.find(x => x.id === id);
      if (!t) return;
      if (t.interestOf) { toast('Juros automáticos — muda a taxa ou desativa nas Opções da conta (Definições → Contas)'); return; }
      if (t.type === 'ajuste') {
        toast(t.investmentId
          ? 'Movimento de investimento — edita ou apaga a partir de Investimentos'
          : 'Acertos não são editáveis — apaga e faz um acerto novo em Definições');
        return;
      }
      openTxModal(t);
    });
  });
}

function deleteTx(id) {
  const t = DB.transactions.find(x => x.id === id);
  if (!t) return;
  if (t.investmentId) { toast('Esta entrada vem de Investimentos — gere-a a partir de lá'); return; }
  if (t.interestOf) { toast('Juros automáticos — gere-os nas Opções da conta (Definições → Contas)'); return; }
  const label = t.description || (t.type === 'transferencia' ? 'Transferência' : t.type === 'ajuste' ? 'Acerto de saldo' : catById(t.categoryId)?.name) || 'Movimento';
  confirmModal({
    title: 'Apagar movimento?',
    message: `«${esc(label)}» de ${fmt(t.amount)} em ${esc(t.date)}. Esta ação não pode ser anulada.`,
    confirmLabel: 'Apagar',
    danger: true,
    onConfirm() {
      DB.transactions = DB.transactions.filter(x => x.id !== id);
      save(); render(); toast('Movimento apagado');
    },
  });
}

    <div class="card" id="txListCard"><div id="txList"></div></div>`;

  const rerenderList = () => renderTxList($('#txList'));
  $('#txSearch').addEventListener('input', e => { f.q = e.target.value; f.page = 1; rerenderList(); });

  $('#txCat').addEventListener('change', e => { f.cat = e.target.value; f.page = 1; rerenderList(); });
  $('#txScope').addEventListener('change', e => {
    f.scope = e.target.value;

  if (fromEl) fromEl.addEventListener('change', e => { if (e.target.value) f.from = e.target.value; f.page = 1; renderHeader(); rerenderList(); });
  if (toEl) toEl.addEventListener('change', e => { if (e.target.value) f.to = e.target.value; f.page = 1; renderHeader(); rerenderList(); });
  rerenderList();
}

function renderTxList(container) {
  const f = UI.tx;
  const q = f.q.trim().toLowerCase();
  let list = DB.transactions.filter(t => {
    const ym = t.date.slice(0, 7);
    if (f.scope === 'month' && ym !== UI.month) return false;
    if (f.scope === 'range') {
      const a = f.from || UI.month, b = f.to || UI.month;
      const lo = a <= b ? a : b, hi = a <= b ? b : a;
      if (ym < lo || ym > hi) return false;
    }
    if (f.type !== 'all' && t.type !== f.type) return false;
    if (f.cat !== 'all' && t.categoryId !== f.cat) return false;
    if (q) {
      const cat = catById(t.categoryId);
      const accNames = t.type === 'transferencia'
        ? `transferência ${accById(t.accountId)?.name || ''} ${accById(t.toAccountId)?.name || ''}`
        : (accById(t.accountId)?.name || '');
      const hay = `${t.description || ''} ${t.notes || ''} ${cat ? cat.name : ''} ${accNames}`.toLowerCase();
      if (!hay.includes(q)) return false;
    }
    return true;
  });
  list.sort((a, b) => b.date.localeCompare(a.date) || (b.createdAt || '').localeCompare(a.createdAt || ''));

  if (!list.length) {
    const scopeTxt = f.scope === 'month' ? 'neste mês' : f.scope === 'range' ? 'neste intervalo' : 'registados';
    container.innerHTML = `<div class="empty">
      <div class="e-icon">${I.search}</div>
      <h3>${q ? 'Nada encontrado' : `Sem movimentos ${scopeTxt}`}</h3>
      <p>${q ? 'Tenta outros termos ou alarga o âmbito da pesquisa.' : 'Regista um movimento ou ajusta o âmbito nos filtros.'}</p>
      <button class="btn btn-primary" id="btnEmptyTx">${I.plus}<span>Novo movimento</span></button>
    </div>`;
    const b = $('#btnEmptyTx', container);
    if (b) b.addEventListener('click', openNewMovementChooser);
    return;
  }

  let inc = 0, exp = 0, trs = 0, adj = 0;
  list.forEach(t => {
    if (t.type === 'receita') inc += t.amount;
    else if (t.type === 'despesa') exp += t.amount;
    else if (t.type === 'transferencia') trs++;
    else if (t.type === 'ajuste') adj++;
  });

  // paginação (os totais acima são sempre do conjunto filtrado completo)
  const PER_PAGE = 30;
  const pageCount = Math.max(1, Math.ceil(list.length / PER_PAGE));
  f.page = Math.min(Math.max(1, f.page), pageCount);
  const pageList = list.slice((f.page - 1) * PER_PAGE, f.page * PER_PAGE);

  // agrupar por dia (só a página visível)
  const groups = new Map();
  for (const t of pageList) {
    if (!groups.has(t.date)) groups.set(t.date, []);
    groups.get(t.date).push(t);
  }

  let html = `<div class="card-note" style="padding:2px 6px 6px">${list.length} movimento${list.length !== 1 ? 's' : ''} · receitas ${fmt(inc)} · despesas ${fmt(exp)} · saldo ${fmtSign(inc - exp)}${trs ? ` · ${trs} transferência${trs !== 1 ? 's' : ''}` : ''}${adj ? ` · ${adj} acerto${adj !== 1 ? 's' : ''}` : ''}</div>`;
  for (const [date, txs] of groups) {
    const dayNet = txs.reduce((s, t) => s + (t.type === 'receita' ? t.amount : t.type === 'despesa' ? -t.amount : t.type === 'ajuste' ? t.amount : 0), 0);
    html += `<div class="day-group">
      <div class="day-head"><span>${esc(dayLabel(date))}</span><span class="day-total">${fmtSign(dayNet)}</span></div>
      ${txs.map(txRowHTML).join('')}
    </div>`;
  }
  if (pageCount > 1) {
    html += `<div class="hist-pager">
      <button class="btn" data-tx-prev ${f.page === 1 ? 'disabled' : ''}>${I.left}</button>
      <span>Página ${f.page} de ${pageCount}</span>
      <button class="btn" data-tx-next ${f.page === pageCount ? 'disabled' : ''}>${I.right}</button>
    </div>`;
  }
  container.innerHTML = html;
  bindTxRowEvents(container);
  const prev = $('[data-tx-prev]', container);
  if (prev) prev.addEventListener('click', () => { f.page--; renderTxList(container); container.closest('.main')?.scrollIntoView(); });
  const next = $('[data-tx-next]', container);
  if (next) next.addEventListener('click', () => { f.page++; renderTxList(container); container.closest('.main')?.scrollIntoView(); });
}

/* ---------- recorrentes ---------- */
function openNewMovementChooser() {
  openModal({
    title: 'Novo movimento',
    body: `
      <button class="choice-btn" data-manual>
        <span class="c-t">Manual</span>
        <span class="c-d">Registo único — preencher tudo agora</span>
      </button>
      <button class="choice-btn" data-rec>
        <span class="c-t">Recorrente</span>
        <span class="c-d">Escolher da lista (renda, salário, subscrições…)${DB.recurrents.length ? ` · ${DB.recurrents.length} na lista` : ''}</span>
      </button>`,
    footHtml: '',
    onMount(bd) {
      $('[data-manual]', bd).addEventListener('click', () => { closeModal(); openTxModal(); });
      $('[data-rec]', bd).addEventListener('click', () => { closeModal(); openRecurrentsListModal(); });
    },
  });
}

function recMetaHTML(r) {
  const bits = [];
  if (r.type === 'transferencia') bits.push(`${esc(accById(r.accountId)?.name || '?')} → ${esc(accById(r.toAccountId)?.name || '?')}`);
  else bits.push(`${esc(catById(r.categoryId)?.name || '—')} · ${esc(accById(r.accountId)?.name || '—')}`);
  const freqTxt = recFreqText(r);
  if (freqTxt) bits.push(esc(freqTxt));
  if (r.dayOfMonth) bits.push(`costuma sair dia ${r.dayOfMonth}`);
  return bits.join(' · ');
}

function sortedRecurrents(type) {
  return DB.recurrents.filter(r => r.type === type)
    .sort((a, b) => (a.dayOfMonth || 99) - (b.dayOfMonth || 99) || recurrentLabel(a).localeCompare(recurrentLabel(b), 'pt'));
}

function openRecurrentsListModal() {
  const sections = [
    ['Despesas', sortedRecurrents('despesa'), '−'],
    ['Receitas', sortedRecurrents('receita'), '+'],
    ['Transferências', sortedRecurrents('transferencia'), ''],
  ].filter(s => s[1].length);

  const ym = currentYM();
  const rowHTML = (r, sign) => {
    const due = recIsDueIn(r, ym);                 // sai este mês?
    const done = due && recCovered(r, ym);
    const next = due ? null : recNextDue(r, ym);
    const title = done ? 'Já registado este mês — clicar volta a registar'
      : !due ? `Só volta a sair em ${monthLabel(next)} — clicar regista hoje na mesma`
      : 'Clicar regista hoje com este valor';
    return `
    <div class="rec-row${done ? ' done' : ''}${!due ? ' later' : ''}" data-rec-fire="${r.id}" title="${esc(title)}">
      <div class="rec-main">
        <div class="r1">${esc(recurrentLabel(r))}</div>
        <div class="r2">${recMetaHTML(r)}</div>
      </div>
      ${done ? `<span class="done-tag">${recRegisteredIn(r, ym) ? '✓ este mês' : '✓ antecipado'}</span>` : !due ? `<span class="later-tag">em ${esc(monthLabel(next))}</span>` : ''}
      <span class="rec-val ${r.type === 'receita' ? 'in' : ''}">${sign}${fmt(r.amount)}</span>
      <button class="btn-icon" data-rec-adjust="${r.id}" title="Ajustar valor/data antes de registar">${I.edit}</button>
    </div>`;
  };
  // em cada secção, primeiro os que saem este mês (a ordem por dia mantém-se)
  const byDueFirst = items => items.slice().sort((a, b) => Number(recIsDueIn(b, ym)) - Number(recIsDueIn(a, ym)));

  openModal({
    title: 'Registar recorrente',
    wide: true,
    body: sections.length
      ? `<p style="margin:0 0 6px;color:var(--ink-3);font-size:12px">Um clique regista hoje com o valor definido. O lápis abre o formulário pré-preenchido para ajustar.</p>` +
        sections.map(([title, items, sign]) => `<div class="card-note" style="margin:12px 0 6px">${title}</div>` + byDueFirst(items).map(r => rowHTML(r, sign)).join('')).join('')
      : `<div class="empty" style="padding:26px 10px">
          <h3>Ainda sem recorrentes</h3>
          <p>Cria a tua lista — renda, salário, subscrições, o reforço do fundo — e passa a registá-los com um clique.</p>
        </div>`,
    footHtml: `<button class="btn" data-new-rec style="margin-right:auto">${I.plus}<span>Novo recorrente</span></button>
               <button class="btn btn-primary" data-close-ok>Fechar</button>`,
    onMount(bd) {
      $('[data-close-ok]', bd).addEventListener('click', closeModal);
      $('[data-new-rec]', bd).addEventListener('click', () => { closeModal(); openRecurrentEditModal(null, { fromList: true }); });
      $$('[data-rec-adjust]', bd).forEach(b => b.addEventListener('click', e => {
        e.stopPropagation();
        const r = DB.recurrents.find(x => x.id === b.dataset.recAdjust);
        closeModal();
        openTxModal(null, r);
      }));
      $$('[data-rec-fire]', bd).forEach(row => row.addEventListener('click', () => {
        const r = DB.recurrents.find(x => x.id === row.dataset.recFire);
        if (!r) return;
        if (!recIsDueIn(r, ym)) {
          confirmModal({
            title: 'Registar fora do mês?',
            message: `«${esc(recurrentLabel(r))}» repete ${esc(recFreqText(r))} e só volta a sair em ${esc(monthLabel(recNextDue(r, ym)))}. Queres registar hoje na mesma (${fmt(r.amount)})?`,
            confirmLabel: 'Registar',
            onConfirm: () => registerFromRecurrent(r),
            onCancel: () => openRecurrentsListModal(),
          });
        } else if (recCovered(r, ym)) {
          confirmModal({
            title: 'Registar outra vez?',
            message: `«${esc(recurrentLabel(r))}» já foi registado ${recRegisteredIn(r, ym) ? 'este mês' : 'no mês passado (antecipado)'}. Queres registar novamente (${fmt(r.amount)}, hoje)?`,
            confirmLabel: 'Registar de novo',
            onConfirm: () => registerFromRecurrent(r),
            onCancel: () => openRecurrentsListModal(),
          });
        } else {
          registerFromRecurrent(r);
        }
      }));
    },
  });
}

function registerFromRecurrent(r) {
  DB.transactions.push({
    id: uid(),
    date: todayISO(),
    type: r.type,
    amount: r.amount,
    categoryId: r.type === 'transferencia' ? null : r.categoryId,
    accountId: r.accountId,
    toAccountId: r.type === 'transferencia' ? r.toAccountId : null,
    description: r.description || '',
    notes: r.notes || '',
    recurrentId: r.id,
    createdAt: new Date().toISOString(),
  });
  save();
  render();
  toast(`${recurrentLabel(r)} — ${fmt(r.amount)} registado ✓`);
  openRecurrentsListModal();
}

function openRecurrentEditModal(r = null, opts = {}) {
  const isEdit = !!r;
  let type = r ? r.type : 'despesa';
  const catOptions = t => DB.categories.filter(c => c.type === t)
    .map(c => `<option value="${c.id}"${r && r.categoryId === c.id ? ' selected' : ''}>${esc(c.name)}</option>`).join('');
  const accOptions = sel => DB.accounts.map(a => `<option value="${a.id}"${sel === a.id ? ' selected' : ''}>${esc(a.name)}</option>`).join('');

  openModal({
    title: isEdit ? 'Editar recorrente' : 'Novo recorrente',
    body: `
      <div class="seg" id="rSeg">
        <button type="button" data-t="despesa" class="exp">Despesa</button>
        <button type="button" data-t="receita" class="inc">Receita</button>
        <button type="button" data-t="transferencia">Transferência</button>
      </div>
      <div class="form-row">
        <div class="field" id="fRAmount"><label>Valor (€)</label><input id="inRAmount" inputmode="decimal" placeholder="0,00" value="${r ? (r.amount / 100).toFixed(2).replace('.', ',') : ''}" autocomplete="off"><div class="err">Indica um valor válido maior que zero.</div></div>
        <div class="field"><label>Dia habitual <span style="font-weight:400;color:var(--ink-3)">(opcional)</span></label><input id="inRDay" type="number" min="1" max="31" placeholder="ex.: 8" value="${r?.dayOfMonth || ''}"></div>
      </div>
      <div class="form-row">
        <div class="field"><label>Repete</label><select id="inRFreq">
          ${REC_FREQS.map(([f, label]) => `<option value="${f}"${recFreq(r) === f ? ' selected' : ''}>${label}</option>`).join('')}
        </select></div>
        <div class="field" id="fRMonth"><label id="lblRMonth">Mês em que sai</label><select id="inRMonth">
          ${Array.from({ length: 12 }, (_, i) => i + 1).map(m => `<option value="${m}"${(r?.refMonth ? recRefMonth(r) : Number(todayISO().slice(5, 7))) === m ? ' selected' : ''}>${monthName(m).charAt(0).toUpperCase() + monthName(m).slice(1)}</option>`).join('')}
        </select></div>
      </div>
      <p class="field-hint" id="rFreqHint" style="margin:-6px 0 13px"></p>
      <div class="form-row" id="rRowCatAcc">
        <div class="field"><label>Categoria</label><select id="inRCat"></select></div>
        <div class="field"><label>Conta</label><select id="inRAcc">${accOptions(r?.accountId)}</select></div>
      </div>
      <div class="form-row" id="rRowTransfer" style="display:none">
        <div class="field"><label>Da conta</label><select id="inRFrom">${accOptions(r?.accountId)}</select></div>
        <div class="field" id="fRTo"><label>Para a conta</label><select id="inRTo">${accOptions(r?.toAccountId)}</select><div class="err">Escolhe duas contas diferentes.</div></div>
      </div>
      <div class="field"><label>Descrição <span style="font-weight:400;color:var(--ink-3)">(opcional)</span></label><input id="inRDesc" placeholder="Ex.: Renda, Spotify, Salário…" value="${esc(r?.description || '')}" autocomplete="off"></div>
      <div class="field"><label>Notas <span style="font-weight:400;color:var(--ink-3)">(opcional)</span></label><textarea id="inRNotes" rows="2">${esc(r?.notes || '')}</textarea></div>
    `,
    footHtml: `<button class="btn" data-cancel>Cancelar</button>
               <button class="btn btn-primary" data-save>${isEdit ? 'Guardar' : 'Adicionar à lista'}</button>`,
    onMount(bd) {
      const seg = $('#rSeg', bd);
      const catSel = $('#inRCat', bd);
      const syncSeg = () => {
        $$('button', seg).forEach(b => b.classList.toggle('active', b.dataset.t === type));
        const isTr = type === 'transferencia';
        $('#rRowCatAcc', bd).style.display = isTr ? 'none' : '';
        $('#rRowTransfer', bd).style.display = isTr ? '' : 'none';
        if (!isTr) catSel.innerHTML = catOptions(type);
      };
      $$('button', seg).forEach(b => b.addEventListener('click', () => { type = b.dataset.t; syncSeg(); }));
      syncSeg();

      // periodicidade: o mês só interessa quando não é mensal (define em que meses sai)
      const freqSel = $('#inRFreq', bd), monthSel = $('#inRMonth', bd);
      const syncFreq = () => {
        const f = Number(freqSel.value);
        $('#fRMonth', bd).style.display = f === 1 ? 'none' : '';
        $('#lblRMonth', bd).textContent = f === 12 ? 'Mês em que sai' : 'Um dos meses em que sai';
        const probe = { freq: f, refMonth: Number(monthSel.value) };
        $('#rFreqHint', bd).textContent = f === 1 ? ''
          : `Sai em ${joinPt(recDueMonths(probe).map(monthName))} · próxima vez: ${monthLabel(recNextDue(probe, currentYM()))}. Só aparece «por registar» ${f === 12 ? 'nesse mês' : 'nesses meses'}.`;
      };
      freqSel.addEventListener('change', syncFreq);
      monthSel.addEventListener('change', syncFreq);
      syncFreq();

      $('[data-cancel]', bd).addEventListener('click', () => {
        closeModal();
        if (opts.fromList) openRecurrentsListModal();
      });
      const saveFn = () => {
        const amount = parseAmount($('#inRAmount', bd).value);
        $('#fRAmount', bd).classList.toggle('invalid', !amount);
        if (!amount) return;
        const isTr = type === 'transferencia';
        if (isTr) {
          const from = $('#inRFrom', bd).value, to = $('#inRTo', bd).value;
          const sameAcc = !from || !to || from === to;
          $('#fRTo', bd).classList.toggle('invalid', sameAcc);
          if (sameAcc) return;
        }
        let day = parseInt($('#inRDay', bd).value, 10);
        if (!isFinite(day) || day < 1 || day > 31) day = null;
        const rec = {
          id: r ? r.id : uid(),
          type,
          amount,
          categoryId: isTr ? null : catSel.value,
          accountId: isTr ? $('#inRFrom', bd).value : $('#inRAcc', bd).value,
          toAccountId: isTr ? $('#inRTo', bd).value : null,
          description: $('#inRDesc', bd).value.trim(),
          notes: $('#inRNotes', bd).value.trim(),
          dayOfMonth: day,
          freq: Number(freqSel.value) || 1,
          refMonth: Number(freqSel.value) > 1 ? Number(monthSel.value) : null,
          createdAt: r ? (r.createdAt || new Date().toISOString()) : new Date().toISOString(),
        };
        if (r) {
          const i = DB.recurrents.findIndex(x => x.id === r.id);
          DB.recurrents[i] = rec;
        } else {
          DB.recurrents.push(rec);
        }
        save(); closeModal();
        toast(isEdit ? 'Recorrente atualizado' : 'Recorrente adicionado à lista');
        if (opts.fromList) openRecurrentsListModal();
        else render();
      };
      $('[data-save]', bd).addEventListener('click', saveFn);
      bd.addEventListener('keydown', e => { if (e.key === 'Enter' && e.target.tagName !== 'TEXTAREA') { e.preventDefault(); saveFn(); } });
    },
  });
}

/* ---------- modal de movimento ---------- */
function openTxModal(tx = null, template = null) {
  if (tx && tx.interestOf) { toast('Juros automáticos — gere-os nas Opções da conta (Definições → Contas)'); return; }
  const isEdit = !!tx;
  let type = tx ? tx.type : (template ? template.type : 'despesa');
  const defaultDate = tx ? tx.date : (template ? todayISO() : (UI.month === currentYM() ? todayISO() : UI.month + '-01'));
  const accPre = tx ? tx.accountId : template?.accountId;
  const toPre = tx ? tx.toAccountId : template?.toAccountId;

  const catOptions = t => DB.categories.filter(c => c.type === t)
    .map(c => `<option value="${c.id}">${esc(c.name)}</option>`).join('');

  const accOptions = sel => DB.accounts.map(a => `<option value="${a.id}"${sel === a.id ? ' selected' : ''}>${esc(a.name)}</option>`).join('');

  openModal({
    title: isEdit ? 'Editar movimento' : 'Novo movimento',
    body: `
      <div class="seg" id="segType">
        <button type="button" data-t="despesa" class="exp">Despesa</button>
        <button type="button" data-t="receita" class="inc">Receita</button>
        <button type="button" data-t="transferencia">Transferência</button>

        <div class="field"><label>Data</label><input id="inDate" type="date" value="${defaultDate}"></div>
      </div>
      <div class="form-row" id="rowCatAcc">

      </div>

      <button class="btn btn-primary" data-save>${isEdit ? 'Guardar' : 'Adicionar'}</button>`,
    onMount(bd) {
      const seg = $('#segType', bd);
      const catSel = $('#inCat', bd);
      const syncSeg = () => {
        $$('button', seg).forEach(b => b.classList.toggle('active', b.dataset.t === type));
        const isTr = type === 'transferencia';
        $('#rowCatAcc', bd).style.display = isTr ? 'none' : '';
        $('#rowTransfer', bd).style.display = isTr ? '' : 'none';
        $('#inDesc', bd).placeholder = isTr ? 'Ex.: Reforço do fundo de emergência' : 'Ex.: Supermercado, Renda, Salário…';
        if (!isTr) {
          catSel.innerHTML = catOptions(type);
          if (tx && tx.type === type) catSel.value = tx.categoryId;
          else if (template && template.type === type && template.categoryId) catSel.value = template.categoryId;
        }
      };
      $$('button', seg).forEach(b => b.addEventListener('click', () => { type = b.dataset.t; syncSeg(); }));
      syncSeg();

      const pre = tx || template;
      if (pre) {
        $('#inAmount', bd).value = (pre.amount / 100).toFixed(2).replace('.', ',');
        $('#inDesc', bd).value = pre.description || '';
        $('#inNotes', bd).value = pre.notes || '';
      }

      $('[data-cancel]', bd).addEventListener('click', closeModal);
      if (isEdit) $('[data-delete]', bd).addEventListener('click', () => { closeModal(); deleteTx(tx.id); });

      const saveFn = () => {
        const amount = parseAmount($('#inAmount', bd).value);
        const fA = $('#fAmount', bd);
        fA.classList.toggle('invalid', !amount);
        if (!amount) { $('#inAmount', bd).focus(); return; }
        const date = $('#inDate', bd).value || todayISO();
        const isTr = type === 'transferencia';
        if (isTr) {
          const from = $('#inFrom', bd).value, to = $('#inTo', bd).value;
          const sameAcc = !from || !to || from === to;
          $('#fTo', bd).classList.toggle('invalid', sameAcc);
          if (sameAcc) return;
        }
        const rec = {
          id: tx ? tx.id : uid(),
          date, type,
          amount,
          categoryId: isTr ? null : catSel.value,
          accountId: isTr ? $('#inFrom', bd).value : $('#inAcc', bd).value,
          toAccountId: isTr ? $('#inTo', bd).value : null,
          description: $('#inDesc', bd).value.trim(),
          notes: $('#inNotes', bd).value.trim(),
          recurrentId: tx ? (tx.recurrentId || null) : (template ? template.id : null),
          createdAt: tx ? (tx.createdAt || new Date().toISOString()) : new Date().toISOString(),
        };
        if (tx) {
          const i = DB.transactions.findIndex(x => x.id === tx.id);
          DB.transactions[i] = rec;
        } else {
          DB.transactions.push(rec);
        }
        save(); closeModal(); render();
        toast(isEdit ? 'Movimento atualizado' : 'Movimento adicionado');
      };
      $('[data-save]', bd).addEventListener('click', saveFn);
      bd.addEventListener('keydown', e => { if (e.key === 'Enter' && e.target.tagName !== 'TEXTAREA') { e.preventDefault(); saveFn(); } });
    },
  });
}

/* ---------- Orçamentos ---------- */
function renderBudgets(v) {
  const spent = spentByCategory(UI.month);
  const expCats = DB.categories.filter(c => c.type === 'despesa');
  const withBudget = [];
  const without = [];
  for (const c of expCats) {
    const b = DB.budgets.find(x => x.categoryId === c.id);
    if (b && b.limit > 0) withBudget.push({ cat: c, limit: b.limit, spent: spent.get(c.id) || 0 });
    else without.push(c);
  }
  const totLimit = withBudget.reduce((s, b) => s + b.limit, 0);
  const totSpent = withBudget.reduce((s, b) => s + b.spent, 0);

  const meterFor = meterColors;
  const alertPct = budgetAlertPct();

  v.innerHTML = `
    ${withBudget.length ? `
    <div class="card" style="margin-bottom:18px">
      <div class="card-head">
        <span class="card-title">Total orçamentado — <span style="text-transform:capitalize">${esc(monthLabel(UI.month))}</span></span>
        <span class="card-note"><strong style="color:var(--ink)">${fmt(totSpent)}</strong> de ${fmt(totLimit)}</span>
      </div>
      ${(() => { const p = totLimit ? totSpent / totLimit : 0; const mcol = meterFor(p); return `
        <div class="meter" style="background:${mcol.track}"><div class="fill" style="width:${Math.min(p * 100, 100).toFixed(1)}%;background:${mcol.fill}"></div></div>
        <div class="b-status ${p > 1 ? 'over' : p >= alertPct ? 'near' : ''}" style="margin-top:8px">${p > 1 ? `Excedeste o total em ${fmt(totSpent - totLimit)}` : `Restam ${fmt(totLimit - totSpent)} no total`}</div>`; })()}
    </div>
    <div class="budget-grid">
      ${withBudget.map(b => {
        const pct = b.spent / b.limit;
        const mcol = meterFor(pct);
        return `
        <div class="budget-card" data-cat="${b.cat.id}">
          <div class="b-head">
            <span class="b-name"><span class="c-dot" style="background:${catColor(b.cat)}"></span>${esc(b.cat.name)}</span>
            <span>
              <button class="btn-icon" data-edit-budget="${b.cat.id}" title="Editar limite">${I.edit}</button>
              <button class="btn-icon danger" data-del-budget="${b.cat.id}" title="Remover orçamento">${I.trash}</button>
            </span>
          </div>
          <div class="meter" style="background:${mcol.track}"><div class="fill" style="width:${Math.min(pct * 100, 100).toFixed(1)}%;background:${mcol.fill}"></div></div>
          <div class="b-nums"><span><strong>${fmt(b.spent)}</strong> gastos</span><span>limite ${fmt(b.limit)}</span></div>
          <div class="b-status ${pct > 1 ? 'over' : pct >= alertPct ? 'near' : ''}">
            ${pct > 1 ? `⚠ Excedido em ${fmt(b.spent - b.limit)}` : pct >= alertPct ? `Quase no limite — restam ${fmt(b.limit - b.spent)}` : `Restam ${fmt(b.limit - b.spent)}`}
          </div>
        </div>`;
      }).join('')}
    </div>` : `
    <div class="card"><div class="empty">
      <div class="e-icon">${I.budget}</div>
      <h3>Ainda sem orçamentos</h3>
      <p>Define limites mensais por categoria para controlares os gastos.</p>
    </div></div>`}

    ${without.length ? `
    <div class="card" style="margin-top:18px">
      <div class="card-head"><span class="card-title">Categorias sem orçamento</span></div>
      ${without.map(c => `
        <div class="no-budget-row">
          <span class="n"><span class="c-dot" style="background:${catColor(c)};width:8px;height:8px;border-radius:3px;display:inline-block"></span>${esc(c.name)}<span style="color:var(--ink-3);font-size:12px">· ${fmt(spent.get(c.id) || 0)} este mês</span></span>
          <button class="btn" data-set-budget="${c.id}" style="padding:5px 11px;font-size:12px">Definir limite</button>
        </div>`).join('')}
    </div>` : ''}
  `;

  $$('[data-set-budget]', v).forEach(b => b.addEventListener('click', () => openBudgetModal(b.dataset.setBudget)));
  $$('[data-edit-budget]', v).forEach(b => b.addEventListener('click', () => openBudgetModal(b.dataset.editBudget)));
  $$('[data-del-budget]', v).forEach(b => b.addEventListener('click', () => {
    DB.budgets = DB.budgets.filter(x => x.categoryId !== b.dataset.delBudget);
    save(); render(); toast('Orçamento removido');
  }));
}

function openBudgetModal(categoryId) {
  const cat = catById(categoryId);
  const existing = DB.budgets.find(b => b.categoryId === categoryId);
  openModal({
    title: `Orçamento — ${cat.name}`,
    body: `<div class="field" id="fLimit"><label>Limite mensal (€)</label>
      <input id="inLimit" inputmode="decimal" placeholder="0,00" value="${existing ? (existing.limit / 100).toFixed(2).replace('.', ',') : ''}" autocomplete="off">
      <div class="err">Indica um valor válido maior que zero.</div></div>`,
    footHtml: `<button class="btn" data-cancel>Cancelar</button><button class="btn btn-primary" data-save>Guardar</button>`,
    onMount(bd) {
      $('[data-cancel]', bd).addEventListener('click', closeModal);
      const saveFn = () => {
        const limit = parseAmount($('#inLimit', bd).value);
        $('#fLimit', bd).classList.toggle('invalid', !limit);
        if (!limit) return;
        if (existing) existing.limit = limit;
        else DB.budgets.push({ categoryId, limit });
        save(); closeModal(); render(); toast('Orçamento guardado');
      };
      $('[data-save]', bd).addEventListener('click', saveFn);
      bd.addEventListener('keydown', e => { if (e.key === 'Enter') { e.preventDefault(); saveFn(); } });
    },
  });
}

/* ---------- Objetivos ---------- */
function renderGoals(v) {
  const goals = [...(DB.goals || [])].sort((a, b) => (a.done - b.done) || (a.createdAt || '').localeCompare(b.createdAt || ''));
  const active = goals.filter(g => !g.done);
  const reserved = goalsReserved();

  const deadlineHint = g => {
    if (!g.deadline) return '';
    const saved = goalSaved(g);
    const missing = g.target - saved;
    const [y, m] = g.deadline.split('-').map(Number);
    const now = new Date();
    const monthsLeft = (y - now.getFullYear()) * 12 + (m - 1 - now.getMonth());
    const label = new Date(y, m - 1, 1).toLocaleDateString('pt-PT', { month: 'long', year: 'numeric' });
    if (missing <= 0) return ` · prazo ${label}`;
    if (monthsLeft <= 0) return ` · <span style="color:var(--crit)">prazo (${label}) já passou</span>`;
    return ` · até ${label} → ${fmt(Math.ceil(missing / monthsLeft))}/mês`;
  };

  v.innerHTML = `
    ${active.length ? `
    <div class="card" style="margin-bottom:18px">
      <div class="card-head">
        <span class="card-title">Total reservado</span>
        <span class="card-note">${active.length} objetivo${active.length !== 1 ? 's' : ''} ativo${active.length !== 1 ? 's' : ''}</span>
      </div>
      <div style="font-size:26px;font-weight:650;letter-spacing:-0.02em">${fmt(reserved)}</div>
      <div class="card-note" style="margin-top:2px">Este dinheiro continua nas tuas contas e no património — está apenas prometido. A despesa só se regista quando comprares.</div>
    </div>` : ''}

    ${goals.length ? `<div class="budget-grid">
      ${goals.map((g, i) => {
        const saved = goalSaved(g);
        const pct = g.target > 0 ? saved / g.target : 0;
        const full = pct >= 1;
        const color = PALETTE[i % PALETTE.length];
        const fill = g.done || full ? '#0ca30c' : '#2a78d6';
        const track = g.done || full ? '#d3ecd3' : '#dbe9fb';
        return `
        <div class="budget-card" style="${g.done ? 'opacity:.72' : ''}">
          <div class="b-head">
            <span class="b-name"><span class="c-dot" style="background:${color}"></span>${esc(g.name)}${g.done ? ' <span class="badge" style="margin-left:6px">Concluído 🎉</span>' : ''}</span>
            <span style="white-space:nowrap">
              ${!g.done ? `<button class="btn-icon" data-g-add="${g.id}" title="Reforçar">${I.plus}</button>
              <button class="btn-icon" data-g-take="${g.id}" title="Retirar">${I.minus}</button>` : ''}
              <button class="btn-icon" data-g-edit="${g.id}" title="Editar">${I.edit}</button>
              <button class="btn-icon danger" data-g-del="${g.id}" title="Apagar">${I.trash}</button>
            </span>
          </div>
          <div class="meter" style="background:${track}"><div class="fill" style="width:${Math.min(pct * 100, 100).toFixed(1)}%;background:${fill}"></div></div>
          <div class="b-nums"><span><strong>${fmt(saved)}</strong> de ${fmt(g.target)}</span><span>${(pct * 100).toFixed(0)} %</span></div>
          <div class="b-status ${full && !g.done ? '' : ''}">
            ${g.done ? 'Objetivo concluído — não conta como reservado' :
              full ? `✔ Alcançado!${deadlineHint(g)}` :
              `Faltam ${fmt(g.target - saved)}${deadlineHint(g)}`}
          </div>
          ${full && !g.done ? `<button class="btn" data-g-done="${g.id}" style="margin-top:10px;padding:5px 11px;font-size:12px">Marcar como concluído</button>` : ''}
        </div>`;
      }).join('')}
    </div>` : `
    <div class="card"><div class="empty">
      <div class="e-icon">${I.budget}</div>
      <h3>Ainda sem objetivos</h3>
      <p>Cria um objetivo — férias, um portátil novo, o que for — e vai reforçando ao teu ritmo.</p>
      <button class="btn btn-primary" id="btnEmptyGoal">${I.plus}<span>Novo objetivo</span></button>
    </div></div>`}
  `;

  const bE = $('#btnEmptyGoal');
  if (bE) bE.addEventListener('click', () => openGoalModal());
  const byId = id => DB.goals.find(g => g.id === id);
  $$('[data-g-add]', v).forEach(b => b.addEventListener('click', () => openGoalMoneyModal(byId(b.dataset.gAdd), 'add')));
  $$('[data-g-take]', v).forEach(b => b.addEventListener('click', () => openGoalMoneyModal(byId(b.dataset.gTake), 'take')));
  $$('[data-g-edit]', v).forEach(b => b.addEventListener('click', () => openGoalModal(byId(b.dataset.gEdit))));
  $$('[data-g-done]', v).forEach(b => b.addEventListener('click', () => {
    byId(b.dataset.gDone).done = true;
    save(); render(); toast('Objetivo concluído 🎉 Não te esqueças de registar a compra como despesa');
  }));
  $$('[data-g-del]', v).forEach(b => b.addEventListener('click', () => {
    const g = byId(b.dataset.gDel);
    confirmModal({
      title: 'Apagar objetivo?',
      message: `«${esc(g.name)}» tem ${fmt(goalSaved(g))} reservados. Apagar o objetivo apenas remove a etiqueta — o dinheiro continua nas tuas contas.`,
      confirmLabel: 'Apagar', danger: true,
      onConfirm() { DB.goals = DB.goals.filter(x => x.id !== g.id); save(); render(); toast('Objetivo apagado'); },
    });
  }));
}

function openGoalModal(g = null) {
  const isEdit = !!g;
  openModal({
    title: isEdit ? 'Editar objetivo' : 'Novo objetivo',
    body: `
      <div class="field" id="fGName"><label>Nome</label><input id="inGName" placeholder="Ex.: Férias no Japão, Portátil novo…" value="${esc(g?.name || '')}" autocomplete="off"><div class="err">Indica um nome.</div></div>
      <div class="form-row">
        <div class="field" id="fGTarget"><label>Valor alvo (€)</label><input id="inGTarget" inputmode="decimal" placeholder="0,00" value="${g ? (g.target / 100).toFixed(2).replace('.', ',') : ''}" autocomplete="off"><div class="err">Indica um valor maior que zero.</div></div>
        <div class="field"><label>Prazo <span style="font-weight:400;color:var(--ink-3)">(opcional)</span></label><input id="inGDeadline" type="month" value="${g?.deadline || ''}"></div>
      </div>
      ${!isEdit ? `<div class="field"><label>Já tens algum valor de lado? <span style="font-weight:400;color:var(--ink-3)">(opcional)</span></label><input id="inGInitial" inputmode="decimal" placeholder="0,00" autocomplete="off"></div>` : ''}
    `,
    footHtml: `<button class="btn" data-cancel>Cancelar</button><button class="btn btn-primary" data-save>${isEdit ? 'Guardar' : 'Criar objetivo'}</button>`,
    onMount(bd) {
      $('[data-cancel]', bd).addEventListener('click', closeModal);
      const saveFn = () => {
        const name = $('#inGName', bd).value.trim();
        const target = parseAmount($('#inGTarget', bd).value);
        $('#fGName', bd).classList.toggle('invalid', !name);
        $('#fGTarget', bd).classList.toggle('invalid', !target);
        if (!name || !target) return;
        const deadline = $('#inGDeadline', bd).value || null;
        if (g) {
          g.name = name; g.target = target; g.deadline = deadline;
        } else {
          const initial = parseAmount($('#inGInitial', bd)?.value || '') || 0;
          DB.goals.push({
            id: uid(), name, target, deadline, done: false,
            contributions: initial > 0 ? [{ id: uid(), date: todayISO(), amount: initial }] : [],
            createdAt: new Date().toISOString(),
          });
        }
        save(); closeModal(); render();
        toast(isEdit ? 'Objetivo atualizado' : 'Objetivo criado');
      };
      $('[data-save]', bd).addEventListener('click', saveFn);
      bd.addEventListener('keydown', e => { if (e.key === 'Enter') { e.preventDefault(); saveFn(); } });
    },
  });
}

function openGoalMoneyModal(g, mode) {
  const isAdd = mode === 'add';
  const saved = goalSaved(g);
  openModal({
    title: `${isAdd ? 'Reforçar' : 'Retirar de'} — ${g.name}`,
    body: `
      <p style="margin:0 0 12px;color:var(--ink-2);font-size:12.5px">Reservado atualmente: <strong>${fmt(saved)}</strong>${isAdd && g.target > saved ? ` · faltam ${fmt(g.target - saved)}` : ''}</p>
      <div class="field" id="fGAmt"><label>Valor (€)</label><input id="inGAmt" inputmode="decimal" placeholder="0,00" autocomplete="off"><div class="err" id="gAmtErr">Indica um valor válido.</div></div>
    `,
    footHtml: `<button class="btn" data-cancel>Cancelar</button><button class="btn btn-primary" data-save>${isAdd ? 'Reforçar' : 'Retirar'}</button>`,
    onMount(bd) {
      $('[data-cancel]', bd).addEventListener('click', closeModal);
      const saveFn = () => {
        const amt = parseAmount($('#inGAmt', bd).value);
        const f = $('#fGAmt', bd);
        let err = null;
        if (!amt) err = 'Indica um valor válido maior que zero.';
        else if (!isAdd && amt > saved) err = `Só tens ${fmt(saved)} reservados neste objetivo.`;
        $('#gAmtErr', bd).textContent = err || '';
        f.classList.toggle('invalid', !!err);
        if (err) return;
        g.contributions.push({ id: uid(), date: todayISO(), amount: isAdd ? amt : -amt });
        save(); closeModal(); render();
        toast(isAdd ? `+${fmt(amt)} no objetivo` : `${fmt(amt)} retirados do objetivo`);
      };
      $('[data-save]', bd).addEventListener('click', saveFn);
      bd.addEventListener('keydown', e => { if (e.key === 'Enter') { e.preventDefault(); saveFn(); } });
    },
  });
}

/* ---------- Investimentos ---------- */
function renderInvestments(v) {
  const t = invTotals();
  const plPct = t.invested > 0 ? t.pl / t.invested : NaN;
  const hasAnySale = DB.investments.some(p => positionCalc(p).hasSells);

  let slices = DB.investments
    .map((p, i) => ({ name: p.name, value: Math.round(p.quantity * p.currentPriceEur * 100), i }))
    .filter(s => s.value > 0)
    .sort((a, b) => b.value - a.value);
  if (slices.length > 8) {
    const top = slices.slice(0, 7);
    const rest = slices.slice(7).reduce((s, x) => s + x.value, 0);
    slices = [...top, { name: 'Outros', value: rest, i: -1 }];
  }
  slices = slices.map((s, idx) => ({ ...s, color: s.i === -1 ? OTHER_GRAY : PALETTE[idx % PALETTE.length] }));
  const sliceTotal = slices.reduce((s, x) => s + x.value, 0);

  v.innerHTML = `
    <div class="tiles" style="grid-template-columns:repeat(${hasAnySale ? 4 : 3},1fr)">
      <div class="tile">
        <div class="t-label">Total investido</div>
        <div class="t-value">${fmt(t.invested)}</div>
        <div class="t-delta">${DB.investments.length} posiç${DB.investments.length === 1 ? 'ão' : 'ões'}</div>
      </div>
      <div class="tile">
        <div class="t-label">Valor atual</div>
        <div class="t-value">${fmt(t.current)}</div>
        <div class="t-delta">preços atualizados manualmente</div>
      </div>
      <div class="tile">
        <div class="t-label">${hasAnySale ? 'Resultado não realizado' : 'Resultado'}</div>
        <div class="t-value ${t.pl > 0 ? 'pl-pos' : t.pl < 0 ? 'pl-neg' : ''}">${fmtSign(t.pl)}</div>
        <div class="t-delta ${t.pl > 0 ? 'up' : t.pl < 0 ? 'down' : ''}">${isFinite(plPct) ? fmtPct(plPct) + ' sobre o investido' : '—'}</div>
      </div>
      ${hasAnySale ? `<div class="tile">
        <div class="t-label">Resultado realizado</div>
        <div class="t-value ${t.realized > 0 ? 'pl-pos' : t.realized < 0 ? 'pl-neg' : ''}">${fmtSign(t.realized)}</div>
        <div class="t-delta">de vendas já concretizadas</div>
      </div>` : ''}
    </div>

    ${DB.investments.length ? `
    <div class="charts-row" style="grid-template-columns:0.9fr 1.4fr">
      <div class="card">
        <div class="card-head"><span class="card-title">Alocação da carteira</span></div>
        <div class="donut-wrap">
          ${donutHTML(slices, 'Total', fmt(sliceTotal))}
          <div class="donut-legend">
            ${slices.map(s => `<div class="row"><span class="dot" style="background:${s.color}"></span><span class="name">${esc(s.name)}</span><span class="val">${fmt(s.value)}</span><span class="pct">${(s.value / sliceTotal * 100).toFixed(1).replace('.', ',')}%</span></div>`).join('')}
          </div>
        </div>
      </div>
      <div class="card">
        <div class="card-head"><span class="card-title">Posições</span></div>
        <div style="overflow-x:auto">
        <table class="inv-table">
          <thead><tr>
            <th>Ativo</th><th>Tipo</th><th class="num">Qtd.</th><th class="num">Preço médio</th><th class="num">Preço atual</th><th class="num">Valor</th><th class="num">Resultado</th><th></th>
          </tr></thead>
          <tbody>
            ${DB.investments.map(p => {
              const c = positionCalc(p);
              const cur = Math.round(c.quantity * p.currentPriceEur * 100);
              const invested = c.costRemaining;
              const pl = cur - invested;
              const pct = invested > 0 ? pl / invested : NaN;
              const closed = c.quantity === 0 && c.hasSells;
              return { p, c, cur, invested, pl, pct, closed };
            }).sort((a, b) => (a.closed - b.closed) || (b.cur - a.cur)).map(({ p, c, cur, invested, pl, pct, closed }) => {
              const resultVal = closed ? c.realized : pl;
              return `<tr data-id="${p.id}" data-hist-inv="${p.id}" title="Clicar para ver o histórico de compras e vendas" style="cursor:pointer" class="${closed ? 'inv-closed' : ''}">
                <td class="inv-name">${esc(p.name)}${c.inconsistent ? ` <span class="inv-warn" title="Uma venda excedeu as unidades disponíveis nessa data — revê o histórico">⚠</span>` : ''}${closed ? ` <span class="badge">Fechada</span>` : ''}${p.ticker ? `<small>${esc(p.ticker)}</small>` : ''}</td>
                <td><span class="badge">${esc(p.type)}</span></td>
                <td class="num">${fmtQty(c.quantity)}</td>
                <td class="num">${closed ? '<span style="color:var(--ink-3)">—</span>' : fmtPrice(p.avgPriceEur)}</td>
                <td class="num">${fmtPrice(p.currentPriceEur)}</td>
                <td class="num">${closed ? '<span style="color:var(--ink-3)">—</span>' : `<strong>${fmt(cur)}</strong><br><small style="color:var(--ink-3)">inv. ${fmt(invested)}</small>`}</td>
                <td class="num ${resultVal > 0 ? 'pl-pos' : resultVal < 0 ? 'pl-neg' : ''}">${fmtSign(resultVal)}<br><small${closed ? ' style="color:var(--ink-3)"' : ''}>${closed ? 'realizado' : (isFinite(pct) ? fmtPct(pct) : '')}</small></td>
                <td class="num" style="white-space:nowrap">
                  <button class="btn-icon" data-buy-inv="${p.id}" title="Registar compra">${I.plus}</button>
                  ${c.quantity > 0 ? `<button class="btn-icon" data-sell-inv="${p.id}" title="Registar venda">${I.sell}</button>` : ''}
                  <button class="btn-icon" data-edit-inv="${p.id}" title="Editar posição">${I.edit}</button>
                  <button class="btn-icon danger" data-del-inv="${p.id}" title="Apagar">${I.trash}</button>
                </td>
              </tr>`;
            }).join('')}
          </tbody>
        </table>
        </div>
      </div>
    </div>` : `
    <div class="card"><div class="empty">
      <div class="e-icon">${I.inv}</div>
      <h3>Ainda sem investimentos</h3>
      <p>Adiciona a primeira posição — ações, ETFs, cripto, fundos, o que tiveres.</p>
      <button class="btn btn-primary" id="btnEmptyInv">${I.plus}<span>Nova posição</span></button>
    </div></div>`}
  `;

  bindDonutTooltip(slices);
  $$('[data-hist-inv]', v).forEach(tr => tr.addEventListener('click', e => {
    if (e.target.closest('button')) return;
    openInvHistoryModal(DB.investments.find(p => p.id === tr.dataset.histInv));
  }));
  $$('[data-buy-inv]', v).forEach(b => b.addEventListener('click', () => openBuyModal(DB.investments.find(p => p.id === b.dataset.buyInv))));
  $$('[data-sell-inv]', v).forEach(b => b.addEventListener('click', () => openSellModal(DB.investments.find(p => p.id === b.dataset.sellInv))));
  $$('[data-edit-inv]', v).forEach(b => b.addEventListener('click', () => openInvModal(DB.investments.find(p => p.id === b.dataset.editInv))));
  $$('[data-del-inv]', v).forEach(b => b.addEventListener('click', () => {
    const p = DB.investments.find(x => x.id === b.dataset.delInv);
    confirmModal({
      title: 'Apagar posição?',
      message: `«${esc(p.name)}» será removida da carteira${(p.purchases || []).some(l => l.depositTxId) ? ', incluindo os depósitos de vendas associados nas contas' : ''}. Esta ação não pode ser anulada.`,
      confirmLabel: 'Apagar', danger: true,
      onConfirm() {
        DB.investments = DB.investments.filter(x => x.id !== p.id);
        DB.transactions = DB.transactions.filter(t => t.investmentId !== p.id);
        save(); render(); toast('Posição apagada');
      },
    });
  }));
  const bE = $('#btnEmptyInv');
  if (bE) bE.addEventListener('click', () => openInvModal());
}

function openInvModal(p = null) {
  const isEdit = !!p;
  const initialAcc = DB.accounts[0]?.id || '';
  openModal({
    title: isEdit ? 'Editar posição' : 'Nova posição',
    body: `
      <div class="form-row">

      <div class="form-row">

        <div class="field" id="fAvg"><label>Preço médio de compra (€)</label><input id="inAvg" inputmode="decimal" placeholder="0,00" autocomplete="off"><div class="err">Preço inválido.</div></div>
      </div>
      <div class="field"><label>Pagar com <span style="font-weight:400;color:var(--ink-3)">(débito do custo total desta posição)</span></label><select id="inAcc">
        ${DB.accounts.map(a => `<option value="${a.id}"${initialAcc === a.id ? ' selected' : ''}>${esc(a.name)}</option>`).join('')}
        <option value=""${initialAcc === '' ? ' selected' : ''}>Não debitar (dinheiro de fora)</option>
      </select></div>`}
      <div class="field" id="fCur"><label>Preço atual (€)</label><input id="inCur" inputmode="decimal" placeholder="0,00" value="${p ? numToInput(p.currentPriceEur) : ''}" autocomplete="off"><div class="err">Preço inválido.</div></div>
      <div class="field"><label>Notas <span style="font-weight:400;color:var(--ink-3)">(opcional)</span></label><textarea id="inInvNotes" rows="2">${esc(p?.notes || '')}</textarea></div>
    `,
    footHtml: `<button class="btn" data-cancel>Cancelar</button><button class="btn btn-primary" data-save>${isEdit ? 'Guardar' : 'Adicionar'}</button>`,
    onMount(bd) {
      $('[data-cancel]', bd).addEventListener('click', closeModal);
      const saveFn = () => {
        const name = $('#inName', bd).value.trim();
        const cur = parsePrice($('#inCur', bd).value);
        $('#fName', bd).classList.toggle('invalid', !name);
        $('#fCur', bd).classList.toggle('invalid', cur === null);
        let qty = null, avg = null;
        if (!isEdit) {
          qty = parseQty($('#inQty', bd).value);
          avg = parsePrice($('#inAvg', bd).value);
          $('#fQty', bd).classList.toggle('invalid', qty === null || qty <= 0);
          $('#fAvg', bd).classList.toggle('invalid', avg === null);
          if (qty === null || qty <= 0 || avg === null) return;
        }
        if (!name || cur === null) return;
        if (p) {
          p.name = name;
          p.ticker = $('#inTicker', bd).value.trim();
          p.type = $('#inType', bd).value;
          p.currentPriceEur = cur;
          p.notes = $('#inInvNotes', bd).value.trim();
          p.updatedAt = new Date().toISOString();
        } else {
          const initialLot = { id: uid(), date: todayISO(), amountPaid: Math.round(qty * avg * 100), quantity: qty, kind: 'buy', initial: true };
          const rec = {
            id: uid(),
            name,
            ticker: $('#inTicker', bd).value.trim(),
            type: $('#inType', bd).value,
            quantity: qty,
            avgPriceEur: avg,
            currentPriceEur: cur,
            notes: $('#inInvNotes', bd).value.trim(),
            updatedAt: new Date().toISOString(),
            purchases: [initialLot],
          };
          syncBuyDebit(rec, initialLot, $('#inAcc', bd).value, initialLot.amountPaid, initialLot.date);
          recalcPosition(rec);
          DB.investments.push(rec);
        }
        save(); closeModal(); render();
        toast(isEdit ? 'Posição atualizada' : 'Posição adicionada');
      };
      $('[data-save]', bd).addEventListener('click', saveFn);
      bd.addEventListener('keydown', e => { if (e.key === 'Enter' && e.target.tagName !== 'TEXTAREA') { e.preventDefault(); saveFn(); } });
    },
  });
}

  const initialAcc = isEdit
    ? (purchase.debitTxId && DB.transactions.some(t => t.id === purchase.debitTxId) ? DB.transactions.find(t => t.id === purchase.debitTxId).accountId : '')
    : (DB.accounts[0]?.id || '');
  openModal({
    title: `${isEdit ? 'Editar compra' : 'Registar compra'} — ${p.name}`,
    body: `
      <div class="form-row">
        <div class="field" id="fBAmt"><label>Total gasto (€)</label><input id="inBAmt" inputmode="decimal" placeholder="0,00" value="${purchase ? (purchase.amountPaid / 100).toFixed(2).replace('.', ',') : ''}" autocomplete="off"><div class="err">Indica um valor maior que zero.</div></div>
        <div class="field"><label>Data</label><input id="inBDate" type="date" value="${purchase ? purchase.date : todayISO()}"></div>
      </div>
      <div class="field" id="fBQty"><label>Quantidade recebida</label><input id="inBQty" inputmode="decimal" placeholder="ex.: 0,00038" value="${purchase ? fmtQty(purchase.quantity) : ''}" autocomplete="off"><div class="err">Quantidade inválida.</div></div>
      <div class="field"><label>Pagar com</label><select id="inBAcc">
        ${DB.accounts.map(a => `<option value="${a.id}"${initialAcc === a.id ? ' selected' : ''}>${esc(a.name)}</option>`).join('')}
        <option value=""${initialAcc === '' ? ' selected' : ''}>Não debitar (dinheiro de fora)</option>
      </select></div>
      ${!isEdit ? `<div class="field" id="fBCur"><label>Preço atual agora <span style="font-weight:400;color:var(--ink-3)">(opcional — atualiza o preço de mercado)</span></label><input id="inBCur" inputmode="decimal" placeholder="${numToInput(p.currentPriceEur)}" autocomplete="off"><div class="err">Preço inválido.</div></div>` : ''}
      <p style="margin:0;color:var(--ink-3);font-size:11.5px">Inclui comissões no total gasto. O total sai da conta escolhida — como não é uma despesa, não conta para «Despesas», orçamentos nem para o fundo de emergência.</p>
    `,
    footHtml: `<button class="btn" data-cancel>Cancelar</button><button class="btn btn-primary" data-save>${isEdit ? 'Guardar' : 'Registar compra'}</button>`,
    onMount(bd) {
      $('[data-cancel]', bd).addEventListener('click', () => {
        closeModal();
        if (opts.fromHistory) openInvHistoryModal(p, opts.page || 1);
      });

        const amt = parseAmount($('#inBAmt', bd).value);
        const qty = parseQty($('#inBQty', bd).value);
        $('#fBAmt', bd).classList.toggle('invalid', !amt);
        $('#fBQty', bd).classList.toggle('invalid', qty === null || qty <= 0);
        if (!amt || qty === null || qty <= 0) return;
        let curPrice = null;
        if (!isEdit) {
          const raw = $('#inBCur', bd).value.trim();
          if (raw) {
            curPrice = parsePrice(raw);
            $('#fBCur', bd).classList.toggle('invalid', curPrice === null);
            if (curPrice === null) return;
          }
        }
        const date = $('#inBDate', bd).value || todayISO();
        let lot;
        if (purchase) {
          lot = purchase;
          lot.date = date; lot.amountPaid = amt; lot.quantity = qty;
        } else {
          lot = { id: uid(), date, amountPaid: amt, quantity: qty, kind: 'buy' };
          p.purchases.push(lot);
        }
        syncBuyDebit(p, lot, $('#inBAcc', bd).value, amt, date);
        recalcPosition(p);
        if (curPrice !== null) p.currentPriceEur = curPrice;
        p.updatedAt = new Date().toISOString();
        save(); closeModal(); render();
        toast(`${isEdit ? 'Compra atualizada' : 'Compra registada'} — novo preço médio ${fmtPrice(p.avgPriceEur)}`);
        if (opts.fromHistory) openInvHistoryModal(p, opts.page || 1);
      };
